/* Na het laden opnieuw tekenen als deze post nog gekozen is, in het Feed View-scherm dat nu open is. Op sleutel vergelijken:
   na nieuwe cijfers, of na terugkomen op Feed View, zijn er nieuwe objecten. Met een vergelijking op het object zelf bleef

const nogGekozen = it => { const S = huidig; return S && actief(S) && S.sel && S.sel.key === it.key ? S : null; };
function laadCaption(S, it){
  const p = it.post;
  if (!p || CAPTIONS.has(p.id)) return;
  if (CS.staat.demo){ CAPTIONS.set(p.id, {caption: CS.DEMO.caption.replace(/^[^\n]*/, p.haakje), notes: ''}); return; }
  CAPTIONS.set(p.id, {laden: true});
  CS.paginaTekst(p.id).then(text => {
    const content = (String(text).match(/<content>([\s\S]*?)<\/content>/) || [])[1] || '';
    const clean = s => s.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/^#{1,6}\s*/gm, '').replace(/\n{3,}/g, '\n\n').trim();
    const caption = CS.captionUit(content || text);
    CAPTIONS.set(p.id, {caption, notes: caption ? clean(content.replace(/```[^\n]*\n[\s\S]*?```/g, '')) : ''});
  }).catch(e => { CAPTIONS.set(p.id, {fout: CS.foutTekst(e, 'Notion')}); })
    .finally(() => { const G = nogGekozen(it); if (G) tekenDetail(G); });
}
function laadSlides(S, it){
  const p = it.post;
  if (!p || CS.staat.demo || snapBeeld(it) || !isDrive(it.link) || SLIDES.has(p.id)) return;
  const st = {status:'laden', bestanden: null, beelden: [], fout: null};
  SLIDES.set(p.id, st);
  CS.slidesVan(p).then(async best => {
    st.bestanden = best.slice(0, 20); st.status = 'beelden';
    { const G = nogGekozen(it); if (G) tekenViewer(G, G.sel); }
    let i = 0;
    const werker = async () => {
      while (i < st.bestanden.length){
        const n = i++;
        try{ st.beelden[n] = await CS.drive.beeld(st.bestanden[n].id); }catch(e){ st.beelden[n] = null; if (!st.fout) st.fout = CS.foutTekst(e, 'Google Drive'); }
        const G = nogGekozen(it); if (G && (n === slideNr || n < 2 || n % 3 === 0)) tekenViewer(G, G.sel);
      }
    };
    await Promise.all([werker(), werker(), werker()]);
    st.status = 'klaar';
    if (st.beelden[0] && !TEGELS.get(p.id)) verklein(st.beelden[0], 360).then(k => { TEGELS.set(p.id, k); store.set('cs:fv:tegel:' + p.link, k); document.querySelectorAll(`.fv-tile[data-post="${CSS.escape(p.id)}"]`).forEach(x => zetTegelBeeld(x, k)); zetKalBeeld(p.id, k); });
  }).catch(e => { st.status = 'fout'; st.fout = CS.foutTekst(e, 'Google Drive'); })

/* De knoppen staan rechts op de regel met de labels. Passen de labels er dan niet meer naast op één regel,

function pasTopAan(S){

let topKijker = null;
function tekenViewer(S, it){
  const v = mk('div', 'fv-viewer'), stage = mk('div', 'fv-stage');
  const host = S.viewerHost; if (!host) return;
  host.textContent = '';

    else if (p && ZONDER_DESIGN.includes(p.status) && !it.link) msg = 'Nog geen design. Klik op Maak het design om de slides te maken.';
    else if (it.link && !isDrive(it.link) && !CS.staat.demo) msg = 'De slides staan niet in Google Drive, dus de studio kan ze hier niet tonen. Bekijk ze via de link.';
    else if (!it.link) msg = it.kind === 'live' ? 'Er staat geen link naar de slides in Notion. Bekijk de post op Instagram.' : `Nog geen slides gekoppeld. Zet de link naar de map in Google Drive in het veld ${(CS.staat.schema && CS.staat.schema.linkVeld) || 'Drive'} in Notion.`;

    stage.append(leeg); v.append(stage); host.append(v); return;
  }
  slideNr = Math.max(0, Math.min(slideNr, slides.length - 1));

    const img = mk('img'); img.alt = `Slide ${slideNr + 1}`;
    if (cur.snap) img.addEventListener('error', () => img.replaceWith(mk('div', 'fv-empty', `Slide ${cur.page} kon niet geladen worden. Bekijk de post op Instagram.`)), {once: true});

    const prev = mk('button', 'fv-nav fv-prev', '‹'); prev.type = 'button'; prev.setAttribute('aria-label', 'Vorige slide'); prev.hidden = slideNr === 0;
    const next = mk('button', 'fv-nav fv-next', '›'); next.type = 'button'; next.setAttribute('aria-label', 'Volgende slide'); next.hidden = slideNr === slides.length - 1;
    prev.addEventListener('click', () => ga(-1)); next.addEventListener('click', () => ga(1));

  else if (st && st.fout) v.append(mk('p', 'fv-err', st.fout));

function ga(stap){

document.addEventListener('keydown', e => {

/* ---------- veranderen in Notion ---------- */
async function bewaarDatum(S, it, waarde){
  const p = it.post; if (!p || !waarde) return;
  const voor = p.datum;
  S.bericht = {key: it.key, tekst: 'Opslaan in Notion…'}; tekenDetail(S);
  try{
    if (CS.staat.demo) S.bericht = {key: it.key, ok: true, tekst: 'Voorbeeld: in Notion is niets veranderd.'};
    else {
      await CS.notion.zetVelden(p.id, {'date:Publicatiedatum:start': waarde, 'date:Publicatiedatum:is_datetime': 0});
      const r = (CS.staat.rijen || []).find(x => x.url === p.url); if (r) r['date:Publicatiedatum:start'] = waarde;
      S.bericht = {key: it.key, ok: true, tekst: 'Opgeslagen in Notion'};
    }
    p.datum = waarde;
  }catch(e){ p.datum = voor; S.bericht = {key: it.key, ok: false, tekst: CS.foutTekst(e, 'Notion')}; }
  if (!actief(S)) return;
  bouwOpnieuw(S); tekenGrid(S); tekenDetail(S); tekenKalender(S);
  if (CS.aandacht) CS.aandacht.bijwerken();
}
async function zetStatus(S, it, s){
  const p = it.post; if (!p) return;
  if (s === 'Gepland' && !p.datum && !(await CS.bevestig('Geen publicatiedatum', 'Deze post heeft nog geen publicatiedatum in Notion. Puk plant hem pas in als er een datum is. Toch op Gepland zetten?', 'Op Gepland zetten'))) return;
  const voor = p.status;
  S.bericht = {key: it.key, tekst: 'Opslaan in Notion…'}; tekenDetail(S);
  try{
    if (CS.staat.demo) S.bericht = {key: it.key, ok: true, tekst: `Voorbeeld: de status is hier ${s}, in Notion is niets veranderd.`};
    else {
      await CS.notion.zetVelden(p.id, {Status: s});
      const r = (CS.staat.rijen || []).find(x => x.url === p.url); if (r) r.Status = s;
      S.bericht = {key: it.key, ok: true, tekst: `De status is nu ${s}`};
    }
    p.status = s;
  }catch(e){ p.status = voor; S.bericht = {key: it.key, ok: false, tekst: CS.foutTekst(e, 'Notion')}; }
  if (!actief(S)) return;
  bouwOpnieuw(S); tekenGrid(S); tekenDetail(S); tekenKalender(S);
  if (CS.aandacht) CS.aandacht.bijwerken();

const pageText = text => (String(text).match(/<content>([\s\S]*?)<\/content>/) || [])[1] || String(text || '');
const sectionOf = (content, name) => (content.match(new RegExp('(?:^|\\n)## ' + name + '\\s*\\n([\\s\\S]*?)(?=\\n## |$)')) || [])[1] || '';
const cleanMd = s => String(s).replace(/<page[\s\S]*?<\/page>/g, '').replace(/<br\s*\/?>/gi, '\n').replace(/<code>([\s\S]*?)<\/code>/g, '$1').replace(/<[^>]+>/g, '').replace(/\*\*/g, '').replace(/`/g, '').replace(/\\$/gm, '').replace(/\\([.\-*_#>()[\]!+])/g, '$1').trim();
function parseFolder(text){
  const content = pageText(text), doelRaw = sectionOf(content, 'Doel').trim();
  const pages = [...content.matchAll(/<page url="([^"]+)"[^>]*>\s*([\s\S]*?)\s*<\/page>/g)].map((m, i) => ({url: m[1], title: cleanMd(m[2]), i, datum: titelDatum(cleanMd(m[2]))}));
  // De nieuwste: de subpagina met de nieuwste datum in de titel; zonder datums de onderste
  const opDatum = pages.filter(p => p.datum).sort((a, b) => b.datum.localeCompare(a.datum) || b.i - a.i);
  return {doel: /^nog geen doel/i.test(cleanMd(doelRaw)) ? '' : cleanMd(doelRaw), doelRaw, latest: opDatum[0] || pages[pages.length - 1] || null};
}
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function titelDatum(s){
  const t = String(s || '').toLowerCase();
  let m = t.match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = t.match(new RegExp('(\\d{1,2})\\s+(' + MAANDEN.join('|') + ')\\s+(\\d{4})'));
  return m ? m[3] + '-' + String(MAANDEN.indexOf(m[2]) + 1).padStart(2, '0') + '-' + m[1].padStart(2, '0') : null;
}
function parseAnalysis(text){
  const content = pageText(text);
  const when = content.match(/Gemaakt:\s*(\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}:\d{2}))?/);
  const focus = sectionOf(content, 'Focus').split(/\n(?=### )/).map(chunk => {
    const lines = chunk.split('\n'), head = (lines.shift() || '').replace(/^###\s*/, '');
    if (!head.trim()) return null;
    const item = {titel: cleanMd(head).replace(/^\d+\.\s*/, ''), waarom: '', actie: '', teamlid: null, opdracht: null};
    lines.forEach(l => {
      const f = cleanMd(l).match(/^(Waarom|Actie|Teamlid|Opdracht):\s*([\s\S]*)$/i);
      if (!f) return;
      const k = f[1].toLowerCase(), v = f[2].trim();
      if (k === 'teamlid') item.teamlid = TEAM[v] ? v : null;
      else if (k === 'opdracht') item.opdracht = v || null;
      else item[k] = v;
    });
    return item;
  }).filter(Boolean);
  return {analyse: cleanMd(sectionOf(content, 'Analyse')), focus, datum: when ? when[1] : null, tijd: when ? when[2] || null : null};
}
/* Waar de analyses van Ruby staan. Nieuwe template (Content Studio): op haar eigen pagina in Content Team,
   onder Analyses. Oudere kopie (Social Media Planner): de pagina Analyses van Ruby. */
async function rubyPagina(){
  const k = CS.staat.koppelingen || (CS.staat.koppelingen = {});
  if (k.rubyTeamPagina) return k.rubyTeamPagina;
  try{
    const v = await CS.zorgVoorWeergave('team');
    const rijen = v ? await CS.notion.view(v, 50) : [];
    const r = rijen.find(x => String(x.Naam || x.Name || x.Teamlid || '').replace(/<[^>]+>/g, '').trim().split(/\s+/)[0].toLowerCase() === 'ruby');
    if (r && r.url){
      const id = CS.idUitUrl(r.url) || r.url;
      const tekst = (await CS.notion.haal(id)).text || '';
      if (/<page url=|##\s*(Doel|Analyses)/.test(pageText(tekst))){ k.rubyTeamPagina = id; CS.bewaarKoppelingen(); return id; }
    }
  }catch(e){ console.warn('Ruby in Content Team zoeken lukte niet', e); }
  if (k.analysesPagina) return k.analysesPagina;
  const res = await CS.notion.zoek('Analyses van Ruby');
  const r = res.find(x => x.type !== 'database' && /analyses van ruby/i.test(x.title || ''));
  if (!r) return null;
  k.analysesPagina = CS.idUitUrl(r.url) || r.id;
  CS.bewaarKoppelingen();
  return k.analysesPagina;
}

  FV.hideTip();
  CS.schermKop(w, 'ANALYSES', UITLEG, periodeKnoppen());

  if (!A.doelGeladen || A.doelGeladen < vers) taken.push(laadDoel().then(() => { A.doelGeladen = Date.now(); }));

}});

/* ---------- doel en voortgang ---------- */
function goalValue(back = 0){
  const m = metricOf(), d = monthDays(back);
  if (!d.length) return null;
  if (m === 'Engagement') return sum(d, 'reach') ? per1000(sum(d, 'interactions'), sum(d, 'reach')) / 10 : null;
  const k = METRICS[m].key;
  return d.some(x => x[k] != null) ? sum(d, k) : null;
}
function renderGoal(){
  const host = E.goals; if (!host) return; host.textContent = '';
  if (A.goalEdit){
    const ta = mk('textarea', 'an-goalinput'); ta.rows = 3; ta.value = A.goalText || '';
    ta.placeholder = 'Bijvoorbeeld: ik wil 50 inschrijvingen voor mijn weggever per maand, via de link in mijn bio.';
    ta.setAttribute('aria-label', 'Je doel met Instagram');
    const row = mk('div', 'an-goalbtns');
    const save = mk('button', 'fv-btn fv-solid', 'Opslaan'); save.type = 'button';
    const cancel = mk('button', 'fv-btn', 'Annuleren'); cancel.type = 'button';
    save.addEventListener('click', async () => {
      const v = ta.value.trim(); if (!v){ ta.focus(); return; }
      A.goalText = v; A.goalEdit = false; A.doel = null; A.goalNote = null;
      if (huidig) renderAnalyse(huidig);
      await bewaarDoel();
      interpretGoal(v); saveGoalToRuby(v);
      if (huidig && actief(huidig)) renderGoal();
    });
    cancel.addEventListener('click', () => { A.goalEdit = false; renderGoal(); });
    row.append(save, cancel);
    host.append(ta, row);
    setTimeout(() => ta.focus(), 0);
  } else {
    host.append(mk('p', 'an-goaltext' + (A.goalText ? '' : ' an-leeg'), A.goalText || (A.doelGeladen || CS.staat.demo ? 'Je hebt nog geen doel. Vertel in je eigen woorden wat je met Instagram wilt bereiken.' : 'Je doel wordt geladen.')));
    const row = mk('div', 'an-goalbtns');
    const edit = mk('button', 'fv-btn', A.goalText ? 'Doel aanpassen' : 'Doel invullen'); edit.type = 'button';
    edit.addEventListener('click', () => { A.goalEdit = true; FV.hideTip(); renderGoal(); });
    row.append(edit);
    if (A.goalBusy) row.append(mk('span', 'an-muted', 'Claude leest je doel…'));
    else if (A.goalNote) row.append(mk('span', 'an-muted', A.goalNote));
    host.append(row);
  }
  renderGoalMeter();
}
function renderGoalMeter(){
  const v = goalValue(), t = target(), st = E.goalState, mark = E.goalMark, bar = E.goalMeter, prev = goalValue(1);
  const isE = metricOf() === 'Engagement', f = x => isE ? nf1.format(x) + '%' : nf.format(Math.round(x)), mn = monthName(0), pace = monthPace();
  const prevTxt = prev != null ? ` In ${monthName(1)}: ${f(prev)}.` : '';
  const unit = METRICS[metricOf()].unit.replace(/^% /, '');
  mark.hidden = true; bar.style.width = '0'; bar.className = '';
  if (t == null){ st.className = 'an-goalstate an-flat'; st.textContent = v == null ? 'Zet een getal in je doel, dan zie je hier je voortgang.' : `${cap(mn)} tot nu toe: ${f(v)} ${unit}.${prevTxt} Zet een getal in je doel, dan zie je hoe ver je bent.`; return; }
  if (pace.done === 0){ st.className = 'an-goalstate an-flat'; st.textContent = `${cap(mn)} is vandaag begonnen. Morgen zie je hier je eerste stand.${prevTxt}`; return; }
  if (v == null){ st.className = 'an-goalstate an-flat'; st.textContent = 'Je voortgang verschijnt zodra je Instagram-cijfers zijn opgehaald.'; return; }
  bar.style.width = Math.round(Math.min(1, v / t) * 100) + '%';
  if (isE){
    st.textContent = `Gemiddeld in ${mn} tot nu toe: ${f(v)} engagement, je doel is ${f(t)}.${prevTxt}`;
    st.className = 'an-goalstate ' + (v >= t ? 'an-up' : v >= t * .85 ? 'an-flat' : 'an-down');
    bar.className = v >= t ? 'an-up' : v >= t * .85 ? '' : 'an-down';
    return;
  }
  const exp = t * pace.frac;
  mark.hidden = false; mark.style.left = `calc(${pace.frac * 100}% - 1px)`;
  st.textContent = `${cap(mn)} tot nu toe: ${f(v)} van ${f(t)} ${unit}.` + (v >= t ? ' Doel gehaald.' : v >= exp ? ' Je ligt op schema.' : ` Op schema zou je nu op ${nf.format(Math.round(exp))} staan.`) + prevTxt;
  st.className = 'an-goalstate ' + (v >= t || v >= exp ? 'an-up' : v >= exp * .85 ? 'an-flat' : 'an-down');
  bar.className = v >= t || v >= exp ? 'an-up' : v >= exp * .85 ? '' : 'an-down';
}

/* ---------- groei ---------- */
const LINES = [{key:'followers', label:'Volgers', color:'--fv-l1', dash:''}, {key:'views7', label:'Weergaven', color:'--fv-l2', dash:'7 5'}, {key:'eng7', label:'Engagement', color:'--fv-l3', dash:'2 4'}];
function renderChart(){
  const host = E.chart; host.textContent = '';
  if (!hasDaily()){ waitBox(host); return; }
  const all = state.days.map((d, i, arr) => { const s = arr.slice(Math.max(0, i - 6), i + 1), r = sum(s, 'reach'), vs = s.filter(x => x.views != null); return Object.assign({}, d, {views7: vs.length ? sum(vs, 'views') / vs.length : null, eng7: r && s.some(x => x.interactions != null) ? sum(s, 'interactions') / r * 100 : null}); });
  const pts = all.filter(d => within(d.day, ranges().cur));
  if (pts.length < 2){ waitBox(host, 'Nog te weinig dagen met cijfers in deze periode.'); return; }
  const avail = LINES.filter(ln => pts.some(d => d[ln.key] != null));
  if (!avail.length){ waitBox(host); return; }
  const legend = mk('div', 'an-legend'); legend.style.marginBottom = '6px';
  avail.forEach(ln => {
    const b = mk('button', 'fv-lg'); b.type = 'button'; b.setAttribute('aria-pressed', String(A.lineOn[ln.key]));
    b.innerHTML = `<svg width="22" height="8" aria-hidden="true"><line x1="1" y1="4" x2="21" y2="4" style="stroke:var(${ln.color})" stroke-width="2.5" stroke-dasharray="${ln.dash}" stroke-linecap="round"/></svg>${ln.label}`;
    b.addEventListener('click', () => { A.lineOn[ln.key] = !A.lineOn[ln.key]; if (!avail.some(l => A.lineOn[l.key])) A.lineOn[ln.key] = true; renderChart(); });
    legend.append(b);
  });
  host.append(legend);
  const postDays = new Set(state.live.filter(p => p.liveDate).map(p => ago(p)));
  const W = 900, H = 240, L = 16, R = 16, T = 16, B = 28, last = pts.length - 1;
  const x = i => L + i * (W - L - R) / Math.max(1, last);
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', `Volgers, weergaven en engagement in ${periodLabel()}`);
  const add = (tag, attrs, text) => { const e = document.createElementNS(ns, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (text != null) e.textContent = text; svg.append(e); return e; };
  [0, .25, .5, .75, 1].forEach(f => add('line', {x1: L, x2: W - R, y1: T + f * (H - T - B), y2: T + f * (H - T - B), style: 'stroke:var(--fv-grid)', 'stroke-width': 1}));
  pts.forEach((d, i) => { if (postDays.has(d.ago)) add('line', {x1: x(i), x2: x(i), y1: H - B, y2: H - B + 5, style: 'stroke:var(--fv-muted)', 'stroke-width': 1.5}); });
  const scales = {};
  avail.forEach(ln => {
    const vals = pts.map(d => d[ln.key]).filter(v => v != null); let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .12 || 1; lo -= pad; hi += pad;
    scales[ln.key] = v => T + (hi - v) * (H - T - B) / (hi - lo);
  });
  avail.filter(ln => A.lineOn[ln.key]).forEach(ln => {
    const y = scales[ln.key];
    let path = '', pen = false, lastI = -1;
    pts.forEach((d, i) => { const v = d[ln.key]; if (v == null){ pen = false; return; } path += (pen ? 'L' : 'M') + `${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; lastI = i; });
    add('path', {d: path, fill: 'none', style: `stroke:var(${ln.color})`, 'stroke-width': 2, 'stroke-dasharray': ln.dash, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'});
    if (lastI >= 0) add('circle', {cx: x(lastI), cy: y(pts[lastI][ln.key]), r: 4.5, style: `fill:var(${ln.color});stroke:var(--fv-surface)`, 'stroke-width': 2});
  });
  [0, Math.floor(last / 2), last].forEach(i => add('text', {x: x(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === last ? 'end' : 'middle', 'font-size': 11, style: 'fill:var(--fv-muted)'}, pts[i].ago === 0 ? 'vandaag' : fmtShort(pts[i].day)));
  const cross = add('line', {x1: 0, x2: 0, y1: T, y2: H - B, style: 'stroke:var(--fv-muted)', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0});
  const hit = add('rect', {x: L, y: T, width: W - L - R, height: H - T - B + 6, fill: 'transparent'});
  const box = mk('div', 'an-chart'); box.append(svg); host.append(box);
  const ct = mk('div', 'an-ctip'); ct.hidden = true; box.append(ct);
  const move = clientX => {
    const r = svg.getBoundingClientRect(), sx = (clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(last, Math.round((sx - L) / ((W - L - R) / Math.max(1, last))))), d = pts[i];
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('opacity', 1);
    const post = state.live.find(p => p.liveDate && ago(p) === d.ago);
    ct.hidden = false;
    ct.innerHTML = `<b>${esc(fmtLong(d.day))}</b>` + (d.followers != null ? `<br>Volgers: ${nf.format(d.followers)}${d.new_followers != null ? ' (' + (d.new_followers >= 0 ? '+' : '') + d.new_followers + ')' : ''}` : '') + (d.views7 != null ? `<br>Weergaven: ${nf.format(Math.round(d.views7))} per dag` : '') + (d.eng7 != null ? `<br>Engagement: ${nf1.format(d.eng7)}%` : '') + (post ? `<br>Post: ${esc((post.hook || '').split('\n')[0].slice(0, 60))}` : '');
    const px = x(i) * r.width / W, w = ct.offsetWidth, hw = box.clientWidth;
    ct.style.left = Math.max(w / 2, Math.min(hw - w / 2, px)) + 'px';
  };
  hit.addEventListener('mousemove', ev => move(ev.clientX));
  hit.addEventListener('touchstart', ev => move(ev.touches[0].clientX), {passive: true});
  hit.addEventListener('touchmove', ev => move(ev.touches[0].clientX), {passive: true});
  hit.addEventListener('mouseleave', () => { ct.hidden = true; cross.setAttribute('opacity', 0); });
}

/* ---------- fases ---------- */
const FASE_TAAK = {
  Unaware: 'Unaware-posts zijn er om nieuwe mensen te bereiken die jou nog niet kennen.',
  Problemaware: 'Problemaware-posts moeten herkenning geven. Opslaan en delen laten zien dat mensen zich erin herkennen.',
  Solutionaware: 'Solutionaware-posts moeten mensen nieuwsgierig maken naar jouw aanpak, zodat ze naar je profiel gaan.',
  Productaware: 'Productaware-posts moeten mensen naar je aanbod brengen: je profiel, je link of je DM.',
  Fullyaware: 'Fullyaware-posts zijn voor mensen die bijna klaar zijn om te kopen. Ze moeten tot actie leiden.',
  Persoonlijk: 'Persoonlijke posts bouwen de band met je volgers. Reacties laten zien dat mensen zich met jou verbonden voelen.'
};
// Elke fase krijgt het cijfer dat bij zijn taak hoort (zie de uitleg bij de i-knop)
function faseMetric(f){
  if (/persoonlijk/i.test(f)) return {get: a => per1000(sum(a, 'comments'), sum(a, 'reach')), say: v => `kregen ${nf.format(Math.round(v))} reacties per 1.000 mensen die ze zagen`};
  if (/unaware/i.test(f)) return {get: a => sum(a, 'reach') / Math.max(1, a.length), say: v => `bereikten gemiddeld ${nf.format(Math.round(v))} mensen per post`};
  if (/problem/i.test(f)) return {get: a => per1000(sum(a, x => (x.saved || 0) + (x.shares || 0)), sum(a, 'reach')), say: v => `werden ${nf.format(Math.round(v))} keer opgeslagen of gedeeld per 1.000 mensen die ze zagen`};
  return {get: a => per1000(sum(a, 'profile'), sum(a, 'reach')), say: v => `zorgden voor ${nf.format(Math.round(v))} profielacties per 1.000 mensen die ze zagen`};
}
function renderFases(){
  const host = E.fases; host.textContent = '';
  const all = state.live.filter(p => hasIns(p) && p.fase), cur = all.filter(inP), goalF = goal().fases;
  if (!all.length){ waitBox(host, state.live.some(hasIns) ? UNLINKED('fase') : WAIT()); return; }
  F.forEach(f => {
    const m = faseMetric(f), g = cur.filter(x => x.fase === f), val = m.get(g), avg = m.get(all), ratio = avg ? val / avg : 0;
    const row = mk('div', 'an-brow');
    const nm = mk('span', 'an-nm'); nm.append(f); if (goalF.includes(f)) nm.append(mk('span', 'an-star', '★'));
    const trk = mk('div', 'an-trk'); const fill = mk('div', 'an-fill'); fill.style.width = Math.min(100, ratio * 50) + '%'; trk.append(fill);
    const mkk = mk('div', 'an-mark'); mkk.style.left = '50%'; mkk.style.background = 'var(--fv-muted)'; trk.append(mkk);
    const [cls, txt] = verdict(ratio, g.length);
    const right = mk('span', 'an-right'); right.append(mk('span', 'fv-badge ' + cls, txt));
    row.append(nm, trk, right);
    const parts = [[f, FASE_TAAK[f] || '']];
    if (!g.length) parts.push(['In deze periode', `Je hebt geen ${f}-posts met cijfers in ${periodLabel()}.`]);
    else parts.push(['Wat je ziet', `Je ${g.length === 1 ? 'post' : g.length + ' posts'} in deze fase ${m.say(val)}. Je gemiddelde is ${nf.format(Math.round(avg))}, dus dat is ${cmpWord(val, avg)} gemiddeld.`]);
    if (goalF.includes(f)) parts.push(['Belangrijk voor je doel', 'Voor je doel telt deze fase extra mee.']);
    setTip(row, parts);
    host.append(row);
  });
}

/* ---------- pillars ---------- */

   ['plan', 'Gepland', '<rect x="1" y="2" width="20" height="5" rx="1" style="fill:color-mix(in srgb, var(--fv-seq) 40%, var(--fv-surface))"/>'],
   ['want', 'Gewenst', '<rect x="10" y="0" width="2.5" height="9" style="fill:var(--fv-acc)"/>']].forEach(([k, label, swatch]) => {
    const b = mk('button', 'fv-lg'); b.type = 'button'; b.setAttribute('aria-pressed', String(A.pilOn[k]));
    b.innerHTML = `<svg width="22" height="9" aria-hidden="true">${swatch}</svg>${label}`;
    b.addEventListener('click', () => { A.pilOn[k] = !A.pilOn[k]; if (!A.pilOn.placed && !A.pilOn.plan) A.pilOn[k === 'placed' ? 'plan' : 'placed'] = true; renderPillars(); });

function renderPillars(){
  renderPillarLegend();
  const host = E.pillars; host.textContent = '';
  const P = pillarList(), cur = state.live.filter(p => inP(p) && p.pillar), plans = state.plans.filter(p => p.pillar);
  if (!P.length){ waitBox(host, A.pillarsGeladen ? 'Nog geen pillars gevonden. Controleer je Content Pillars in Notion.' : 'Je pillars worden geladen uit Notion.'); return; }
  const scale = Math.max(50, ...P.map(p => p.want || 0)) * 1.25;
  P.forEach(p => {
    const g = cur.filter(x => pkey(x.pillar) === p.key), gp = plans.filter(x => pkey(x.pillar) === p.key);
    const share = cur.length ? g.length / cur.length * 100 : 0, shareP = plans.length ? gp.length / plans.length * 100 : 0;
    const row = mk('div', 'an-brow');
    row.append(mk('span', 'an-nm', p.name));
    const bars = mk('div'), tracks = [];
    if (A.pilOn.placed){ const trk = mk('div', 'an-trk'); const fill = mk('div', 'an-fill'); fill.style.width = Math.min(100, share / scale * 100) + '%'; trk.append(fill); tracks.push(trk); }
    if (A.pilOn.plan){ const trk2 = mk('div', 'an-trk' + (A.pilOn.placed ? ' an-thin' : '')); const fill2 = mk('div', 'an-fill an-plan'); fill2.style.width = Math.min(100, shareP / scale * 100) + '%'; trk2.append(fill2); tracks.push(trk2); }
    if (A.pilOn.want && p.want != null) tracks.forEach(t => { const m = mk('div', 'an-mark'); m.style.left = (p.want / scale * 100) + '%'; m.style.background = 'var(--fv-acc)'; t.append(m); });
    bars.append(...tracks);
    // Het label vergelijkt met je gewenste verdeling: geplaatst als dat aan staat, anders gepland
    const usePlaced = A.pilOn.placed && cur.length, base = usePlaced ? share : shareP, has = usePlaced || (A.pilOn.plan && plans.length);
    const d = p.want == null || !has ? null : base - p.want;
    const [bc, bt] = p.want == null ? ['fv-b-none', 'Geen doel'] : !has ? ['fv-b-none', 'Geen posts'] : Math.abs(d) <= 5 ? ['fv-b-good', 'Op koers'] : d < 0 ? ['fv-b-bad', 'Te weinig'] : ['fv-b-warn', 'Te veel'];
    const right = mk('span', 'an-right'); right.append(mk('span', 'fv-badge ' + bc, bt));
    row.append(bars, right);
    const parts = [[p.name, `Geplaatst: ${g.length} van ${cur.length} gekoppelde posts in ${periodLabel()}${cur.length ? ` (${Math.round(share)}%)` : ''}. Gepland: ${gp.length} van ${plans.length}${plans.length ? ` (${Math.round(shareP)}%)` : ''}.${p.want != null ? ` Gewenst: ${p.want}%.` : ''}`]];
    if (p.want != null && has) parts.push(['Het label', `Vergelijkt je ${usePlaced ? 'geplaatste' : 'geplande'} posts met je gewenste ${p.want}%. Op koers: hooguit 5 procentpunt ernaast.`]);
    if (p.want != null){
      const diff = Math.round(shareP - p.want);
      parts.push(['Je planning', !plans.length ? 'Er staan nog geen geplande posts met een pillar.' : Math.abs(diff) <= 5 ? `Dicht bij je gewenste ${p.want}%.` : diff > 0 ? `${diff} procentpunt meer dan je gewenste ${p.want}%.` : `${-diff} procentpunt minder dan je gewenste ${p.want}%.`]);
    } else parts.push(['Gewenst', 'Vul in Notion bij deze pillar de kolom Gewenst in.']);
    if (!cur.length) parts.push(['Geplaatst', 'Geen geplaatste posts in deze periode die aan een pillar gekoppeld zijn.']);
    setTip(row, parts);
    host.append(row);
  });
}

/* ---------- format per pillar ---------- */
function renderHeat(){
  const host = E.heat; host.textContent = '';
  const pool = state.live.filter(p => p.liveDate && ago(p) < 90 && hasIns(p) && p.pillar);
  if (!pool.length){ waitBox(host, state.live.some(hasIns) ? UNLINKED('pillar') : WAIT()); return; }
  const P = pillarList(), hm = mk('div', 'an-hm'); hm.style.setProperty('--cols', P.length);
  hm.append(mk('span'));
  P.forEach(p => hm.append(mk('span', 'an-ch', p.name)));
  const all = [];
  FORMATS.forEach(s => P.forEach(p => { const g = pool.filter(x => fmtPost(x) === s && pkey(x.pillar) === p.key); if (g.length && sum(g, 'reach')) all.push({s, p: p.name, v: per1000(sum(g, inter), sum(g, 'reach')) / 10, n: g.length}); }));
  if (!all.length){ waitBox(host); return; }
  const lo = Math.min(...all.map(a => a.v)), hi = Math.max(...all.map(a => a.v)), avg = per1000(sum(pool, inter), sum(pool, 'reach')) / 10;
  const best = all.filter(a => a.n >= 2).sort((a, b) => b.v - a.v)[0] || all.slice().sort((a, b) => b.v - a.v)[0];
  const many = s => s === 'Reel' ? 'Reels' : 'Carrousels';
  FORMATS.forEach(s => {
    hm.append(mk('span', 'an-rh', s));
    P.forEach(p => {
      const c = mk('div', 'an-cell'), hit = all.find(a => a.s === s && a.p === p.name);
      if (!hit){ c.textContent = 'geen'; c.style.cssText = 'background:var(--fv-soft);color:var(--fv-muted);font-weight:400'; setTip(c, [[`${many(s)} over ${p.name}`, `Je hebt de laatste 3 maanden geen ${many(s).toLowerCase()} over ${p.name} geplaatst, dus hier is nog niets over te zeggen.`]]); }
      else {
        const t = hi > lo ? (hit.v - lo) / (hi - lo) : .5, k = Math.round(12 + t * 80);
        c.style.background = `color-mix(in srgb, var(--fv-seq) ${k}%, var(--fv-surface))`; c.style.color = k > 52 ? 'var(--fv-surface)' : 'var(--fv-ink)';
        c.textContent = nf1.format(hit.v) + '%';
        const isBest = hit === best, other = all.find(a => a.p === p.name && a.s !== s), otherS = FORMATS.find(x => x !== s);
        if (isBest) c.classList.add('an-best');
        const parts = [[isBest ? `Werkt het best: ${many(s).toLowerCase()} over ${p.name}` : `${many(s)} over ${p.name}`,
          `${nf1.format(hit.v)}% engagement over ${hit.n} ${hit.n === 1 ? 'post' : 'posts'}. Op elke 100 mensen die ze zagen, kwamen er ${nf1.format(hit.v)} likes, reacties, keren opgeslagen of gedeeld. Dat is ${cmpWord(hit.v, avg)} je gemiddelde van ${nf1.format(avg)}%.`]];
        parts.push(['Tegenover ' + otherS.toLowerCase() + 's', other ? `${many(otherS)} over ${p.name} halen ${nf1.format(other.v)}%. ${other.v < hit.v ? `Voor ${p.name} werken ${many(s).toLowerCase()} dus beter.` : other.v > hit.v ? `Voor ${p.name} werken ${many(otherS).toLowerCase()} dus beter.` : 'Ze werken even goed.'}` : `${many(otherS)} over ${p.name} heb je de laatste 3 maanden niet geplaatst.`]);
        parts.push(['Wat kun je ermee', isBest ? `Dit is je sterkste combinatie. Plan vaker ${many(s).toLowerCase()} over ${p.name}.` : hit.v >= avg * 1.15 ? 'Werkt beter dan gemiddeld. Een goede keuze om vaker te plannen.' : hit.v <= avg * .85 ? (other && other.v > hit.v ? `Werkt minder goed dan gemiddeld. Maak ${p.name} liever als ${otherS.toLowerCase()}.` : 'Werkt minder goed dan gemiddeld. Kijk bij je beste posts wat daar anders is.') : 'Doet het ongeveer gemiddeld.']);
        if (hit.n < 2) parts.push(['Let op', 'Gebaseerd op één post. Neem het mee als hint, nog niet als conclusie.']);
        setTip(c, parts);
      }
      hm.append(c);
    });
  });
  host.append(hm);
}

/* ---------- beste posts ---------- */
function renderTop(){

  const withReach = cur.every(hasIns);
  const score = x => withReach ? per1000(inter(x), x.reach) : (x.likes || 0) + (x.comments || 0);
  cur.slice().sort((a, b) => score(b) - score(a)).slice(0, 3).forEach(x => {
    const row = mk('button', 'an-toprow'); row.type = 'button';

    row.append(mid, mk('span', 'an-topwhy', withReach ? `${nf.format(Math.round(score(x)))} per 1.000 bereik\n${nf.format(x.saved || 0)} keer opgeslagen` : `${nf.format(x.likes || 0)} likes\n${nf.format(x.comments || 0)} reacties`));

/* ---------- analyse en focus ---------- */
function copyBtn(label, text){
  const b = mk('button', '', label); b.type = 'button';
  b.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(text); b.textContent = 'Gekopieerd'; }
    catch(e){ b.textContent = 'Kopiëren lukte niet'; }
    setTimeout(() => { b.textContent = label; }, 1800);
  });
  b.dataset.fvtip = tipHTML([['Wat er gekopieerd wordt', text]]);
  return b;
}
// Alle cijfers van de analyse op een rij, voor de eigen conclusie
function collectFacts(){
  const cur = state.live.filter(inP), ins = cur.filter(hasIns), allI = state.live.filter(hasIns);
  const dC = dIn(), dP = dPrev(), g = goal(), gv = goalValue();
  const eng = d => sum(d, 'reach') ? Math.round(per1000(sum(d, 'interactions'), sum(d, 'reach'))) / 10 : null;
  const kpi = k => dC.some(x => x[k] != null) ? {nu: sum(dC, k), ervoor: dP.some(x => x[k] != null) ? sum(dP, k) : null} : null;
  const fases = F.map(f => { const m = faseMetric(f), grp = ins.filter(x => x.fase === f); return grp.length ? {fase: f, posts: grp.length, score: Math.round(m.get(grp)), gemiddeld: Math.round(m.get(allI)), betekenis: m.say(m.get(grp))} : null; }).filter(Boolean);
  const plans = state.plans.filter(x => x.pillar);
  const pillars = pillarList().map(pl => ({pillar: pl.name, geplaatstPct: cur.filter(x => x.pillar).length ? Math.round(cur.filter(x => pkey(x.pillar) === pl.key).length / cur.filter(x => x.pillar).length * 100) : null, geplandPct: plans.length ? Math.round(plans.filter(x => pkey(x.pillar) === pl.key).length / plans.length * 100) : null, gewenstPct: pl.want}));
  const combos = [];
  FORMATS.forEach(s => pillarList().forEach(pl => { const grp = state.live.filter(x => x.liveDate && ago(x) < 90 && hasIns(x) && pkey(x.pillar) === pl.key && fmtPost(x) === s); if (grp.length && sum(grp, 'reach')) combos.push({format: s, pillar: pl.name, posts: grp.length, engagementPct: Math.round(per1000(sum(grp, inter), sum(grp, 'reach'))) / 10}); }));
  const in14 = state.plans.filter(x => x.date && x.date >= today() && dayDiff(x.date, today()) <= 14);
  return {
    periode: periodLabel(), vergelijkingMet: prevLabel(),
    doel: {tekst: g.tekst || null, cijfer: g.cijfer, maanddoel: g.maanddoel, dezeMaand: {maand: monthName(0), dagenGeteld: monthPace().done, dagenInMaand: monthPace().dim, stand: gv == null ? null : Math.round(gv * 10) / 10}, belangrijkeFases: g.fases},
    kerncijfers: {postsGeplaatst: {nu: cur.length, ervoor: state.live.filter(inPrev).length}, bereik: kpi('reach'), engagementPct: {nu: eng(dC), ervoor: eng(dP)}},
    fases, pillars, formatPerPillar: combos,
    planning: {komende14Dagen: in14.length, datumInVerleden: state.plans.filter(x => x.date && x.date < today() && !['Design', 'Video'].includes(x.status)).length}
  };
}
// Conclusie en focuspunten zonder Claude, op basis van vaste regels
function ruleAnalysis(f){
  const k = f.kerncijfers, g = f.doel, parts = [];
  const ch = o => o && o.ervoor ? ` (${pct(o.nu, o.ervoor) >= 0 ? '+' : ''}${pct(o.nu, o.ervoor)}% ten opzichte van ${f.vergelijkingMet})` : '';
  parts.push(`In ${f.periode} plaatste je ${k.postsGeplaatst.nu} ${k.postsGeplaatst.nu === 1 ? 'post' : 'posts'}.`);
  if (k.bereik) parts.push(`Je bereikte ${nf.format(k.bereik.nu)} accounts${ch(k.bereik)}${k.engagementPct.nu != null ? ` en je engagement was ${nf1.format(k.engagementPct.nu)}%` : ''}.`);
  const gs = g.dezeMaand.stand, gf = x => g.cijfer === 'Engagement' ? nf1.format(x) + '%' : nf.format(x), unit = METRICS[g.cijfer].unit.replace(/^% /, '');
  if (gs != null && g.maanddoel == null) parts.push(`Voor je doel volg je ${unit}: ${gf(gs)} in ${g.dezeMaand.maand} tot nu toe.`);
  else if (gs != null) parts.push(`Voor je doel sta je in ${g.dezeMaand.maand} op ${gf(gs)} van ${gf(g.maanddoel)} ${unit}, na ${g.dezeMaand.dagenGeteld} van de ${g.dezeMaand.dagenInMaand} dagen.`);
  const best = f.fases.filter(x => x.posts >= 2).sort((a, b) => b.score / (b.gemiddeld || 1) - a.score / (a.gemiddeld || 1));
  if (best.length > 1) parts.push(`${best[0].fase}-posts doen het het best, ${best[best.length - 1].fase}-posts blijven het meest achter.`);
  const focus = [];
  const gap = f.pillars.filter(x => x.gewenstPct != null && x.geplandPct != null).map(x => Object.assign({}, x, {d: x.gewenstPct - x.geplandPct})).sort((a, b) => b.d - a.d)[0];
  if (gap && gap.d > 8){
    const who = /persoonlijk/i.test(gap.pillar) ? 'Viggo' : /expertise|autoriteit/i.test(gap.pillar) ? 'Sam' : 'Hanna';
    focus.push({titel: `Meer ${gap.pillar}`, waarom: `${gap.pillar} staat in je planning op ${gap.geplandPct}%, je wilt ${gap.gewenstPct}%.`, actie: who === 'Viggo' ? 'Vertel Viggo over je week, zodat er persoonlijke verhalen uit komen.' : who === 'Sam' ? 'Laat Sam zoeken welke posts over dit onderwerp nu goed werken in je niche.' : 'Laat Hanna haakjes maken voor deze pillar.', teamlid: who,
      opdracht: who === 'Viggo' ? '@viggo, ik wil meer persoonlijke posts. Help me een verhaal uit mijn week te vinden dat past bij mijn doel.' : who === 'Sam' ? `@sam, zoek welke posts over ${gap.pillar.toLowerCase()} nu goed werken in mijn niche.` : `@haakjes, maak haakjes voor de pillar ${gap.pillar}.`});
  }
  const weak = best.length > 1 ? best[best.length - 1] : null;
  if (weak && weak.score < weak.gemiddeld * .85) focus.push({titel: `${weak.fase} versterken`, waarom: `Je ${weak.fase}-posts ${weak.betekenis}, onder je gemiddelde van ${nf.format(weak.gemiddeld)}.`, actie: 'Laat Hanna sterkere haakjes maken voor deze fase, en Koen ze controleren.', teamlid: 'Hanna', opdracht: `@haakjes, maak sterkere haakjes voor de fase ${weak.fase}.`});
  const top = f.formatPerPillar.filter(x => x.posts >= 2).sort((a, b) => b.engagementPct - a.engagementPct)[0];
  if (top) focus.push({titel: `Meer ${top.format.toLowerCase()}s over ${top.pillar}`, waarom: `Die combinatie haalt ${nf1.format(top.engagementPct)}% engagement over ${top.posts} posts, je beste combinatie.`, actie: 'Kies een idee voor deze pillar en laat Cato er een caption bij schrijven.', teamlid: 'Cato', opdracht: `@caption, schrijf een caption voor een ${top.format.toLowerCase()} over ${top.pillar}.`});
  if (f.planning.komende14Dagen < 3) focus.push({titel: 'Vul je planning', waarom: `Je hebt ${f.planning.komende14Dagen} ${f.planning.komende14Dagen === 1 ? 'post' : 'posts'} gepland voor de komende twee weken.`, actie: 'Laat Hanna haakjes maken voor nieuwe ideeën die bij je doel passen.', teamlid: 'Hanna', opdracht: '@haakjes, maak haakjes voor nieuwe posts die passen bij mijn doel met Instagram.'});
  if (f.planning.datumInVerleden) focus.push({titel: 'Planning opschonen', waarom: `${f.planning.datumInVerleden} geplande ${f.planning.datumInVerleden === 1 ? 'post heeft' : 'posts hebben'} een datum in het verleden.`, actie: `Geef ze in Feed View een nieuwe datum, of zet de status op ${LIVE} als ze al online staan.`, teamlid: null, opdracht: null});
  return {conclusie: parts.join(' '), focus: focus.slice(0, 3)};
}
function renderActs(){
  const host = E.acts; if (!host) return; host.textContent = '';

const gezicht = naam => { const n = String(naam || '').toLowerCase().split(/\s+/)[0]; return (CS.TEAMFOTOS || {})[n] || null; };

const zonderTags = t => String(t || '').replace(/<[^>]+>/g, '').replace(/\n{3,}/g, '\n\n').trim();

/* ---------- Team ---------- */
const rond = naam => { const f = gezicht(naam); return el('div', {class:'rond'}, f ? el('img', {src: f, alt: ''}) : String(naam || '?')[0]); };
/* De pagina van een teamlid. Updates staan er op twee manieren:
   - als kopje met de datum op de pagina zelf (de zondagtaak, nieuwste bovenaan), of
   - als subpagina met de datum in de titel (Ruby: Analyse 22 november 2026, onder Analyses, nieuwste onderaan).
   We nemen de update met de nieuwste datum. Het kopje Doel is geen update en tonen we niet. */
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const twee = n => String(n).padStart(2, '0');
const datumUit = s => {
  const t = String(s || '').toLowerCase();
  let m = t.match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = t.match(new RegExp('(\\d{1,2})\\s+(' + MAANDEN.join('|') + ')\\s+(\\d{4})')); if (m) return m[3] + '-' + twee(MAANDEN.indexOf(m[2]) + 1) + '-' + twee(m[1]);
  return null;
};
const inhoudVan = tekst => { const t = String(tekst || ''); const c = t.match(/<content>([\s\S]*?)<\/content>/); return !c || /This page is blank/i.test(t) ? '' : c[1]; };
const isKop = r => /^#{1,3}\s/.test(String(r).trim());
const kopNiveau = r => (String(r).trim().match(/^#+/) || [''])[0].length;
function naarRegels(inhoud){
  const t = inhoud.replace(/<database[\s\S]*?<\/database>/g, '').replace(/<\/?(callout|toggle|details|summary|columns?|div|span|p|br\/?)[^>]*>/g, '\n')
    .replace(/<page[^>]*>([^<]*)<\/page>/g, '$1').replace(/<[^>]+>/g, '').replace(/\\([.\-*_#>()[\]!+])/g, '$1');
  return t.split('\n').map(r => r.replace(/\s+$/, '')).filter((r, i, a) => r.trim() || (a[i - 1] && a[i - 1].trim()));
}
/* Haal een blok (kopje met wat eronder staat) weg, zoals Doel */
function zonderBlok(regels, naam){
  const i = regels.findIndex(r => isKop(r) && new RegExp('^#+\\s*' + naam + '\\s*$', 'i').test(r.trim()));
  if (i < 0) return regels;
  let j = i + 1; while (j < regels.length && !(isKop(regels[j]) && kopNiveau(regels[j]) <= kopNiveau(regels[i]))) j++;
  return regels.slice(0, i).concat(regels.slice(j));
}
const GEEN_UPDATE = /^#+\s*(doel|analyses|updates?|eerdere updates)\s*$/i;
async function teamUpdate(url){
  const inhoud = inhoudVan(await CS.paginaTekst(url));
  if (!inhoud) return null;
  const subs = [...inhoud.matchAll(/<page url="([^"]+)"[^>]*>\s*([\s\S]*?)\s*<\/page>/g)].map((m, i) => ({soort:'sub', url: m[1], titel: m[2].replace(/<[^>]+>/g, '').trim(), i}));
  subs.forEach(s => { s.datum = datumUit(s.titel); });
  const regels = naarRegels(inhoud);
  const koppen = regels.map((r, i) => ({r, i})).filter(x => isKop(x.r) && !GEEN_UPDATE.test(x.r.trim()))
    .map(x => ({soort:'kop', i: x.i, titel: x.r.replace(/^#+\s*/, '').trim(), datum: datumUit(x.r)}));
  // De nieuwste: eerst op datum; zonder datum de onderste subpagina, anders het bovenste kopje
  const metDatum = subs.concat(koppen).filter(x => x.datum).sort((a, b) => b.datum.localeCompare(a.datum) || (a.soort === 'sub' ? b.i - a.i : a.i - b.i));
  const keuze = metDatum[0] || subs[subs.length - 1] || koppen[0] || null;
  if (!keuze){ const rest = zonderBlok(regels, 'doel').filter(r => !GEEN_UPDATE.test(r.trim())); return rest.some(r => r.trim()) ? {regels: rest, titel: '', datum: null, sleutel: url} : null; }
  if (keuze.soort === 'sub'){
    let r = naarRegels(inhoudVan(await CS.paginaTekst(keuze.url)));
    r = zonderBlok(r, 'doel').filter(x => !/^\s*Gemaakt:\s*\d{4}-\d{2}-\d{2}/.test(x) && !/^#+\s*Analyse\s*$/i.test(x.trim()));
    return {regels: ['## ' + keuze.titel].concat(r), titel: keuze.titel, datum: keuze.datum, url: keuze.url, sleutel: keuze.url};
  }
  let j = keuze.i + 1; while (j < regels.length && !(isKop(regels[j]) && kopNiveau(regels[j]) <= kopNiveau(regels[keuze.i]))) j++;
  return {regels: regels.slice(keuze.i, j), titel: keuze.titel, datum: keuze.datum, sleutel: url + '#' + (keuze.datum || keuze.titel)};
}
CS.teamUpdate = teamUpdate; // ook voor Home

/* Gelezen updates: wat je op Home of op Team opende, staat niet meer onder Nieuwe update van je team */

};
CS.openTeamlid = naam => { gekozenLid = naam; return CS.toonScherm('team'); };
function tekstNaarBlokken(regels){
  const uit = el('div', {class:'update-tekst'});
  let lijst = null;
  const inline = (n, s) => { s.split(/(\*\*[^*]+\*\*)/).forEach(d => { if (/^\*\*[^*]+\*\*$/.test(d)) n.appendChild(el('b', {text: d.slice(2, -2)})); else if (d) n.appendChild(document.createTextNode(d.replace(/\*([^*]+)\*/g, '$1'))); }); return n; };
  for (const r of regels){

    if (!s){ lijst = null; continue; }
    if (/^#{1,3}\s/.test(s)){ lijst = null; uit.appendChild(inline(el('h3'), s.replace(/^#+\s*/, ''))); continue; }
    if (/^([-*•]|\d+[.)])\s/.test(s)){ if (!lijst){ lijst = el('ul'); uit.appendChild(lijst); } lijst.appendChild(inline(el('li'), s.replace(/^([-*•]|\d+[.)])\s*/, ''))); continue; }

}

async function uploadBestand(accept){

function kleurKiezer(hs, waarde, opties, bijKeuze){

  const naamVan = w => { if (!w) return o.standaardTekst || 'Standaard'; const k = (hs.kleuren || []).find(x => x.id === w); return k ? k.naam : w; };
  const toon = () => { knopje.innerHTML = ''; knopje.title = naamVan(huidigeWaarde); knopje.append(...[el('span', {class:'kk-stip', style:{background: hexVan(huidigeWaarde)}}), o.alleenRondje ? null : el('span', {class:'kk-naam', text: naamVan(huidigeWaarde)}), CS.icoon('pijl')].filter(Boolean)); };

  const buiten = e => { if (!wrap.contains(e.target)) sluit(); };

/* ---------- iPhone-foto's (HEIC) in de Contentinbox omzetten ---------- */
function laadScript(src){ return new Promise((res, rej) => { const s = el('script', {src}); s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function bytesVan(id){
  const r = await CS.roep('Google Drive', 'download_file_content', {fileId: id});
  for (const b of (r.content || [])){
    if (b.data) return {base64: b.data, mime: b.mimeType};
    if (b.resource && b.resource.blob) return {base64: b.resource.blob, mime: b.resource.mimeType};
  }
  const p = CS.payload(r);
  if (p && typeof p.content === 'string' && p.content.length > 200) return {base64: p.content, mime: p.mimeType};
  throw new Error('Drive gaf de inhoud van het bestand niet terug');
}
async function naarJpeg(blob){
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let q = 0.88, d;
  for (let i = 0; i < 8; i++){ d = c.toDataURL('image/jpeg', q); if ((d.length - 23) * 0.75 < 700 * 1024) break; q -= 0.08; }
  return d.slice(d.indexOf(',') + 1);
}
CS.zetHeicOm = async () => {
  if (CS.staat.demo || !CS.staat.mcp) return;
  const k = CS.staat.koppelingen; k.drive = k.drive || {};
  if (!k.drive.contentinbox){
    const m = (await CS.drive.zoek("title contains 'ontentinbox' and mimeType = 'application/vnd.google-apps.folder' and trashed = false", 5)).find(x => /contentinbox$/i.test(x.title));
    if (!m) return; k.drive.contentinbox = m.id; CS.bewaarKoppelingen();
  }
  const heic = await CS.drive.zoek(`parentId = '${k.drive.contentinbox}' and (title contains '.heic' or title contains '.HEIC' or mimeType = 'image/heif' or mimeType = 'image/heic') and trashed = false`, 30);
  if (!heic.length) return;
  melding(heic.length + (heic.length === 1 ? ' iPhone-foto wordt' : ' iPhone-foto\'s worden') + ' omgezet naar JPEG');
  try{ if (!window.heic2any) await laadScript('https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js'); }
  catch(e){ CS.heicVerslag = 'iPhone-foto\'s omzetten lukte niet: het hulpprogramma kon niet laden.'; return; }
  const origineel = await CS.drive.map('Origineel', k.drive.contentinbox);
  let gelukt = 0, mislukt = 0;
  for (const f of heic){
    try{
      const {base64} = await bytesVan(f.id);
      const bin = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      const jpgBlob = await window.heic2any({blob: new Blob([bin], {type:'image/heic'}), toType:'image/jpeg', quality: 0.9});
      const b64 = await naarJpeg(Array.isArray(jpgBlob) ? jpgBlob[0] : jpgBlob);
      await CS.drive.upload(f.title.replace(/\.hei[cf]$/i, '') + '.jpg', k.drive.contentinbox, b64);
      await CS.drive.verplaats(f.id, origineel);
      gelukt++;
    }catch(e){ console.warn('HEIC omzetten mislukt', f.title, e); mislukt++; }
  }
  CS.heicVerslag = `iPhone-foto's: ${gelukt} omgezet naar JPEG` + (mislukt ? `, ${mislukt} lukte niet (zet je camera op Meest compatibel: Instellingen, Camera, Formaten).` : '.');
  melding(CS.heicVerslag, mislukt ? 'fout' : undefined);
};
CS.naStart = () => { CS.zetHeicOm().catch(e => console.warn(e)); };
})();

/* Content Studio - Aandacht nodig: de procescheck van Koen.
   Een inklapbaar paneel rechts. Koen kijkt naar je planning in Notion en zet hier wat aandacht vraagt:
   posts die op een design of video wachten, geplande posts zonder slides, datums die voorbij zijn,
   posts die Puk niet kon plaatsen en posts zonder datum. Lege dagen niet: niemand hoeft elke dag te posten.
   Alles komt uit CS.staat.posts; er gaat geen extra vraag naar Notion. */
'use strict';
(function(){
const {el, knop} = CS;
const OPEN_SLEUTEL = 'cs-aandacht-open';
const DAGEN = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];

const isoDag = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dagLabel = iso => { const d = new Date(iso + 'T12:00:00'); return DAGEN[d.getDay()] + ' ' + CS.datumNL(iso, true); };
const kort = p => [p.datum ? dagLabel(p.datum.slice(0, 10)) : null, p.soort || null].filter(Boolean).join(' · ');

/* De regels van Koen. Elke regel geeft een groep met items; een item kan rood zijn (dringend). */
function verzamel(){
  const posts = (CS.staat.posts || []).filter(p => p.status !== 'Live');
  const vandaag = CS.vandaag();
  const over = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoDag(d); };
  const binnen2 = over(2);
  const dag = p => p.datum ? p.datum.slice(0, 10) : null;
  const groepen = [];
  const voeg = (titel, items) => { if (items.length) groepen.push({titel, items}); };

  voeg('Wacht op een design', posts.filter(p => p.status === 'Design').sort((a, b) => (dag(a) || '9999').localeCompare(dag(b) || '9999')).map(p => ({
    post: p, tekst: p.haakje, sub: kort(p) || 'nog geen datum', rood: !!dag(p) && dag(p) <= binnen2, actie: 'design'})));
  voeg('Moet je nog filmen', posts.filter(p => p.status === 'Video').sort((a, b) => (dag(a) || '9999').localeCompare(dag(b) || '9999')).map(p => ({
    post: p, tekst: p.haakje, sub: kort(p) || 'nog geen datum', rood: !!dag(p) && dag(p) <= binnen2, actie: 'post'})));
  voeg('Gepland zonder slides', posts.filter(p => ['Klaar', 'Gepland'].includes(p.status) && !p.link).map(p => ({
    post: p, tekst: p.haakje, sub: (kort(p) ? kort(p) + ' · ' : '') + 'geen link in Notion', rood: true, actie: 'post'})));
  voeg('Datum is voorbij', posts.filter(p => dag(p) && dag(p) < vandaag && ['Design', 'Video', 'Klaar', 'Gepland', 'Bezig'].includes(p.status)).map(p => ({
    post: p, tekst: p.haakje, sub: kort(p) + ' · staat nog op ' + p.status, rood: true, actie: 'post'})));
  voeg('Niet geplaatst', posts.filter(p => p.status === 'Fout').map(p => ({
    post: p, tekst: p.haakje, sub: (kort(p) ? kort(p) + ' · ' : '') + 'Puk kon deze niet plaatsen', rood: true, actie: 'post'})));
  voeg('Nog geen datum', posts.filter(p => !dag(p) && ['Klaar', 'Gepland'].includes(p.status)).map(p => ({
    post: p, tekst: p.haakje, sub: (p.soort || 'post') + ' · ' + p.status, actie: 'post'})));

  return groepen;
}

function open(item){
  if (item.actie === 'design' && item.post) return CS.openDesign(item.post);
  if (item.actie === 'post' && item.post){
    if (CS.openPost) return CS.openPost(item.post);
    return CS.toonScherm('feed', {post: item.post});
  }
  return CS.toonScherm('feed');
}

let isOpen = false;
function zetOpen(aan){
  isOpen = !!aan;
  const paneel = document.getElementById('aandacht'), b = document.getElementById('knop-aandacht');
  if (paneel) paneel.hidden = !isOpen;
  if (b) b.setAttribute('aria-expanded', String(isOpen));
  try{ localStorage.setItem(OPEN_SLEUTEL, isOpen ? '1' : '0'); }catch(e){}
  if (isOpen) teken();
}

function teken(){
  const paneel = document.getElementById('aandacht');
  if (!paneel) return;
  const groepen = verzamel();
  paneel.innerHTML = '';
  paneel.appendChild(el('h2', {}, 'Aandacht nodig', knop('', {soort:'stil klein', icoon:'sluit', label:'Paneel sluiten', klik: () => zetOpen(false)})));
  const f = (CS.TEAMFOTOS || {}).koen;
  paneel.appendChild(el('div', {class:'koen'}, f ? el('img', {src: f, alt: ''}) : el('div', {class:'initiaal'}),
    el('span', {}, el('span', {text:'Koen liep je planning na.'}), el('span', {text: groepen.length ? 'Dit vraagt aandacht.' : 'Alles staat klaar.'}))));
  if (!CS.staat.postsGeladen){ paneel.appendChild(el('div', {class:'laden', text:'Je planning wordt opgehaald'})); return; }
  if (!groepen.length){ paneel.appendChild(el('p', {class:'aan-leeg', text:'Alles staat klaar. Er is niets dat nu aandacht vraagt.'})); return; }
  for (const g of groepen){
    const blok = el('div', {class:'aan-groep'}, el('h3', {text: g.titel + (g.items.length > 1 ? ' (' + g.items.length + ')' : '')}));
    for (const it of g.items.slice(0, 8)){
      blok.appendChild(el('button', {type:'button', class:'aan-item' + (it.rood ? ' rood' : ''), onclick: () => open(it)},
        el('b', {text: it.tekst || '(zonder haakje)'}), it.sub ? el('span', {text: it.sub}) : null));
    }
    if (g.items.length > 8) blok.appendChild(el('span', {class:'aan-leeg', text: 'en nog ' + (g.items.length - 8)}));
    paneel.appendChild(blok);
  }
}

CS.aandacht = {
  init(){
    const b = document.getElementById('knop-aandacht');
    if (b) b.addEventListener('click', () => zetOpen(!isOpen));
    let bewaard = null;
    try{ bewaard = localStorage.getItem(OPEN_SLEUTEL); }catch(e){}
    zetOpen(bewaard === '1');
  },
  bijwerken(){
    const telling = document.getElementById('aandacht-telling');
    // Lege dagen tellen als één punt; de rest per post
    const n = verzamel().reduce((som, g) => som + g.items.length, 0);
    if (telling) telling.textContent = n ? String(n) : '';
    if (isOpen) teken();
  },
  verzamel
};
})();

/* Content Studio - Home: het beginscherm.
   Vier blokken: Deze week (je posts per dag), Eerst doen (de drie dringendste punten van Koen),
   Nieuwe update van je team (de nieuwste update per teamlid die je nog niet opende, nieuwste eerst)
   en Cijfers deze week (maandag tot en met zondag). */
'use strict';
(function(){
const {el} = CS;
const DAGEN = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
const TEAM_OP_HOME = ['Hanna', 'Koen', 'Ruby', 'Puk'];
const ZES_UUR = 6 * 3600 * 1000;

const isoDag = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const maandag = () => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
/* De groet bovenaan: met je voornaam (Brandkit > Studio) en een knipoog naar het tijdstip */
const groet = () => {
  const naam = String((CS.staat.profiel || {}).voornaam || (CS.staat.profiel || {}).naam || '').trim().split(/\s+/)[0];
  const hey = 'Hey' + (naam && naam !== 'Voorbeeld' ? ' ' + naam : '');
  const u = new Date().getHours(), d = new Date();
  const dag = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'][d.getDay()] + ' ' + CS.datumNL(CS.vandaag()).replace(/ \d{4}$/, '');
  const eerste = u < 8 ? hey + ', jij vroege vogel!' : u >= 21 ? hey + ', jij bent nog laat bezig!' : hey + '!';
  return eerste + ' Het is ' + dag + '. Ga lekker aan de slag.';
};
const openPost = p => CS.openPost ? CS.openPost(p) : CS.toonScherm('feed', {post: p});
const statusKlasse = s => ({Design:'zonder', Video:'video', Klaar:'klaar', Gepland:'klaar', Bezig:'klaar', Live:'live', Fout:'fout'})[s] || 'klaar';
const kaart = (titel, ...inhoud) => el('section', {class:'home-kaart'}, el('h2', {text: titel}), ...inhoud);

/* ---------- Deze week ---------- */
function dezeWeek(){
  const ma = maandag(), vandaag = CS.vandaag();
  const rij = el('div', {class:'home-week'});
  for (let i = 0; i < 7; i++){
    const d = new Date(ma); d.setDate(ma.getDate() + i);
    const iso = isoDag(d);
    const posts = (CS.staat.posts || []).filter(p => p.datum && p.datum.slice(0, 10) === iso);
    const dag = el('div', {class:'home-dag' + (iso === vandaag ? ' vandaag' : '')}, el('span', {class:'home-dagnaam', text: DAGEN[i] + ' ' + d.getDate()}));
    if (!posts.length) dag.appendChild(el('div', {class:'home-tegel niets'}));
    for (const p of posts.slice(0, 2)){
      dag.appendChild(el('button', {type:'button', class:'home-tegel ' + statusKlasse(p.status), title: p.haakje + ' · ' + p.status, 'aria-label': p.haakje, onclick: () => openPost(p)}));
      dag.appendChild(el('span', {class:'home-onder', text: p.status === 'Live' ? 'Live' : p.status === 'Design' ? 'Design' : p.status === 'Video' ? 'Video' : (p.soort === 'Reel' ? 'Reel' : p.status)}));
    }
    if (posts.length > 2) dag.appendChild(el('span', {class:'home-meer', text: '+' + (posts.length - 2)}));
    rij.appendChild(dag);
  }
  return kaart('Content deze week', rij, el('div', {class:'home-voet'}, CS.knop('Naar Planning', {soort:'klein', klik: () => CS.toonScherm('feed')})));
}

/* ---------- Eerst doen ---------- */
function eerstDoen(){
  const items = CS.aandacht ? CS.aandacht.verzamel().flatMap(g => g.items.map(it => Object.assign({groep: g.titel}, it))) : [];
  items.sort((a, b) => (b.rood ? 1 : 0) - (a.rood ? 1 : 0));
  const lijst = el('div', {class:'home-lijst'});
  if (!items.length) lijst.appendChild(el('p', {class:'home-leeg', text:'Niets dringends. Alles staat klaar.'}));
  for (const it of items.slice(0, 3)){
    const actie = () => it.actie === 'design' && it.post ? CS.openDesign(it.post) : it.post ? openPost(it.post) : CS.toonScherm('feed');
    lijst.appendChild(el('button', {type:'button', class:'home-item' + (it.rood ? ' rood' : ''), onclick: actie},
      el('b', {text: it.groep + ': ' + (it.tekst || '')}), el('span', {text: it.sub || ''})));
  }
  const voet = items.length > 3 ? el('div', {class:'home-voet'}, CS.knop('Alles bekijken (' + items.length + ')', {soort:'klein', klik: () => { const b = document.getElementById('knop-aandacht'); if (b && b.getAttribute('aria-expanded') !== 'true') b.click(); }})) : null;
  return kaart('Doe dit als eerst', lijst, voet);
}

/* ---------- Nieuw van je team ---------- */
/* De eerste zin onder de kopjes, als korte samenvatting */
const eersteRegel = regels => {
  const tekst = (regels || []).map(r => r.trim()).filter(r => r && !/^#{1,3}\s/.test(r) && !/^---+$/.test(r))[0] || '';
  const schoon = tekst.replace(/^([-*•]|\d+[.)])\s*/, '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1');
  const zin = (schoon.match(/^.+?[.!?](?=\s|$)/) || [schoon])[0];
  return zin.length <= 150 ? zin : zin.slice(0, 147).replace(/\s+\S*$/, '') + '…';
};
/* Per teamlid de nieuwste update (subpagina of kopje met datum), zes uur bewaard */
async function teamUpdates(){
  if (CS.staat.demo) return TEAM_OP_HOME.map((naam, i) => ({naam, tekst: 'Voorbeeld: hier staat de eerste zin uit de nieuwste update van ' + naam + '.', wanneer: '22 november', datum: '2026-11-2' + (2 - i), sleutel: 'voorbeeld-' + naam}));
  const bewaard = await CS.dbHaal('cache/team-v2');
  if (bewaard && bewaard.tijd && Date.now() - new Date(bewaard.tijd).getTime() < ZES_UUR && Array.isArray(bewaard.leden)) return bewaard.leden;
  const v = await CS.zorgVoorWeergave('team');
  if (!v) return [];
  const rijen = await CS.notion.view(v, 50);
  const uitkomst = await Promise.all(rijen.map(async r => {
    const naam = String(r.Naam || r.Name || r.Teamlid || '').replace(/<[^>]+>/g, '').trim().split(/\s+/)[0];
    if (!naam || !r.url || !CS.teamUpdate) return null;
    try{
      const u = await CS.teamUpdate(r.url);
      const tekst = u ? eersteRegel(u.regels) : '';
      return tekst ? {naam, tekst, wanneer: u.datum ? CS.datumKort(u.datum) : u.titel.slice(0, 40), datum: u.datum || '', sleutel: u.sleutel} : null;
    }catch(e){ return null; /* één teamlid dat niet laadt, houdt de rest niet tegen */ }
  }));
  const leden = uitkomst.filter(Boolean).sort((a, b) => (b.datum || '').localeCompare(a.datum || ''));
  try{ await CS.dbZet('cache/team-v2', {tijd: new Date().toISOString(), leden}); }catch(e){}
  return leden;
}
/* Werkt als een melding: wat je opende, verdwijnt hier. Lees je het op Team, dan ook. */
function teamKaart(){
  const lijst = el('div', {class:'home-lijst'}, el('div', {class:'laden', text:'De updates van je team laden'}));
  Promise.all([teamUpdates(), CS.gelezenUpdates ? CS.gelezenUpdates() : {}]).then(([leden, gelezen]) => {
    lijst.innerHTML = '';
    const nieuw = leden.filter(l => gelezen[l.naam] !== l.sleutel);
    if (!leden.length){ lijst.appendChild(el('p', {class:'home-leeg', text:'Nog geen updates. Je team schrijft ze op zondag, samen met de zondagmail.'})); return; }
    if (!nieuw.length){ lijst.appendChild(el('p', {class:'home-leeg', text:'Je hebt alle updates gelezen. Op Team lees je ze terug.'})); return; }
    for (const l of nieuw.slice(0, 4)){
      const f = (CS.TEAMFOTOS || {})[l.naam.toLowerCase()];
      const knopje = el('button', {type:'button', class:'home-item team', onclick: async () => {
        knopje.remove();
        if (CS.markeerGelezen) await CS.markeerGelezen(l.naam, l.sleutel);
        if (CS.openTeamlid) CS.openTeamlid(l.naam); else CS.toonScherm('team');
      }},
        f ? el('img', {src: f, alt: ''}) : el('span', {class:'home-initiaal', text: l.naam[0]}),
        el('span', {class:'home-teamtekst'}, el('b', {}, l.naam, l.wanneer ? el('span', {class:'home-wanneer', text: ' · ' + l.wanneer}) : null), el('span', {text: l.tekst})));
      lijst.appendChild(knopje);
    }
    if (nieuw.length > 4) lijst.appendChild(el('p', {class:'home-leeg', text: '+' + (nieuw.length - 4) + ' meer op Team'}));
  }).catch(e => { lijst.innerHTML = ''; lijst.appendChild(el('p', {class:'home-leeg', text: CS.foutTekst(e, 'Notion')})); });
  return kaart('Nieuwe update van je team', lijst, el('div', {class:'home-voet'}, CS.knop('Naar Team', {soort:'klein', klik: () => CS.toonScherm('team')})));
}

/* ---------- Cijfers deze week ---------- */
function cijferKaart(){
  const vak = el('div', {class:'home-cijfers'}, el('div', {class:'laden', text:'Je cijfers laden'}));
  const teken = data => {
    vak.innerHTML = '';
    if (!data){ vak.appendChild(el('p', {class:'home-leeg', text:'Je cijfers komen uit Instagram via Composio. Klik op Vernieuwen als ze er nog niet staan.'})); return; }
    // Deze week = maandag tot en met zondag, net als Content deze week (26 nov 2026)
    const grens = isoDag(maandag());
    const dagen = Object.entries((data.account && data.account.dagen) || {}).filter(([d]) => d >= grens);
    const som = k => dagen.reduce((t, [, v]) => t + (typeof v[k] === 'number' ? v[k] : 0), 0);
    const heeft = k => dagen.some(([, v]) => typeof v[k] === 'number');
    const live = Object.values(data.posts || {}).filter(p => !p.proef && p.datum && p.datum >= grens).length;
    const tegels = [
      [heeft('weergaven') ? CS.getal(som('weergaven')) : '-', 'weergaven'],
      [heeft('nieuweVolgers') ? '+' + CS.getal(som('nieuweVolgers')) : '-', 'nieuwe volgers'],
      [String(live), live === 1 ? 'post live' : 'posts live']
    ];
    for (const [w, l] of tegels) vak.appendChild(el('div', {class:'home-cijfer'}, el('b', {text: w}), el('span', {text: l})));
  };
  const nu = CS.fv && CS.fv.data;
  if (nu) teken(nu);
  if (CS.vernieuwCijfers) CS.vernieuwCijfers(false).then(d => teken(d || (CS.fv && CS.fv.data))).catch(() => teken(CS.fv && CS.fv.data));
  else if (!nu) teken(null);
  return kaart('Cijfers deze week', vak, el('div', {class:'home-voet'}, CS.knop('Naar Analyses', {soort:'klein', klik: () => CS.toonScherm('analyses')})));
}

CS.registreer({id:'home', naam:'Home', kop:'Studio', icoon:'home', volgorde: 5, toon: async w => {
  CS.schermKop(w, 'HOME', []);
  w.classList.add('home-vol'); // schermvullend, zonder scrollen
  if (CS.staat.demo) w.appendChild(el('div', {class:'banner info', text:'Voorbeeldweergave. Deze studio is buiten Claude geopend, dus er is geen koppeling met Notion of Instagram.'}));
  const ke = document.getElementById('kop-extra');
  if (ke) ke.textContent = groet(); else w.appendChild(el('p', {class:'home-groet', text: groet()}));
  if (!CS.staat.postsGeladen){ w.appendChild(el('div', {class:'laden', text:'Je planning wordt opgehaald'})); return; }
  w.appendChild(el('div', {class:'home-raster'}, dezeWeek(), cijferKaart(), eerstDoen(), teamKaart()));
}});
})();

CS.TEAMFOTOS = window.CS_TEAMFOTOS;
CS.start();
</script>
