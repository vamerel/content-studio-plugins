CS.laadInstellingen = async () => {
  const [basis, eigen, profiel, koppelingen] = await Promise.all([CS.dbHaal('huisstijl/basis'), CS.dbHaal('huisstijl/eigen'), CS.dbHaal('instellingen/profiel'), CS.dbHaal('instellingen/koppelingen')]);
  CS.staat.huisstijlBasis = basis && basis.huisstijl ? basis.huisstijl : null;
  CS.staat.huisstijlEigen = eigen && eigen.huisstijl ? eigen.huisstijl : null;
  CS.staat.profiel = profiel || {};
  CS.staat.koppelingen = koppelingen || {};
};
CS.bewaarKoppelingen = async () => { try{ await CS.dbZet('instellingen/koppelingen', CS.staat.koppelingen); }catch(e){} };
CS.vernieuwData = async (stil) => {
  if (CS.staat.demo){ CS.staat.posts = CS.DEMO.posts(); CS.staat.postsGeladen = true; CS.zetBijgewerkt(); if (CS.aandacht) CS.aandacht.bijwerken(); return; }
  CS.staat.fout = null;
  let gelukt = false;
  try{ await CS.laadPosts(); gelukt = true; }
  catch(e){ CS.staat.fout = CS.foutTekst(e, 'Notion'); if (!stil) melding(CS.staat.fout, 'fout'); }
  if (CS.staat.koppelingen.kalender){ try{ CS.staat.schema = await CS.leesSchema(); }catch(e){ console.warn(e); } }
  if (gelukt){
    CS.zetBijgewerkt();
    // Bewaar de posts in de studio zelf: de volgende keer staat alles er meteen, en wordt het daarna ververst.
    try{ await CS.dbZet('cache/posts', {posts: CS.staat.posts, tijd: CS.staat.tijdNotion}); }catch(e){}
  }
  if (CS.aandacht) CS.aandacht.bijwerken();
};
/* Na een verversing op de achtergrond: teken het scherm opnieuw, behalve als je ergens middenin zit (de editor zet nietVerversen). */
CS.verversScherm = async () => { if (!CS.staat.nietVerversen && CS.staat.scherm) await CS.toonScherm(CS.staat.scherm); };
/* Kop van een scherm: titel in hoofdletters, een i met uitleg, en rechts eventueel knoppen */
CS.schermKop = (w, titel, uitleg, rechts) => {
  const info = el('button', {type:'button', class:'info', 'aria-label':'Uitleg over ' + titel, 'aria-expanded':'false'}, 'i');
  const tip = el('div', {class:'uitleg-popup', hidden: true, role:'tooltip'});
  for (const [kop, tekst] of uitleg || []){ if (kop) tip.appendChild(el('b', {text: kop})); if (tekst) tip.appendChild(el('p', {text: tekst})); }
  let vast = false;
  const toon = aan => { tip.hidden = !aan; info.setAttribute('aria-expanded', String(aan)); };
  info.addEventListener('mouseenter', () => toon(true));
  info.addEventListener('mouseleave', () => { if (!vast) toon(false); });
  info.addEventListener('focus', () => toon(true));
  info.addEventListener('blur', () => { vast = false; toon(false); });
  info.addEventListener('click', () => { vast = !vast; toon(vast); });
  // De titel staat in de kopbalk (Content + schermnaam); knoppen en uitleg komen rechts in die balk.
  const kr = document.getElementById('kop-rechts');
  // Geen i-knop meer in de kop (19 nov 2026): alleen de knoppen van het scherm
  const blok = el('div', {class:'kop-rechts-inhoud', style:{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap'}}, rechts || null);
  if (kr){ kr.innerHTML = ''; kr.appendChild(blok); }
  const kop = el('header', {class:'scherm-kop'});
  if (!kr) kop.appendChild(blok);
  w.appendChild(kop);
  if (CS.staat.fout && !CS.staat.demo) w.appendChild(el('div', {class:'banner let-op'}, el('div', {text: CS.staat.fout})));
  return kop;
};
/* De kleuren en het kopfont van de studio komen uit de huisstijl van de gebruiker */
CS.pasUIaan = hs => {
  const r = document.documentElement.style;
  const donker = (hs.themas || []).find(t => /donker|dark/i.test(t.id + t.naam)) || CS.thema(hs);
  const accent = CS.kleurHex(hs, donker && donker.accent, donker);
  const primair = CS.kleurHex(hs, donker && donker.achtergrond, donker);
  if (accent) r.setProperty('--merk-accent', accent);
  if (primair) r.setProperty('--merk-primair', primair);
  r.setProperty('--font-kop', `"${CS.fontFamilie(hs, 'kop')}", 'Arial Narrow', Arial, sans-serif`);
  // Kleurrollen van de studio zelf (Brandkit > Studio): balk, knoppen, achtergrond. Leeg = afgeleid van het thema.
  const ui = hs.studio || {};
  const zet = (varNaam, waarde) => { const hex = waarde ? CS.kleurHex(hs, waarde, donker) : null; if (hex && hex !== '#000000' || waarde === 'zwart') r.setProperty(varNaam, hex); else r.removeProperty(varNaam); };
  zet('--merk-balk', ui.balk); zet('--merk-knop', ui.knop);
  if (ui.primair) zet('--merk-primair', ui.primair);
  if (ui.secundair) zet('--merk-accent', ui.secundair);
  if (ui.achtergrond){ const hex = CS.kleurHex(hs, ui.achtergrond, donker); if (hex) r.setProperty('--achtergrond', hex); } else r.removeProperty('--achtergrond');
  const knopHex = ui.knop ? CS.kleurHex(hs, ui.knop, donker) : accent;
  if (knopHex) r.setProperty('--merk-op-knop', CS.leesbaarOp(knopHex));
  const balkHex = ui.balk ? CS.kleurHex(hs, ui.balk, donker) : primair;
  r.setProperty('--merk-op-balk', CS.leesbaarOp(balkHex));
  // "Content" in de kop: het accentfont uit de brandkit, anders een elegante schreefletter
  const acc = (hs.fonts || {}).accent;
  if (acc && acc.familie) r.setProperty('--font-elegant', `"${acc.familie}", 'Playfair Display', Georgia, serif`); else r.removeProperty('--font-elegant');
};
CS.leesbaarOp = hex => { const m = String(hex || '').match(/^#?([0-9a-f]{6})$/i); if (!m) return '#ffffff'; const n = parseInt(m[1], 16); const l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > 0.62 ? '#141716' : '#ffffff'; };
CS.zetCijfersTijd = datum => { if (datum){ CS.staat.tijdCijfers = new Date(datum).toISOString(); CS.toonBijgewerkt(); } };
CS.start = async () => {
  CS.bouwMenu();
  const heeftClaude = !!(window.claude && window.claude.use);
  if (!heeftClaude){
    CS.staat.demo = true;
  } else {
    const [mcp, db, user] = await Promise.all([CS.gebruik('mcp'), CS.gebruik('db'), CS.gebruik('user')]);
    Object.assign(CS.staat, {mcp, db, user});
    CS.gebruik('sample').then(s => { CS.staat.sample = s; });
    CS.gebruik('assets').then(a => { CS.staat.assets = a; });
    CS.gebruik('downloads').then(d => { CS.staat.downloads = d; });
    if (!mcp && !db) CS.staat.demo = true;
  }
  if (CS.staat.demo){ CS.staat.huisstijlBasis = CS.DEMO.huisstijl(); CS.staat.profiel = {naam: 'Voorbeeld'}; }
  else await CS.laadInstellingen();
  CS.pasUIaan(CS.huisstijl());
  CS.laadFonts(CS.huisstijl());
  if (CS.aandacht) CS.aandacht.init();
  const vk = document.getElementById('knop-vernieuwen');
  vk.addEventListener('click', async () => {
    if (vk.classList.contains('bezig')) return;
    vk.classList.add('bezig'); vk.setAttribute('aria-busy', 'true');
    melding('Je posts worden opgehaald uit Notion');
    try{
      CS.cache.paginas.clear();
      await CS.vernieuwData();
      if (!CS.staat.fout) melding('Je posts zijn bijgewerkt');
      await CS.verversScherm();
      // De Instagram-cijfers duren langer: die komen op de achtergrond, het scherm vult zich daarna vanzelf.
      if (CS.vernieuwCijfers) CS.vernieuwCijfers(true).then(() => { if (['feed', 'analyses'].includes(CS.staat.scherm)) CS.verversScherm(); }).catch(() => {});
    }
    catch(e){ /* melding is al getoond */ }
    finally{ vk.classList.remove('bezig'); vk.removeAttribute('aria-busy'); }
  });
  const hash = (location.hash || '').slice(1);
  const start = CS.schermen.find(s => s.id === hash) ? hash : (hash === 'instellingen' ? 'brandkit' : 'home');
  // Eerst wat de studio vorige keer bewaarde, zodat je meteen iets ziet; daarna vers uit Notion.
  let bewaard = null;
  if (!CS.staat.demo){ try{ bewaard = await CS.dbHaal('cache/posts'); }catch(e){} }
  if (bewaard && Array.isArray(bewaard.posts) && bewaard.posts.length){
    CS.staat.posts = bewaard.posts; CS.staat.rijen = CS.staat.rijen || []; CS.staat.postsGeladen = true;
    CS.staat.tijdNotion = bewaard.tijd || null; CS.toonBijgewerkt();
    if (CS.aandacht) CS.aandacht.bijwerken();
    await CS.toonScherm(start);
    CS.vernieuwData(true).then(() => CS.verversScherm()).catch(() => {});
  } else {
    try{ await CS.vernieuwData(true); }catch(e){}
    await CS.toonScherm(start);
  }
  if (CS.naStart) CS.naStart();
};

  // Elke huisstijl krijgt de basisbibliotheek erbij, na de eigen templates. De eigen templates gaan voor bij een gelijke id.
  const metBasis = new WeakMap();
  const zonderBasis = CS.huisstijl;
  CS.huisstijl = () => {
    const hs = zonderBasis();
    if (!hs || typeof hs !== 'object') return hs;
    if (metBasis.has(hs)) return metBasis.get(hs);
    const eigen = (hs.templates || []).filter(t => t.bron !== 'basis');
    const ids = new Set(eigen.map(t => t.id));
    const samen = Object.assign({}, hs, {templates: eigen.concat(CS.BASIS_TEMPLATES.filter(t => !ids.has(t.id)))});
    metBasis.set(hs, samen);
    return samen;
  };
  // Wat de gebruiker bewaart, bevat de basisbibliotheek niet (die komt altijd vers uit de studio)
  CS.zonderBasisTemplates = hs => Object.assign({}, hs, {templates: (hs.templates || []).filter(t => t.bron !== 'basis')});
  // Is dit template een cover (voor het raster met varianten)?
  CS.isCoverTemplate = t => !!t && (t.type === 'cover' || (!t.type && /cover|kopslide|statement/i.test(t.id + ' ' + (t.naam || ''))));
})();

function templatesVoor(hs, design){ const f = formaatVan(design); return (hs.templates || []).filter(t => (t.formaat || 'carrousel') === f); }
const slideThema = (hs, slide, design) => CS.thema(hs, (slide && slide.thema) || design.thema);
const tplVan = (hs, slide, design) => CS.template(hs, slide.template) || templatesVoor(hs, design)[0] || {vakken: [], vlakken: []};
const heeftFotoVak = (hs, slide, design) => (tplVan(hs, slide, design).vakken || []).some(v => v.rol === 'foto');
const elementenVan = slide => (slide.elementen = slide.elementen || []);
const vindEl = (slide, id) => (slide.elementen || []).find(e => e.id === id);
const aanpassing = (slide, vakId) => { slide.aanpassingen = slide.aanpassingen || {}; return (slide.aanpassingen[vakId] = slide.aanpassingen[vakId] || {}); };
Object.assign(DS, {formaatVan, maat, nieuwId, kopie, templatesVoor, slideThema, tplVan, heeftFotoVak, elementenVan, vindEl, aanpassing});

/* Beelden: elk bestand wordt één keer geladen; daarna maakt de studio er snel nieuwe Fabric-beelden van */
const beelden = new Map();
function laadElement(src){
  if (!beelden.has(src)){
    if (beelden.size > 120) beelden.clear();
    beelden.set(src, new Promise((res, rej) => {
      const i = new Image(); i.crossOrigin = 'anonymous';
      i.onload = () => res(i);
      i.onerror = () => { beelden.delete(src); rej(new Error('Afbeelding laden mislukt')); };
      i.src = src;
    }));
  }
  return beelden.get(src);
}
/* Hulpje bovenop CS.laadAssetBeeld: hetzelfde bestand wordt maar één keer opgehaald, ook als vijf slides het tegelijk vragen */
const assetBeloftes = new Map();
DS.assetBeeld = url => {
  if (!url) return Promise.resolve(null);
  if (!assetBeloftes.has(url)){ const b = CS.laadAssetBeeld(url); assetBeloftes.set(url, b); b.catch(() => assetBeloftes.delete(url)); }
  return assetBeloftes.get(url);
};
async function laadBeeld(src){ if (!src) throw new Error('Geen afbeelding'); return new fabric.Image(await laadElement(src)); }
async function fotoBron(foto){
  if (!foto) return null;
  if (foto.demo){ const f = CS.DEMO.fotos().find(x => x.id === foto.driveId) || CS.DEMO.fotos()[0]; return CS.DEMO.foto(900, 1125, f.kleuren[0], f.kleuren[1]); }
  return await CS.drive.beeld(foto.driveId);
}
DS.laadBeeld = laadBeeld; DS.fotoBron = fotoBron;
function standaardTekst(hs, slide, vak, index, design){
  if (vak.rol === 'afzender') return hs.afzender || '';
  if (vak.rol === 'nummer'){ const stappen = design.slides.filter(s => s.template === 'stap'); const i = stappen.indexOf(slide); return String((i >= 0 ? i : index) + 1); }
  return '';
}
/* De donkerste kleur uit het palet: een goede standaard voor een overlay over een foto */
DS.donkersteKleur = hs => {
  const lum = hex => { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return 0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255); };
  const k = (hs.kleuren || []).slice().sort((a, b) => lum(a.hex) - lum(b.hex))[0];
  return k ? k.id : '#000000';
};

/* ---------- tekst als Fabric-object ---------- */
/* p: {tekst, font, grootte, kleur, uitlijning, hoofdletters, x, y, b, hoek}. x en y zijn linksboven, als deel van de slide; draaien gaat om het midden. */
function maakTekst(p, W, H, hs, thema, extra){
  const leeg = !!p.leeg;
  const tekst = leeg ? p.plaatshouder : (p.hoofdletters ? String(p.tekst).toUpperCase() : String(p.tekst));
  const font = p.font || 'tekst';
  const t = new fabric.Textbox(tekst, Object.assign({
    originX:'center', originY:'center', width: Math.max(24, (p.b || 0.5) * W), fontSize: Math.max(8, (p.grootte || 0.04) * W),
    fontFamily: CS.fontFamilie(hs, font), fontWeight: p.vet ? 'bold' : CS.fontGewicht(hs, font), fontStyle: p.cursief ? 'italic' : 'normal',
    underline: !!p.onderstreept, linethrough: !!p.doorhalen, fill: CS.kleurHex(hs, p.kleur || 'tekst', thema),
    textAlign: UITLIJNING[p.uitlijning] || 'left', lineHeight: p.regelafstand || 1.15, opacity: leeg ? 0.45 : (typeof p.dekking === 'number' ? p.dekking : 1), angle: p.hoek || 0, lockScalingFlip: true
  }, KEUZE, extra || {}));
  t.set({left: (p.x || 0) * W + t.width / 2, top: (p.y || 0) * H + t.height / 2});
  t.setControlsVisibility({mt:false, mb:false});
  return t;
}
/* De plek van een hoektekst: vast, met een marge van 5,5% van de breedte */
const HOEKEN = {linksboven:'Linksboven', bovenmidden:'Boven in het midden', rechtsboven:'Rechtsboven', linksonder:'Linksonder', ondermidden:'Onder in het midden', rechtsonder:'Rechtsonder'};
DS.HOEKEN = HOEKEN;
function zetOpHoek(t, plek, W, H){
  const m = 0.055 * W;
  const links = /^links/.test(plek), rechts = /^rechts/.test(plek), boven = /boven/.test(plek);
  t.set({textAlign: links ? 'left' : rechts ? 'right' : 'center'});
  const cx = links ? m + t.width / 2 : rechts ? W - m - t.width / 2 : W / 2;
  const cy = boven ? m + t.height / 2 : H - m - t.height / 2;
  t.set({left: cx, top: cy, angle: 0});
}

/* Een vrij element (sectie 5 van de afspraken) als Fabric-object */
async function maakElement(e, W, H, hs, thema, stil){
  const data = {bron:'el', elId: e.id, soort: e.soort, groep: e.groep || null};
  const keuze = Object.assign({selectable: !stil, evented: !stil}, KEUZE);
  const midden = (w, h) => ({left: (e.x || 0) * W + w / 2, top: (e.y || 0) * H + h / 2});
  if (e.soort === 'tekst' || e.soort === 'hoektekst'){
    const leeg = !String(e.tekst || '').trim();
    if (leeg && stil) return null;
    const t = maakTekst(Object.assign({}, e, {leeg, plaatshouder: 'Typ hier'}), W, H, hs, thema, Object.assign({}, keuze, {data: Object.assign(data, {leeg, hoofdletters: !!e.hoofdletters, origineel: e.tekst || ''})}));
    if (e.soort === 'hoektekst'){
      zetOpHoek(t, e.plek || 'rechtsonder', W, H);
      t.set({lockMovementX:true, lockMovementY:true, hasControls:false, hoverCursor:'text'});
    }
    return t;
  }
  if (e.soort === 'emoji'){
    const t = new fabric.Text(e.tekst || '✨', Object.assign({originX:'center', originY:'center', fontSize: Math.max(8, (e.grootte || 0.1) * W), fontFamily: EMOJI_FONT, angle: e.hoek || 0, data}, keuze));
    t.set(midden(t.width, t.height));
    t.setControlsVisibility({ml:false, mr:false, mt:false, mb:false});
    return t;
  }
  if (e.soort === 'logo'){
    const logo = (hs.logos || []).find(l => l.id === e.logo) || (hs.logos || [])[0];
    const w = (e.b || 0.18) * W, h = (e.h || 0.08) * H;
    if (logo && logo.asset){
      try{
        const img = await laadBeeld(await DS.assetBeeld(logo.asset));
        const s = w / img.width;
        img.set(Object.assign({originX:'center', originY:'center', scaleX:s, scaleY:s, angle: e.hoek || 0, data}, keuze));
        img.set(midden(img.width * s, img.height * s));
        img.setControlsVisibility({ml:false, mr:false, mt:false, mb:false});
        return img;
      }catch(err){ console.warn(err); }
    }
    if (stil) return null;
    // geen bestand (bijvoorbeeld in de voorbeeldweergave): een plaatshouder met de naam
    const r = new fabric.Rect({originX:'center', originY:'center', width:w, height:h, fill:'rgba(127,127,127,.12)', stroke:'rgba(127,127,127,.7)', strokeDashArray:[10,8], strokeWidth:3});
    const n = new fabric.Text((logo && logo.naam) || 'Logo', {originX:'center', originY:'center', fontFamily:'Inter', fontSize: Math.max(14, h * 0.28), fill:'rgba(127,127,127,.95)'});
    const g = new fabric.Group([r, n], Object.assign({originX:'center', originY:'center', angle: e.hoek || 0, data}, keuze));
    g.set(midden(w, h));
    g.setControlsVisibility({ml:false, mr:false, mt:false, mb:false});
    return g;
  }
  if (e.soort === 'vorm' || e.soort === 'lijn'){
    const w = Math.max(2, (e.b || 0.3) * W), h = Math.max(2, (e.h || 0.2) * H);
    const basis = Object.assign({originX:'center', originY:'center', fill: CS.kleurHex(hs, e.kleur || 'accent', thema), opacity: e.dekking === undefined ? 1 : e.dekking, angle: e.hoek || 0, strokeWidth:0, data}, keuze);
    const o = e.vorm === 'cirkel' ? new fabric.Ellipse(Object.assign(basis, {rx: w / 2, ry: h / 2})) : new fabric.Rect(Object.assign(basis, {width: w, height: h}));
    o.set(midden(w, h));
    if (e.soort === 'lijn') o.setControlsVisibility({tl:false, tr:false, bl:false, br:false, mt:false, mb:false});
    return o;
  }
  return null;
}

/* ---------- een slide tekenen ---------- */
/* Volgorde van onder naar boven: kleur, textuur, foto en overlay, elementen "achter", vlakken, logo, tekstvakken, elementen, tekstvakken "voor".
   opties.export: geen plaatshouders en niets aanklikbaar. opties.voorbeeld: idem, maar een fotovak wordt een grijs vlak. */
let tekenTeller = 0;
async function tekenSlide(canvas, slide, design, opties = {}){
  const mijn = canvas.__dsTeken = ++tekenTeller;
  const hs = CS.huisstijl();
  const {b: W, h: H} = maat(design);
  const thema = slideThema(hs, slide, design);
  const tpl = tplVan(hs, slide, design);
  const kleur = w => CS.kleurHex(hs, w, thema);
  const exp = !!opties.export, vb = !!opties.voorbeeld, stil = exp || vb;
  const aan = slide.aanpassingen || {};
  const ov = vak => Object.assign({}, vak, aan[vak.id] || {});
  const L = {grond:[], foto:[], achter:[], vlakken:[], logo:[], tekst:[], el:[], voor:[]};
  // achtergrond: de textuur van de slide, anders de afbeelding van het thema
  const tx = slide.textuur;
  const grondId = tx === undefined || tx === null ? (thema && thema.achtergrondafbeelding) : tx.id;
  if (grondId){
    const a = (hs.achtergronden || []).find(x => x.id === grondId);
    if (a && a.asset){
      try{
        const img = await laadBeeld(await DS.assetBeeld(a.asset));
        const s = Math.max(W / img.width, H / img.height);
        const sterkte = tx && typeof tx.sterkte === 'number' ? tx.sterkte : 1;
        img.set({originX:'center', originY:'center', left: W / 2, top: H / 2, scaleX:s, scaleY:s, opacity: sterkte, selectable:false, evented:false, data:{laag:'grond'}});
        L.grond.push(img);
      }catch(e){ console.warn(e); }
    }
  }
  // fotovakken, met de overlay erover
  for (const vak of tpl.vakken || []){
    if (vak.rol !== 'foto') continue;
    const o = ov(vak); if (o.weg) continue;
    const x = o.x * W, y = o.y * H, w = o.b * W, h = o.h * H;
    let heeftFoto = false;
    if (slide.foto){
      try{
        const img = await laadBeeld(await fotoBron(slide.foto));
        const pos = Object.assign({px:0.5, py:0.5, zoom:1}, slide.fotoPositie || {});
        const basis = o.uitsnede === 'passen' ? Math.min(w / img.width, h / img.height) : Math.max(w / img.width, h / img.height);
        const s = basis * Math.max(1, pos.zoom || 1);
        const iw = img.width * s, ih = img.height * s;
        img.set({originX:'left', originY:'top', left: x + (w - iw) * pos.px, top: y + (h - ih) * pos.py, scaleX:s, scaleY:s,
          selectable: !stil, evented: !stil, hasControls:false, hasBorders:false, lockRotation:true, lockScalingX:true, lockScalingY:true, hoverCursor:'move',
          clipPath: new fabric.Rect({left:x, top:y, width:w, height:h, absolutePositioned:true}), data:{bron:'foto', soort:'foto', vakId: vak.id, vak:{x, y, w, h}}});
        L.foto.push(img); heeftFoto = true;
      }catch(e){ console.warn(e); if (!stil) L.foto.push(...fotoHulp(x, y, w, h, 'Foto niet geladen. Kies hem opnieuw.', vak.id)); }
    } else if (vb) L.foto.push(new fabric.Rect({left:x, top:y, width:w, height:h, fill:'rgba(140,140,140,.45)', selectable:false, evented:false}));
    else if (!exp) L.foto.push(...fotoHulp(x, y, w, h, 'Kies een foto', vak.id));
    const ol = slide.overlay;
    if (heeftFoto && ol && ol.donkerte > 0){
      L.foto.push(new fabric.Rect({left:x, top:y, width:w, height:h, fill: kleur(ol.kleur || DS.donkersteKleur(hs)), opacity: Math.min(1, ol.donkerte), selectable:false, evented:false, data:{laag:'overlay'}}));
    }
  }
  // vrije elementen
  for (const e of slide.elementen || []){
    try{ const o = await maakElement(e, W, H, hs, thema, stil); if (o) (e.achter ? L.achter : L.el).push(o); }catch(err){ console.warn('Element niet getekend', e, err); }
  }
  for (const v of tpl.vlakken || []) L.vlakken.push(new fabric.Rect({left:v.x * W, top:v.y * H, width:v.b * W, height:v.h * H, fill: kleur(v.kleur), opacity: v.dekking === undefined ? 1 : v.dekking, strokeWidth:0, selectable:false, evented:false, data:{laag:'vlak'}}));
  const index = design.slides.indexOf(slide);
  for (const vak of tpl.vakken || []){
    if (vak.rol === 'foto') continue;
    const o = ov(vak); if (o.weg) continue;
    if (vak.rol === 'logo'){
      const logo = (hs.logos || []).find(l => l.id === (o.logo || vak.logo)) || (hs.logos || [])[0];
      if (logo && logo.asset){
        try{
          const img = await laadBeeld(await DS.assetBeeld(logo.asset));
          const w = o.b * W, h = o.h * H; const s = Math.min(w / img.width, h / img.height);
          img.set(Object.assign({originX:'center', originY:'center', left: o.x * W + img.width * s / 2, top: o.y * H + img.height * s / 2, scaleX:s, scaleY:s, angle: o.hoek || 0,
            selectable: !stil, evented: !stil, data:{bron:'vak', vakId: vak.id, rol:'logo', soort:'logo'}}, KEUZE));
          img.setControlsVisibility({ml:false, mr:false, mt:false, mb:false});
          L.logo.push(img);
        }catch(e){ console.warn(e); }
      }
      continue;
    }
    let tekst = (slide.teksten || {})[vak.rol];
    if (tekst === undefined || tekst === null) tekst = standaardTekst(hs, slide, vak, index, design);
    const leeg = !String(tekst).trim();
    if (leeg && stil) continue;
    if (leeg && vak.rol === 'afzender' && !hs.afzender) continue;
    const t = maakTekst(Object.assign({}, o, {tekst, leeg, plaatshouder: PLAATSHOUDER[vak.rol] || 'Typ hier'}), W, H, hs, thema, {
      editable: !stil, selectable: !stil, evented: !stil,
      data: {bron:'vak', vakId: vak.id, rol: vak.rol, soort:'tekst', leeg, maxTekens: vak.maxTekens || null, hoofdletters: !!o.hoofdletters, origineel: leeg ? '' : String(tekst)}
    });
    (o.voor ? L.voor : L.tekst).push(t);
  }
  if (canvas.__dsTeken !== mijn) return false; // er is intussen opnieuw getekend
  canvas.__dsBezig = true;
  canvas.clear();
  canvas.backgroundColor = kleur('achtergrond');
  for (const o of [...L.grond, ...L.foto, ...L.achter, ...L.vlakken, ...L.logo, ...L.tekst, ...L.el, ...L.voor]) canvas.add(o);
  canvas.__dsBezig = false;
  canvas.requestRenderAll();
  return true;
}
function fotoHulp(x, y, w, h, tekst, vakId){
  const data = {rol:'foto-hulp', bron:'fotohulp', vakId};
  return [
    new fabric.Rect({left:x + 12, top:y + 12, width:w - 24, height:h - 24, fill:'rgba(127,127,127,.12)', stroke:'rgba(127,127,127,.6)', strokeDashArray:[18,12], strokeWidth:4, selectable:false, evented:true, hoverCursor:'pointer', data}),
    new fabric.Text(tekst, {left:x + w / 2, top:y + h / 2, originX:'center', originY:'center', fontFamily:'Inter', fontSize:44, fill:'rgba(127,127,127,.95)', selectable:false, evented:true, hoverCursor:'pointer', data})
  ];
}
Object.assign(DS, {tekenSlide, maakTekst, maakElement});

/* ---------- geschiedenis en bewaren ---------- */
/* Een momentopname zonder het tijdstip van bewaren, anders ziet elke keer bewaren eruit als een wijziging */
const momentopname = () => JSON.stringify(Object.assign({}, ED.design, {bijgewerkt: undefined}));
function onthoud(direct){
  clearTimeout(ED.geschiedenisTimer);
  const doe = () => {
    const s = momentopname();
    if (ED.terug[ED.terug.length - 1] !== s){ ED.terug.push(s); if (ED.terug.length > 80) ED.terug.shift(); ED.vooruit = []; }
    werkKnoppenBij();
  };
  if (direct) doe(); else ED.geschiedenisTimer = setTimeout(doe, 450);
  bewaarStraks();
}
function bewaarStraks(){
  clearTimeout(ED.bewaarTimer);
  zetBewaarstatus('Niet bewaard');
  ED.bewaarTimer = setTimeout(bewaar, 1200);
}
async function bewaar(){
  if (!ED.design || !ED.post) return;
  ED.design.bijgewerkt = new Date().toISOString();
  if (CS.staat.demo){ zetBewaarstatus('Voorbeeld: niet bewaard'); return; }
  try{ await CS.dbZet('designs/p' + ED.post.id, ED.design); zetBewaarstatus('Bewaard'); }
  catch(e){ zetBewaarstatus('Bewaren lukte niet'); }
}
function zetBewaarstatus(t){ const s = document.getElementById('ds-bewaarstatus'); if (s) s.textContent = t; }
async function ongedaan(){
  clearTimeout(ED.geschiedenisTimer);
  const nu = momentopname();
  if (ED.terug[ED.terug.length - 1] !== nu) ED.terug.push(nu); // een stap die nog niet was onthouden
  if (ED.terug.length < 2) return;
  ED.vooruit.push(ED.terug.pop());
  ED.design = JSON.parse(ED.terug[ED.terug.length - 1]);
  ED.sel = null; ED.actief = Math.min(ED.actief, ED.design.slides.length - 1);
  await DS.tekenAlles(); werkKnoppenBij(); bewaarStraks();
}
async function opnieuw(){
  if (!ED.vooruit.length) return;
  const s = ED.vooruit.pop(); ED.terug.push(s);
  ED.design = JSON.parse(s);
  ED.sel = null; ED.actief = Math.min(ED.actief, ED.design.slides.length - 1);
  await DS.tekenAlles(); werkKnoppenBij(); bewaarStraks();
}
function werkKnoppenBij(){
  const t = document.getElementById('ds-knop-ongedaan'), v = document.getElementById('ds-knop-opnieuw');
  if (t) t.disabled = ED.terug.length < 2 && momentopname() === ED.terug[0];
  if (v) v.disabled = !ED.vooruit.length;
}
Object.assign(DS, {onthoud, bewaar, ongedaan, opnieuw, werkKnoppenBij});

/* ---------- "op alle slides": elementen met dezelfde groep blijven gelijk ---------- */
function groepLeden(e){
  if (!e || !e.groep) return [];
  const uit = [];
  ED.design.slides.forEach((s, i) => { for (const x of s.elementen || []) if (x.groep === e.groep && x !== e) uit.push({x, i}); });
  return uit;
}
/* Neemt de eigenschappen van e over in de andere leden; geeft de slide-nummers terug die opnieuw getekend moeten worden */
function synchroon(e){
  const leden = groepLeden(e);
  for (const {x} of leden){
    const id = x.id;
    for (const k of Object.keys(x)) delete x[k];
    Object.assign(x, kopie(e), {id});
  }
  return [...new Set(leden.map(l => l.i))];
}
function zetOpAlleSlides(slideIndex, e){
  e.groep = e.groep || nieuwId('g');
  ED.design.slides.forEach((s, i) => {
    if (i === slideIndex) return;
    if ((s.elementen || []).some(x => x.groep === e.groep)) return;
    elementenVan(s).push(Object.assign(kopie(e), {id: nieuwId('e')}));
  });
}
Object.assign(DS, {groepLeden, synchroon, zetOpAlleSlides});

/* ---------- slides ---------- */
const RUIL = {quote:'kop', kop:'quote', lijst:'tekst', tekst:'lijst', actie:'tekst', ondertitel:'tekst'};
/* Zet een slide op een ander template en verdeel de tekst over de rollen van dat template (zonder tekenen of onthouden) */
function herverdeel(slide, nieuw){
  const hs = CS.huisstijl();
  const tpl = CS.template(hs, nieuw); if (!tpl || !slide) return false;
  const rollen = tpl.vakken.map(v => v.rol);
  const oud = Object.assign({}, slide.teksten || {});
  const nieuweTeksten = {};
  for (const [rol, tekst] of Object.entries(oud)){
    if (!tekst) continue;
    let doel = rollen.includes(rol) ? rol : (rollen.includes(RUIL[rol]) ? RUIL[rol] : null);
    if (doel && nieuweTeksten[doel]) doel = null;
    if (doel){
      if (doel === 'lijst' && rol !== 'lijst') nieuweTeksten[doel] = tekst.split(/\n+|(?<=[.!?])\s+/).filter(Boolean).map(r => r.startsWith('•') ? r : '• ' + r).join('\n');
      else if (rol === 'lijst' && doel !== 'lijst') nieuweTeksten[doel] = tekst.replace(/^•\s*/gm, '');
      else nieuweTeksten[doel] = tekst;
    } else if (rol !== 'afzender' && rol !== 'nummer'){
      const rest = rollen.includes('tekst') ? 'tekst' : (rollen.includes('lijst') ? 'lijst' : rollen.find(r => !['foto','logo','afzender','nummer'].includes(r)));
      if (rest) nieuweTeksten[rest] = ((nieuweTeksten[rest] || '') + (nieuweTeksten[rest] ? '\n' : '') + tekst).trim();
    }
  }
  slide.template = nieuw; slide.teksten = nieuweTeksten; slide.aanpassingen = {};
  return true;
}
async function wisselTemplate(nieuw, slideIndex = ED.actief){
  const slide = ED.design.slides[slideIndex];
  if (!herverdeel(slide, nieuw)) return;
  ED.sel = null;
  onthoud(true);

/* ---------- Slidetekst uit Notion ----------
   Het ingeklapte blok Slidetekst heeft per slide één regel: "Slide 1 · cover: tekst" (of "1: tekst"). */
function slidetekstUit(tekst){
  const s = String(tekst || '');
  const i = s.search(/slidetekst/i); if (i < 0) return [];
  const regels = s.slice(i).split('\n').slice(1);
  const uit = [];
  for (const ruw of regels){
    const r = CS.zonderEscapes(ruw.replace(/<[^>]+>/g, '')).replace(/\*\*/g, '').trim();
    if (!r){ if (/<\/details>/i.test(ruw) && uit.length) break; continue; }
    const m = r.match(/^(?:[-*•]\s*)?(?:slide\s*)?(\d{1,2})\s*(?:[·|]\s*([^:]{1,40}?))?\s*[:.)]\s*(.+)$/i);
    if (m){ uit.push({nr: +m[1], type: (m[2] || '').trim(), tekst: m[3].trim()}); continue; }
    if (uit.length) break;
  }
  return uit.sort((a, b) => a.nr - b.nr).slice(0, 10);
}
const AANHALING = /^["“‘']+|["”’']+$/g;
function tekstenVoor(tpl, tekst){
  const rollen = (tpl.vakken || []).map(v => v.rol).filter(r => !['foto','logo','afzender','nummer'].includes(r));
  const t = String(tekst || '').trim();
  const zinnen = t.match(/[^.!?]+[.!?]*/g) || [t];
  if (rollen.includes('quote')) return {quote: t.replace(AANHALING, '')};
  if (rollen.includes('lijst')){
    const dp = t.indexOf(':');
    const kopDeel = rollen.includes('kop') && dp > 0 && dp < 60 ? t.slice(0, dp).trim() : '';
    const rest = kopDeel ? t.slice(dp + 1) : t;
    const punten = rest.split(/\s*(?:;|•|\|)\s*/).map(x => x.trim()).filter(Boolean);
    const lijst = (punten.length > 1 ? punten : zinnen.map(z => z.trim()).filter(Boolean)).map(x => '• ' + x.replace(/^[-•]\s*/, '')).join('\n');
    return kopDeel ? {kop: kopDeel, lijst} : {lijst};
  }
  if (rollen.includes('actie')){
    if (rollen.includes('kop') && zinnen.length > 1 && CS.tekens(zinnen[0].trim()) <= 35) return {kop: zinnen[0].trim(), actie: t.slice(zinnen[0].length).trim()};
    return CS.tekens(t) <= 35 && rollen.includes('kop') ? {kop: t} : {actie: t};
  }
  if (rollen.includes('tekst')){
    if (rollen.includes('kop') && / \| /.test(t)){ const [k, ...r] = t.split(' | '); return {kop: k.trim(), tekst: r.join(' ').trim()}; }
    return {tekst: t};
  }
  if (rollen.includes('kop')) return {kop: t};
  return rollen[0] ? {[rollen[0]]: t} : {};
}
function slidesUitSlidetekst(regels, soort){
  const hs = CS.huisstijl(); const tpls = templatesVoor(hs, {soort});
  if (!tpls.length || !regels.length) return [];
  if (soort === 'reelomslag'){ const tpl = tpls.find(t => t.id === 'reelomslag') || tpls[0]; return [{id: nieuwId(), template: tpl.id, teksten: tekstenVoor(tpl, regels[0].tekst)}]; }
  return regels.map((r, i) => {
    const naam = r.type.toLowerCase();
    let tpl = tpls.find(t => t.id.toLowerCase() === naam || String(t.naam || '').toLowerCase() === naam);
    if (!tpl){
      const w = /cover|omslag/.test(naam) ? 'cover' : /quote|citaat/.test(naam) ? 'quote' : /lijst/.test(naam) ? 'lijst' : /stap/.test(naam) ? 'stap' : /cta|afsluit|actie/.test(naam) ? 'cta' : /tekst|kop/.test(naam) ? 'tekst' : (i === 0 ? 'cover' : i === regels.length - 1 ? 'cta' : 'tekst');
      tpl = tpls.find(t => t.id === w) || tpls.find(t => t.type === w) || tpls.find(t => t.id.startsWith(w)) || tpls[0];
    }
    return {id: nieuwId(), template: tpl.id, teksten: tekstenVoor(tpl, r.tekst)};
  });
}
DS.slidetekstUit = slidetekstUit; DS.slidesUitSlidetekst = slidesUitSlidetekst;

/* ---------- caption omzetten in slides ---------- */
function verdeelZelf(caption, haakje, soort){
  if (soort === 'reelomslag') return [{id: nieuwId(), template:'reelomslag', teksten:{kop: haakje}}];
  const alineas = String(caption || '').split(/\n\s*\n/).map(a => a.trim()).filter(Boolean);
  if (alineas.length && alineas[0].replace(/\W/g,'').toLowerCase() === String(haakje).replace(/\W/g,'').toLowerCase()) alineas.shift();
  const slot = alineas.length > 1 ? alineas.pop() : '';
  const slides = [{id: nieuwId(), template:'cover', teksten:{kop: haakje}}];
  let huidig = '';
  for (const a of alineas){
    if (huidig && CS.tekens(huidig + ' ' + a) > 120){ slides.push({id: nieuwId(), template:'tekst', teksten:{tekst: huidig}}); huidig = ''; }
    huidig = huidig ? huidig + '\n\n' + a : a;
    if (slides.length >= 8) break;
  }
  if (huidig) slides.push({id: nieuwId(), template:'tekst', teksten:{tekst: huidig}});
  slides.push({id: nieuwId(), template:'cta', teksten:{kop: 'Wat neem jij mee?', actie: slot || 'Bewaar deze post'}});
  return slides.slice(0, 10);
}

/* ---------- exporteren ---------- */
async function exporteerSlide(slide, design = ED.design){
  const {b: W, h: H} = maat(design);
  const elem = document.createElement('canvas');
  const c = new fabric.StaticCanvas(elem, {width: W, height: H, enableRetinaScaling: false});
  await tekenSlide(c, slide, design, {export: true});
  let q = 0.9, data;
  for (let i = 0; i < 8; i++){
    data = c.toDataURL({format: 'jpeg', quality: q});
    if ((data.length - 23) * 0.75 < MAX_BYTES) break;
    q -= 0.08;
  }
  c.dispose();
  return data;
}
function base64Van(dataUrl){ return dataUrl.slice(dataUrl.indexOf(',') + 1); }
function blobVan(dataUrl){ const b = atob(base64Van(dataUrl)); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(a){ let c = 0xFFFFFFFF; for (let i = 0; i < a.length; i++) c = CRC[(c ^ a[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function maakZip(bestanden){ // bestanden: [{naam, data: Uint8Array}], zonder compressie
  const delen = [], centraal = []; let offset = 0;
  const enc = new TextEncoder();
  for (const f of bestanden){
    const naam = enc.encode(f.naam); const crc = crc32(f.data);
    const kop = new DataView(new ArrayBuffer(30));
    kop.setUint32(0, 0x04034b50, true); kop.setUint16(4, 20, true); kop.setUint16(8, 0, true); kop.setUint32(14, crc, true); kop.setUint32(18, f.data.length, true); kop.setUint32(22, f.data.length, true); kop.setUint16(26, naam.length, true);
    delen.push(new Uint8Array(kop.buffer), naam, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint32(16, crc, true); c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, naam.length, true); c.setUint32(42, offset, true);
    centraal.push(new Uint8Array(c.buffer), naam);
    offset += 30 + naam.length + f.data.length;
  }
  const grootte = centraal.reduce((s, x) => s + x.length, 0);
  const eind = new DataView(new ArrayBuffer(22));
  eind.setUint32(0, 0x06054b50, true); eind.setUint16(8, bestanden.length, true); eind.setUint16(10, bestanden.length, true); eind.setUint32(12, grootte, true); eind.setUint32(16, offset, true);
  return new Blob([...delen, ...centraal, new Uint8Array(eind.buffer)], {type: 'application/zip'});
}
function mapNaam(){ return (ED.post.datum || CS.vandaag()).slice(0, 10) + ' - ' + CS.schoneNaam(ED.post.haakje); }
async function bewaarBestand(filename, data){
  const d = CS.staat.downloads;

  if (!CS.staat.demo) throw {code:'geen_downloads', message:'Downloaden kan hier niet. Open je Content Studio in Claude.'};
  // voorbeeldweergave buiten Claude: gewoon via de browser

}

const schud = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
async function variantBeeld(post, soort, v, breedte){
  const hs = CS.huisstijl();
  const design = {soort, thema: v.thema, slides: []};
  const slide = {template: v.template, teksten: {kop: post.haakje, afzender: hs.afzender || ''}};

  const c = new fabric.StaticCanvas(document.createElement('canvas'), {width: Math.round(W * z), height: Math.round(H * z), enableRetinaScaling: false});
  c.setZoom(z);
  await tekenSlide(c, slide, design, {voorbeeld: true});
  const url = c.toDataURL({format: 'jpeg', quality: 0.86, multiplier: 2}); c.dispose(); return url;
}
async function toonVarianten(post, werk){
  if (!werk) return;
  CS.staat.nietVerversen = true;
  zetVol(false);
  werk.innerHTML = '';
  const bestaand = ED.post && ED.design && ED.post.id === post.id ? ED.design : null;
  const soort = bestaand ? bestaand.soort : await kiesSoort(post);
  if (!soort){ toonLijst(werk); return; }
  const hs = CS.huisstijl();
  const alle = templatesVoor(hs, {soort});
  let tpls = soort === 'reelomslag' ? alle : alle.filter(CS.isCoverTemplate);
  if (!tpls.length) tpls = alle.slice(0, 4);
  const themas = (hs.themas || []).length ? hs.themas : [{id: hs.standaardThema}];
  const raster = el('div', {class:'ds-varianten' + (soort === 'reelomslag' ? ' reel' : '')});
  const status = el('p', {class:'zacht-tekst klein-tekst', role:'status'});
  werk.append(
    el('div', {class:'ds-postbalk'},
      el('div', {class:'ds-post'},
        knop('', {icoon:'terug', soort:'klein stil', label:'Terug naar Te designen', titel:'Terug naar Te designen', klik: () => toonLijst(werk)}),
        el('div', {class:'ds-post-tekst'}, el('b', {class:'ds-haakje', text: post.haakje, title: post.haakje}),
          el('span', {class:'zacht-tekst klein-tekst', text: 'Andere look'}))),
      el('div', {class:'ds-postknoppen'},
        bestaand ? knop('Terug naar je design', {soort:'klein', klik: () => toonEditor(werk)}) : null,
        knop('Shuffle', {icoon:'opnieuw', klik: () => vul(true)}))),
    raster, status);
  let fotos = [];
  const vul = async schudden => {
    raster.innerHTML = '';
    let combos = [];
    for (const t of tpls) for (const th of themas) combos.push({template: t.id, thema: th.id, metFoto: (t.vakken || []).some(v => v.rol === 'foto')});
    combos = schudden ? schud(combos) : combos;
    // eerst elk template één keer, daarna de rest: zo zie je meteen de verscheidenheid
    const gezien = new Set(); const eerst = [], later = [];
    for (const c of combos){ (gezien.has(c.template) ? later : eerst).push(c); gezien.add(c.template); }
    combos = eerst.concat(later).slice(0, 12);
    const fotoReeks = schud(fotos).slice(0, 4);
    let f = 0;
    for (const c of combos) if (c.metFoto && fotoReeks.length) c.foto = fotoReeks[f++ % fotoReeks.length];
    for (const c of combos){
      const tpl = CS.template(hs, c.template), th = CS.thema(hs, c.thema);
      const img = el('img', {alt: ''});
      raster.appendChild(el('button', {type:'button', class:'ds-variant', title: (tpl.naam || tpl.id) + ' · ' + ((th && th.naam) || c.thema), onclick: () => begin(post, werk, {soort, template: c.template, thema: c.thema, foto: c.foto || null})},
        el('div', {class:'ds-variant-beeld'}, img),
        el('span', {text: (tpl.naam || tpl.id) + ' · ' + ((th && th.naam) || c.thema)})));
      variantBeeld(post, soort, c, 220).then(u => { img.src = u; }).catch(e => { console.warn(e); img.alt = 'Voorbeeld niet gelukt'; });
    }
  };
  await vul(false);
  status.textContent = 'Foto\'s worden erbij gezocht';
  fotos = await haalFotoKeuzes();
  status.textContent = fotos.length ? '' : 'Geen foto\'s gevonden in je Bibliotheek foto\'s. Je kiest er straks een in de editor.';
  if (fotos.length && document.body.contains(raster)) await vul(false);
}

/* Content Studio - Design Studio, deel 2: het zijpaneel met vier tabbladen (Tekst, Ontwerp, Foto's, Extra),

/* ---------- slepen naar een slide ---------- */
let gesleept = null;
function sleepbaar(knopEl, lading){
  knopEl.draggable = true;
  knopEl.addEventListener('dragstart', e => { gesleept = lading; e.dataTransfer.effectAllowed = 'copy'; try{ e.dataTransfer.setData('text/plain', 'content-studio'); }catch(x){} document.body.classList.add('ds-sleept'); });
  knopEl.addEventListener('dragend', () => { gesleept = null; document.body.classList.remove('ds-sleept'); document.querySelectorAll('.ds-slide.ds-doel').forEach(k => k.classList.remove('ds-doel')); });
  return knopEl;
}
const slideBij = t => t && t.closest ? t.closest('.ds-slide') : null;
document.addEventListener('dragover', e => {
  if (!gesleept) return;
  const k = slideBij(e.target); if (!k) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  document.querySelectorAll('.ds-slide.ds-doel').forEach(x => { if (x !== k) x.classList.remove('ds-doel'); });
  k.classList.add('ds-doel');
});
document.addEventListener('dragleave', e => { const k = slideBij(e.target); if (k && !k.contains(e.relatedTarget)) k.classList.remove('ds-doel'); });
document.addEventListener('drop', async e => {
  if (!gesleept) return;
  const k = slideBij(e.target); if (!k) return;
  e.preventDefault();
  const lading = gesleept; gesleept = null;
  k.classList.remove('ds-doel'); document.body.classList.remove('ds-sleept');
  const i = Number(k.dataset.i); if (isNaN(i) || !ED.design.slides[i]) return;
  DS.maakActief(i);
  const doek = k.querySelector('.ds-doek'); const r = (doek || k).getBoundingClientRect();
  const fx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), fy = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  if (lading.soort === 'element'){
    const el2 = await lading.maak();
    if (el2.soort !== 'hoektekst'){
      el2.x = Math.max(0, Math.min(1 - (el2.b || 0.2), fx - (el2.b || 0.2) / 2));
      el2.y = Math.max(0, Math.min(1 - (el2.h || 0.1), fy - (el2.h || 0.1) / 2));
    }
    await DS.voegToe(el2, false);
  }
  else if (lading.soort === 'foto') await DS.zetFoto(lading.foto);
  else if (lading.soort === 'textuur') await DS.zetTextuur(lading.keuze, 'slide');
  else if (lading.soort === 'thema') await DS.zetThema(lading.id, 'slide');
  else if (lading.soort === 'template') await DS.wisselTemplate(lading.id, i);
});

/* ---------- kleine voorbeelden van templates ---------- */
const miniaturen = new Map();
DS.miniatuur = async (tplId, themaId, breedte = 132) => {
  const hs = CS.huisstijl(); const tpl = CS.template(hs, tplId);
  const formaat = tpl && tpl.formaat === 'reel' ? 'reel' : 'carrousel';
  const sleutel = [hs.naam, hs.bijgewerkt, tplId, themaId, breedte, JSON.stringify(tpl)].join('|');
  if (miniaturen.has(sleutel)) return miniaturen.get(sleutel);
  const belofte = (async () => {
    const {b: W, h: H} = DS.MATEN[formaat]; const z = breedte / W;
    const c = new fabric.StaticCanvas(document.createElement('canvas'), {width: Math.round(W * z), height: Math.round(H * z), enableRetinaScaling: false});
    c.setZoom(z);
    const slide = {template: tplId, teksten: DS.VOORBEELDTEKST};
    await DS.tekenSlide(c, slide, {soort: formaat === 'reel' ? 'reelomslag' : 'carrousel', thema: themaId, slides: [slide]}, {voorbeeld: true});
    const url = c.toDataURL({format: 'png', multiplier: 2});
    c.dispose();
    return url;
  })();
  miniaturen.set(sleutel, belofte);
  belofte.catch(() => miniaturen.delete(sleutel));
  return belofte;
};

/* ---------- Tekst ---------- */
function vakVan(hs, rol){ for (const t of hs.templates || []) for (const v of t.vakken || []) if (v.rol === rol) return v; return {}; }

  const s = {
    kop: {tekst:'Je kop', font:'kop', grootte:0.06, kleur:'kop', hoofdletters: !!vakVan(hs, 'kop').hoofdletters, b:0.76},

function tabTekst(p){

/* ---------- Ontwerp: template, kleuren en achtergrond ---------- */
async function zetTemplate(id){
  if (!opAlle()){ await DS.wisselTemplate(id, ED.actief); return; }

        el('b', {text:'Aa', style:{color: CS.kleurHex(hs, t.kop, t), fontFamily: `"${CS.fontFamilie(hs, 'kop')}", sans-serif`}}),

    (hs.achtergronden || []).map(a => sleepbaar(el('button', {type:'button', class:'ds-textuur', title: a.naam, 'aria-pressed': String(huidigTx === a.id), onclick: () => kies(a.id)},
      el('span', {class:'ds-textuur-beeld', style:{backgroundImage: a.asset ? `url("${a.asset}")` : null}}, a.asset ? null : el('small', {text: a.naam})), el('span', {text: a.naam, title: a.naam})), {soort:'textuur', keuze: a.id})));
  // Sterkte van de achtergrond: volgt de schakelaar Deze slide | Alle slides

  p.append(...[
    blok('Sterkte', sterkte),

/* ---------- Extra: logo's, hoekteksten, lijnen en vlakken, emoji ---------- */
/* Voegt een element toe aan de actieve slide (en bij Alle slides aan elke slide) en kiest het */
DS.voegToe = async (e, alle) => {
  const i = ED.actief; const slide = ED.design.slides[i];
  e.id = DS.nieuwId('e');
  DS.elementenVan(slide).push(e);
  DS.onthoud(true);
  if (alle === undefined) alle = opAlle();
  if (alle && ED.design.slides.length > 1){
    DS.zetOpAlleSlides(i, e);
    ED.sel = {slide: i, sleutel: 'el:' + e.id};
    await DS.tekenAlles();
  } else await DS.herteken(i, 'el:' + e.id);
  return e;
};
function logoAchtergrond(l){ const n = (l.id + ' ' + l.naam).toLowerCase(); return /wit/.test(n) && !/op[- ]wit/.test(n) ? 'donker' : 'licht'; }

  const {b: W, h: H} = DS.maat(ED.design);

  if (l.asset){ try{ const img = await DS.laadBeeld(await DS.assetBeeld(l.asset)); verhouding = img.height / img.width; }catch(e){} }

/* ---------- Foto's ---------- */
const slideNr = () => 'slide ' + (ED.actief + 1);
function vulFotoSlide(d){
  d.innerHTML = '';
  const hs = CS.huisstijl(); const slide = ED.design.slides[ED.actief]; if (!slide) return;
  if (!DS.heeftFotoVak(hs, slide, ED.design)){
    const met = DS.templatesVoor(hs, ED.design).find(t => (t.vakken || []).some(v => v.rol === 'foto'));
    d.append(el('p', {class:'zacht-tekst klein-tekst', text: 'Op ' + slideNr() + ' is geen plek voor een foto.'}),
      met ? knop('Kies ' + met.naam, {soort:'klein', klik: () => DS.wisselTemplate(met.id, ED.actief)}) : '');
    return;
  }
  if (!slide.foto) return;
  d.append(el('p', {class:'klein-tekst ds-foto-naam', text: slide.foto.naam || 'Foto'}),
    el('div', {class:'ds-foto-bediening'}, ...DS.fotoBediening(ED.actief, {inPaneel: true})),
    knop('Foto weghalen', {soort:'klein stil', icoon:'weg', klik: async () => { delete slide.foto; DS.onthoud(true); await DS.herteken(ED.actief, null); vulFotoSlide(d); }}));
}
function tabFotos(p){
  const slideDeel = el('div', {id:'ds-foto-slide', class:'ds-foto-slide'});
  const zoekveld = el('input', {type:'search', placeholder:'Zoek een foto', 'aria-label':'Zoek een foto'});
  const mappen = el('div', {class:'ds-chips'});
  const raster = el('div', {class:'ds-foto-raster'}, el('div', {class:'laden', text:'Foto\'s worden gezocht'}));
  p.append(slideDeel, blok('Bibliotheek foto\'s', el('div', {class:'ds-invoer-rij'}, zoekveld, knop('Zoek', {soort:'klein', klik: () => zoek()})), mappen, raster));
  vulFotoSlide(slideDeel);
  let lib = null, submappen = [], gekozenMap = null;
  const kijker = 'IntersectionObserver' in window ? new IntersectionObserver(items => {
    for (const it of items) if (it.isIntersecting){ kijker.unobserve(it.target); laadMini(it.target); }
  }, {root: p}) : null;
  const laadMini = async b => {
    try{
      let src;
      if (CS.staat.demo){ const f = CS.DEMO.fotos().find(x => x.id === b.dataset.id); src = CS.DEMO.foto(240, 300, f.kleuren[0], f.kleuren[1]); }
      else src = await CS.drive.beeld(b.dataset.id);
      b.innerHTML = ''; b.appendChild(el('img', {src, alt:'', draggable: 'false'}));
    }catch(e){ b.textContent = 'Geen voorbeeld'; }
  };
  const toon = lijst => {
    raster.innerHTML = '';
    if (!lijst.length){ raster.appendChild(el('div', {class:'leeg'}, el('b', {text:'Geen foto\'s gevonden'}), el('span', {class:'klein-tekst', text:'Zet foto\'s in Content Studio/1. Contentinbox in Google Drive.'}))); return; }
    for (const f of lijst){
      const beeld = el('div', {class:'beeld', 'data-id': f.id, text:'Laden'});
      const foto = CS.staat.demo ? Object.assign({}, f) : f;
      raster.appendChild(sleepbaar(el('button', {type:'button', class:'ds-foto', title: (f.title || '') + (f.description ? '\n' + f.description : ''), 'aria-label':'Zet foto ' + (f.title || '') + ' op ' + slideNr(),
        onclick: async () => { if (await DS.zetFoto(foto)) vulFotoSlide(slideDeel); }}, beeld), {soort:'foto', foto}));
      if (kijker) kijker.observe(beeld); else laadMini(beeld);
    }
  };
  const zoek = async () => {
    raster.innerHTML = ''; raster.appendChild(el('div', {class:'laden', text:'Foto\'s worden gezocht'}));
    if (CS.staat.demo){
      const w = zoekveld.value.trim().toLowerCase();
      toon(CS.DEMO.fotos().filter(f => (!gekozenMap || f.map === gekozenMap) && (!w || (f.title + ' ' + f.description).toLowerCase().includes(w)))); return;
    }
    try{
      const ouder = gekozenMap ? (submappen.find(m => m.title === gekozenMap) || {}).id : lib;
      if (!ouder){ toon([]); return; }
      const w = zoekveld.value.trim().replace(/'/g, "\\'");
      let q = `'${ouder}' in ancestors and mimeType contains 'image/' and trashed = false`;
      if (w) q += ` and (title contains '${w}' or fullText contains '${w}')`;
      toon(await CS.drive.zoek(q, 60));
    }catch(e){ raster.innerHTML = ''; raster.appendChild(el('div', {class:'banner fout', text: CS.foutTekst(e, 'Google Drive')})); }
  };
  zoekveld.addEventListener('keydown', e => { if (e.key === 'Enter') zoek(); });
  const toonMappen = namen => {
    mappen.innerHTML = '';
    const chip = (naam, waarde) => el('button', {type:'button', class:'chip', 'aria-pressed': String(gekozenMap === waarde), onclick: () => { gekozenMap = waarde; toonMappen(namen); zoek(); }}, naam);
    mappen.appendChild(chip('Alles', null));
    for (const n of namen) mappen.appendChild(chip(n, n));
  };
  (async () => {
    try{
      if (CS.staat.demo) toonMappen(['Portret','Aan het werk','Werkplek']);
      else {
        lib = await DS.bibliotheekId();
        if (!lib){ raster.innerHTML = ''; raster.appendChild(el('div', {class:'leeg'}, el('b', {text:'Geen Bibliotheek foto\'s gevonden'}), el('span', {class:'klein-tekst', text:'Maak in Google Drive de map Content Studio/2. Bibliotheek foto\'s, of zeg @setup.'}))); return; }
        submappen = await CS.drive.zoek(`parentId = '${lib}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`, 30);
        toonMappen(submappen.map(m => m.title).sort());
      }
      await zoek();
    }catch(e){ raster.innerHTML = ''; raster.appendChild(el('div', {class:'banner fout', text: CS.foutTekst(e, 'Google Drive')})); }
  })();
}
})();

  } else {

    n = {soort:'tekst', tekst: tekst || (DS.PLAATSHOUDER[p.rol] || 'Tekst'), font: p.font || 'tekst', grootte: p.grootte, kleur: p.kleur || 'tekst', uitlijning: p.uitlijning || 'links', hoofdletters: !!p.hoofdletters, x: p.x, y: p.y, b: p.b, h: p.h, hoek: p.hoek || 0};
  }
  n.id = DS.nieuwId('e'); n.x = (n.x || 0) + 0.03; n.y = (n.y || 0) + 0.03;

/* Naar voren of naar achteren. Elementen hebben twee lagen: achter de tekst van het template (achter: true) of ervoor. */
async function laag(richting){
  const s = ED.sel; if (!s) return;
  const slide = ED.design.slides[s.slide];
  const [soort, id] = deelSleutel(s.sleutel);
  if (soort === 'vak'){
    const a = DS.aanpassing(slide, id);
    if (richting > 0 && a.voor){ melding('Dit staat al helemaal vooraan.'); return; }
    if (richting < 0 && !a.voor){ melding('Dit staat al zo ver mogelijk naar achteren.'); return; }
    a.voor = richting > 0;
  } else if (soort === 'el'){
    const els = slide.elementen; const e = DS.vindEl(slide, id);
    const zelfde = els.filter(x => !!x.achter === !!e.achter); const pos = zelfde.indexOf(e);
    const ruil = (a, b) => { const i = els.indexOf(a), j = els.indexOf(b); [els[i], els[j]] = [els[j], els[i]]; };
    if (richting > 0){
      if (pos < zelfde.length - 1) ruil(e, zelfde[pos + 1]);
      else if (e.achter){ e.achter = false; els.splice(els.indexOf(e), 1); els.unshift(e); }
      else { melding('Dit staat al helemaal vooraan.'); return; }
    } else {
      if (pos > 0) ruil(e, zelfde[pos - 1]);
      else if (!e.achter){ e.achter = true; els.splice(els.indexOf(e), 1); els.push(e); }
      else { melding('Dit staat al zo ver mogelijk naar achteren.'); return; }
    }
    for (const i of DS.synchroon(e)) if (i !== s.slide) DS.herteken(i, undefined, {zonderBalk: true});
  } else return;
  DS.onthoud(true); await DS.herteken(s.slide);
}
async function opAlleSlides(aan){
  const s = ED.sel; if (!s) return;
  const slide = ED.design.slides[s.slide];
  const e = DS.vindEl(slide, deelSleutel(s.sleutel)[1]); if (!e) return;
  if (aan){ DS.zetOpAlleSlides(s.slide, e); melding('Staat nu op alle slides. Wat je aanpast, verandert overal mee.'); }
  else { const g = e.groep; ED.design.slides.forEach((x, i) => { if (i !== s.slide) x.elementen = (x.elementen || []).filter(y => y.groep !== g); }); delete e.groep; melding('Staat nu alleen op deze slide.'); }
  DS.onthoud(true); await DS.tekenAlles();
}

/* ---------- Composio (Instagram) ---------- */
function payloadVan(res){ let p = CS.payload(res); if (typeof p === 'string'){ try{ p = JSON.parse(p); }catch(e){} } return p || {}; }
// Meerdere Instagram-tools in één aanroep. Geen vast account: Composio kiest de Instagram-koppeling zelf.
async function composio(tools, lenient){
  const input = {sync_response_to_workbench: false, tools: tools.map(t => ({tool_slug: t[0], arguments: t[1]}))};
  let p;
  try{ p = payloadVan(await CS.roep('Composio', 'COMPOSIO_MULTI_EXECUTE_TOOL', input, {cache: false})); }
  catch(e){
    if (e && e.code === 'tool_error' && e.result) p = payloadVan(e.result);
    else throw e;
  }
  const results = (p && p.data && p.data.results) || [];
  const top = p && (p.error || (p.data && p.data.error));
  const pick = i => results.find(x => x.index === i) || results[i];
  const out = tools.map((_, i) => { const r = pick(i); return r && r.response && r.response.successful ? r.response.data : null; });
  out.errors = tools.map((_, i) => { const r = pick(i); const er = r && (r.error || (r.response && r.response.error) || (r.response && r.response.data_preview && 'het antwoord was te groot')); return er ? String(typeof er === 'string' ? er : er.message || JSON.stringify(er)) : (r ? '' : String(top || 'geen antwoord')); });
  if (!lenient && out.every(x => x == null)) throw {code:'tool_error', message:'Composio gaf een fout terug. ' + (out.errors.find(Boolean) || '')};
  return out;
}
FV.composio = composio;
const chunks = (arr, n) => arr.reduce((a, x, i) => (i % n ? a[a.length - 1].push(x) : a.push([x]), a), []);
const insVal = m => m.values ? (m.values[0] || {}).value : (m.total_value || {}).value;

/* De cijfers staan in de database van de studio: cijfers/posts en cijfers/account (zie de afspraken).
   FV.data = {opgehaald, posts: {<instagram-id>: {...}}, account: {opgehaald, volgers, profiel, dagen: {datum: {...}}}} */
FV.data = null; FV.fout = null; FV.ververstOp = 0; // tijdstip van de laatste keer Vernieuwen
let bezig = null, bewaardGeladen = null;
const LOKAAL = 'cs:fv:cijfers';

/* Momentopname van de feed, zoals de feedplanner die gebruikt: een bestand feed.json naast de pagina, met de
   beelden in img/. Vorm: {snapshot, profile: {..., picture}, posts: [{id, permalink, timestamp, slides: [{img, video}], ...}], daily: [...]}.
   Er hoeft geen momentopname te zijn: zonder bestand gaat alles gewoon verder. */
FV.momentopname = null;
FV.snapKlaar = (typeof fetch === 'function' ? fetch('feed.json', {cache: 'no-cache'}) : Promise.reject())
  .then(r => r.ok ? r.json() : null).catch(() => null)
  .then(d => { FV.momentopname = d && typeof d === 'object' && (Array.isArray(d.posts) || d.profile || Array.isArray(d.daily)) ? d : null; return FV.momentopname; });
const snapPosts = () => ((FV.momentopname && FV.momentopname.posts) || []).filter(s => s && s.id && Array.isArray(s.slides) && s.slides.length && s.slides[0].img);
const snapDatum = () => FV.momentopname && FV.momentopname.snapshot ? parseDay(FV.momentopname.snapshot) : null;

async function laadBewaard(){
  await FV.snapKlaar;
  if (FV.data && !FV.data.voorbeeld) return FV.data;
  if (bewaardGeladen) return bewaardGeladen;
  bewaardGeladen = (async () => {
    const lokaal = store.get(LOKAAL);
    if (lokaal && lokaal.posts && !FV.data) FV.data = lokaal;
    const [posts, account] = await Promise.all([CS.dbHaal('cijfers/posts'), CS.dbHaal('cijfers/account')]);
    if (posts || account){
      const tijd = x => x && x.opgehaald ? new Date(x.opgehaald).getTime() : 0;
      const db = {opgehaald: (posts && posts.opgehaald) || (account && account.opgehaald) || null, posts: (posts && posts.posts) || {}, account: account || {dagen: {}}};
      if (!FV.data || tijd(db) >= tijd(FV.data)) FV.data = db;
    }
    zetStaat();
    return FV.data;
  })();
  try{ return await bewaardGeladen; } finally { bewaardGeladen = null; }
}
FV.laadBewaard = laadBewaard;
function zetStaat(){
  if (!FV.data) return;
  CS.staat.cijfers = {opgehaald: FV.data.opgehaald, posts: FV.data.posts, voorbeeld: FV.data.voorbeeld || undefined};
  CS.staat.account = FV.data.account;
  if (FV.data.opgehaald) CS.zetCijfersTijd(FV.data.opgehaald);
}

async function haalInstagram(){
  const now = Math.floor(Date.now() / 1000), dayS = 86400;
  const FIELDS = 'id,caption,media_type,media_product_type,permalink,timestamp,like_count,comments_count,is_shared_to_feed';
  // Composio stuurt bij een groot antwoord alleen een ingekort voorbeeld terug; daarom posts in porties van 6.
  const first = await composio([
    ['INSTAGRAM_GET_USER_INFO', {ig_user_id:'me', fields:'username,name,followers_count,follows_count,media_count,biography,website'}],
    ['INSTAGRAM_GET_IG_USER_MEDIA', {ig_user_id:'me', limit:6, fields: FIELDS}],
    ['INSTAGRAM_GET_USER_INSIGHTS', {metric:['reach', 'follower_count'], period:'day', metric_type:'time_series', since: now - 30 * dayS, until: now}]
  ]);
  const [info, media, series] = first;
  if (!media) throw {code:'tool_error', message:'Instagram gaf je posts niet terug. ' + (first.errors[1] || '')};
  const raw = [].concat(media.data || []);
  let after = media.paging && media.paging.next && media.paging.cursors && media.paging.cursors.after;
  while (after && raw.length < 30){
    const [pg] = await composio([['INSTAGRAM_GET_IG_USER_MEDIA', {ig_user_id:'me', limit:6, after, fields: FIELDS}]], true);
    if (!pg || !pg.data || !pg.data.length) break;
    raw.push(...pg.data);
    after = pg.paging && pg.paging.next && pg.paging.cursors && pg.paging.cursors.after;
  }
  const list = raw.map(m => ({id: m.id, caption: m.caption || '', type: m.media_type, product: m.media_product_type, permalink: m.permalink, timestamp: m.timestamp, likes: m.like_count, comments: m.comments_count, trial: m.media_product_type === 'REELS' && m.is_shared_to_feed === false}));
  // Een proefreel (alleen voor niet-volgers) heeft is_shared_to_feed false: geen cijfers ophalen, hij telt niet mee
  for (const part of chunks(list.filter(m => !m.trial), 6)){
    const res = await composio(part.map(m => ['INSTAGRAM_GET_IG_MEDIA_INSIGHTS', {ig_media_id: m.id, metric: ['views', 'reach', 'likes', 'comments', 'saved', 'shares'].concat(m.product === 'REELS' ? ['ig_reels_avg_watch_time'] : ['profile_activity'])}]), true);
    res.forEach((d, i) => { if (d && d.data){ const o = {}; d.data.forEach(x => { o[x.name] = insVal(x); }); part[i].ins = o; } });
  }
  // Dagcijfers. Wat al vaststaat (ouder dan drie dagen en compleet opgehaald) halen we niet opnieuw op.
  const oud = (FV.data && FV.data.account) || {};
  const dagen = Object.assign({}, oud.dagen || {});
  const put = (date, k, v) => { if (v === undefined) return; dagen[date] = Object.assign({}, dagen[date] || {}); dagen[date][k] = v; };
  ((series && series.data) || []).forEach(m => (m.values || []).forEach(v => {
    const d = new Date(String(v.end_time).replace(/\+0000$/, 'Z')); d.setUTCDate(d.getUTCDate() - 1);
    put(d.toISOString().slice(0, 10), m.name === 'reach' ? 'bereik' : 'nieuweVolgers', v.value);
  }));
  const start = new Date(); start.setUTCHours(0, 0, 0, 0);
  const days = Array.from({length: 30}, (_, i) => { const d = new Date(start); d.setUTCDate(d.getUTCDate() - 1 - i); return {d, i}; })
    .filter(({d, i}) => i < 3 || !(dagen[d.toISOString().slice(0, 10)] || {}).vast);
  for (const part of chunks(days, 10)){
    const res = await composio(part.map(({d}) => ['INSTAGRAM_GET_USER_INSIGHTS', {metric:['views', 'total_interactions', 'website_clicks'], period:'day', metric_type:'total_value', since: Math.floor(d / 1000), until: Math.floor(d / 1000) + dayS}]), true);
    res.forEach((r, i) => {
      if (!r || !r.data) return;
      const date = part[i].d.toISOString().slice(0, 10), o = {};
      r.data.forEach(x => { o[x.name] = insVal(x); });
      put(date, 'weergaven', o.views ?? null); put(date, 'interacties', o.total_interactions ?? null); put(date, 'kliks', o.website_clicks ?? null);
      if (part[i].i >= 3) put(date, 'vast', true);
    });
  }
  // Dagen ouder dan twee jaar laten we vallen
  const grens = new Date(Date.now() - 730 * 86400000).toISOString().slice(0, 10);
  Object.keys(dagen).forEach(k => { if (k < grens) delete dagen[k]; });

  // Posts: nieuwe cijfers erbij, oudere posts blijven bewaard (hoogstens 150)
  const posts = Object.assign({}, (FV.data && FV.data.posts) || {});
  list.forEach(m => {
    const i = m.ins || {};
    posts[m.id] = {
      permalink: m.permalink || '', datum: String(m.timestamp || '').slice(0, 10), timestamp: m.timestamp || null, soort: m.product || '', type: m.type || '',
      begin: String(m.caption || '').split('\n')[0].slice(0, 80), caption: String(m.caption || '').slice(0, 2300), proef: m.trial || undefined,
      views: i.views ?? null, reach: i.reach ?? null, saved: i.saved ?? null, shares: i.shares ?? null,
      likes: i.likes ?? m.likes ?? null, comments: i.comments ?? m.comments ?? null,
      interacties: i.views != null || i.reach != null ? (i.likes ?? m.likes ?? 0) + (i.comments ?? m.comments ?? 0) + (i.saved ?? 0) + (i.shares ?? 0) : null,
      profiel: i.profile_activity ?? null, kijktijd: i.ig_reels_avg_watch_time != null ? Math.round(i.ig_reels_avg_watch_time / 100) / 10 : null
    };
  });
  const ids = Object.keys(posts).sort((a, b) => String(posts[b].timestamp || posts[b].datum).localeCompare(String(posts[a].timestamp || posts[a].datum)));
  ids.slice(150).forEach(k => { delete posts[k]; });

  const opgehaald = new Date().toISOString();
  const profiel = info ? {username: info.username, name: info.name, biography: info.biography || '', website: info.website || '', followers_count: info.followers_count, follows_count: info.follows_count, media_count: info.media_count} : (oud.profiel || null);
  const account = {opgehaald, volgers: info ? info.followers_count : (oud.volgers ?? null), profiel, dagen};
  FV.data = {opgehaald, posts, account};
  zetStaat();
  try{ await CS.dbZet('cijfers/posts', {opgehaald, posts}); }catch(e){ console.warn('cijfers/posts bewaren lukte niet', e); }
  try{ await CS.dbZet('cijfers/account', account); }catch(e){ console.warn('cijfers/account bewaren lukte niet', e); }
  store.set(LOKAAL, FV.data);
  return FV.data;
}

/* De kern roept dit aan bij Vernieuwen (true); de schermen bij het openen (false: gebruik wat er is, haal op als het ouder is dan zes uur). */
CS.vernieuwCijfers = async (geforceerd) => {
  if (CS.staat.demo){ if (!FV.data) FV.data = demoData(); zetStaat(); return FV.data; }
  if (geforceerd){ FV.ververstOp = Date.now(); SLIDES.clear(); CAPTIONS.clear(); TEGELS.clear(); }
  await laadBewaard();
  const leeftijd = FV.data && FV.data.opgehaald ? Date.now() - new Date(FV.data.opgehaald).getTime() : Infinity;
  if (!geforceerd && leeftijd < ZES_UUR) return FV.data;
  if (!CS.staat.mcp) return FV.data;
  if (!bezig) bezig = haalInstagram()
    .then(d => { FV.fout = null; return d; }, e => { console.warn(e); FV.fout = CS.foutTekst(e, 'Instagram (Composio)'); return FV.data; })
    .finally(() => { bezig = null; });
  return bezig;
};
FV.bezig = () => !!bezig;

/* ---------- posts aan Instagram koppelen ---------- */
const norm = s => String(s || '').toLowerCase().replace(/<[^>]+>/g, ' ').replace(/[^a-zà-ÿ0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const shortcode = FV.shortcode = u => (String(u || '').match(/instagram\.com\/(?:[^/]+\/)?(?:p|reel|tv)\/([^/?#]+)/) || [])[1] || '';
function matchPost(m, posts, igVan){
  const sc = shortcode(m.permalink);
  if (sc){ const p = posts.find(p => shortcode(igVan.get(p)) === sc); if (p) return p; }
  const first = norm(String(m.caption || '').split('\n')[0]);

      list.push(t);

    t.snap = s;
    if (!t.mediaId) t.mediaId = s.id;
    if (!t.product && s.product) t.product = s.product;
    if (!t.mediaType && s.type) t.mediaType = s.type;
    if (!t.timestamp && s.timestamp){ t.timestamp = s.timestamp; t.liveDate = parseTs(s.timestamp); }

/* Een post heeft in Notion een link naar een map met 01.jpg, 02.jpg ... (carrousel) of naar één JPEG (reelomslag). */
CS.slidesVan = async post => {
  const link = post && (post.link || '');
  if (!isDrive(link)) return [];
  const id = CS.driveIdUitLink(link);
  if (/\/folders\//.test(link)){
    const f = await CS.drive.zoek(`parentId = '${id}' and mimeType contains 'image/' and trashed = false`, 30);
    return f.sort((a, b) => String(a.title || a.name || '').localeCompare(String(b.title || b.name || ''), 'nl', {numeric: true}));
  }

const SLIDES = new Map();   // post-id -> {status, bestanden, beelden, fout}

function verklein(src, breed){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try{
        const s = Math.min(1, breed / img.naturalWidth), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      }catch(e){ res(src); }
    };
    img.onerror = () => res(src);
    img.src = src;
  });
}
/* De eerste slide als kleine tegel; die bewaren we ook in de browser, zodat de feed de volgende keer meteen staat */
async function tegelVan(it){
  const p = it.post; if (!p) return null;
  if (TEGELS.has(p.id)) return TEGELS.get(p.id);
  if (CS.staat.demo){ const s = demoSlides(it); const t = s.length ? s[0] : null; TEGELS.set(p.id, t); return t; }
  const sleutel = 'cs:fv:tegel:' + p.link;
  const bewaard = !FV.ververstOp && store.get(sleutel);
  if (bewaard){ TEGELS.set(p.id, bewaard); return bewaard; }
  const s = SLIDES.get(p.id);
  let eerste = s && s.beelden && s.beelden[0];
  if (!eerste){
    const best = s && s.bestanden ? s.bestanden : await CS.slidesVan(p);
    if (!best.length) return null;
    eerste = await CS.drive.beeld(best[0].id);
  }
  const klein = await verklein(eerste, 360);
  TEGELS.set(p.id, klein); store.set(sleutel, klein);
  return klein;
}

function demoSlide(b, h, k1, k2, nummer, tekst){
  const c = document.createElement('canvas'); c.width = b; c.height = h;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, b, h);
  gr.addColorStop(0, k1); gr.addColorStop(1, k2); g.fillStyle = gr; g.fillRect(0, 0, b, h);
  g.fillStyle = 'rgba(255,255,255,.14)'; g.beginPath(); g.arc(b * 0.7, h * 0.3, b * 0.28, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = `700 ${Math.round(b * 0.07)}px "Space Grotesk", Inter, sans-serif`;
  const woorden = String(tekst).toUpperCase().split(' '), regels = []; let r = '';
  for (const w of woorden){ if (g.measureText(r + ' ' + w).width > b * 0.82 && r){ regels.push(r); r = w; } else r = (r ? r + ' ' : '') + w; }
  if (r) regels.push(r);
  regels.slice(0, 5).forEach((x, i) => g.fillText(x, b * 0.08, h * 0.5 + i * b * 0.085));
  g.font = `600 ${Math.round(b * 0.035)}px Inter, sans-serif`; g.fillStyle = 'rgba(255,255,255,.8)';
  g.fillText('Voorbeeld · ' + nummer, b * 0.08, h * 0.1);
  return c.toDataURL('image/jpeg', 0.85);
}

let kijker = null;
const wachtrij = [], bezigTegels = new Set();
function tegelWerk(){
  while (bezigTegels.size < 3 && wachtrij.length){
    const {it, knop} = wachtrij.shift();
    const id = it.post.id;
    if (bezigTegels.has(id) || TEGELS.has(id)){ if (TEGELS.get(id)) zetTegelBeeld(knop, TEGELS.get(id)); continue; }
    bezigTegels.add(id);
    tegelVan(it).then(src => { if (src){ document.querySelectorAll(`.fv-tile[data-post="${CSS.escape(id)}"]`).forEach(k => zetTegelBeeld(k, src)); zetKalBeeld(id, src); } })
      .catch(() => { TEGELS.set(id, null); document.querySelectorAll(`.fv-tile[data-post="${CSS.escape(id)}"] .fv-texttile`).forEach(t => t.classList.remove('fv-loading')); })
      .finally(() => { bezigTegels.delete(id); tegelWerk(); });
  }
}
function zetTegelBeeld(knop, src){
  const t = knop.querySelector('.fv-texttile'); if (!t) return;
  const img = mk('img'); img.src = src; img.alt = ''; t.replaceWith(img);
}
const tekstTegel = hook => { const t = mk('div', 'fv-texttile'); t.append(mk('span', '', hook)); return t; };
function tegel(S, it){
  const b = mk('button', 'fv-tile'); b.type = 'button';
  const isPlan = it.kind === 'plan', snapSrc = snapBeeld(it);
  const heeftSlides = !snapSrc && it.post && (CS.staat.demo ? !!it.post.link : isDrive(it.link));
  b.setAttribute('aria-label', `${isPlan ? it.status : 'Live'}: ${it.hook}`);
  if (it.post) b.dataset.post = it.post.id;
  const klaar = !snapSrc && it.post && TEGELS.get(it.post.id);
  if (snapSrc){
    // Beeld uit de momentopname; lukt het laden niet, dan het haakje als tekst
    const img = mk('img'); img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
    img.addEventListener('error', () => img.replaceWith(tekstTegel(it.hook)), {once: true});
    img.src = snapSrc; b.append(img);
  }
  else if (klaar){ const img = mk('img'); img.src = klaar; img.alt = ''; b.append(img); }
  else {
    const t = mk('div', 'fv-texttile' + (heeftSlides && !(it.post && TEGELS.has(it.post.id)) ? ' fv-loading' : ''));
    t.append(mk('span', '', it.hook)); b.append(t);
  }
  if (isPlan) b.append(mk('span', pillClass(it.status), it.status));
  if (isPlan && ZONDER_DESIGN.includes(it.status)){ b.append(mk('span', 'fv-pill fv-st-accent fv-miss', 'nog geen design')); b.classList.add('fv-twee'); }
  else if (isPlan && !it.link){ b.append(mk('span', 'fv-pill fv-st-grijs fv-miss', 'ontwerp ontbreekt')); b.classList.add('fv-twee'); }
  const reel = it.product ? it.product === 'REELS' : /reel/i.test(it.soort);
  const meer = it.product ? it.mediaType === 'CAROUSEL_ALBUM' || (it.snap && it.snap.slides.length > 1) : true;
  if (reel) b.insertAdjacentHTML('beforeend', ICON.reel); else if (meer) b.insertAdjacentHTML('beforeend', ICON.carousel);
  if (isPlan) b.append(mk('span', 'fv-when', it.date ? fmtShort(it.date) : 'Nog geen datum'));
  if (S.sel === it && S.modus === 'detail') b.classList.add('fv-sel');
  b.addEventListener('click', () => kies(S, it, true));
  if (heeftSlides && !klaar && !(it.post && TEGELS.has(it.post.id))){
    b._it = it;
    if (kijker) kijker.observe(b); else { wachtrij.push({it, knop: b}); tegelWerk(); }
  }
  return b;
}
function tekenGrid(S){
  const g = S.grid; g.textContent = '';

    for (const x of items) if (x.isIntersecting){ kijker.unobserve(x.target); wachtrij.push({it: x.target._it, knop: x.target}); }

  }, {root: S.w, rootMargin: '300px'}) : null;
  const {plans, live} = S.data;

  live.forEach(p => g.append(tegel(S, p)));
  if (!plans.length && !live.length){

/* ---------- kalender: maand en weken ---------- */
const DAGEN_KORT = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
const maandag = d => { const x = dayOf(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const plusDagen = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekNr = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dg = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dg); const j = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - j) / 86400000 + 1) / 7); };
const dagKort = d => d.toLocaleDateString('nl-NL', {weekday:'short'}).replace('.', '') + ' ' + fmtShort(d);
const STATUSKLAS = {Design:'ontwerp', Video:'ontwerp', Klaar:'klaar', Gepland:'klaar', Bezig:'klaar', Fout:'fout', Live:'live'};
const itStatus = it => it.kind === 'live' ? 'Live' : (it.status || (it.post && it.post.status) || 'Klaar');
const itDatum = it => it.kind === 'live' ? (it.liveDate || null) : (it.date || null);
const kanSlepen = it => it.kind === 'plan' && it.post && it.post.id;
const beeldVan = it => snapBeeld(it) || (it.post && TEGELS.get(it.post.id)) || null;
function itemsPerDag(S){
  const m = new Map();
  [...S.data.plans, ...S.data.live].forEach(it => { const d = itDatum(it); if (!d) return; const k = iso(d); if (!m.has(k)) m.set(k, []); m.get(k).push(it); });
  return m;
}
function weergave(){ return store.get(WEERGAVE) === 'weken' ? 'weken' : 'maand'; }
function tekenKalender(S){
  const k = S.kal; if (!k) return; k.textContent = '';
  const kop = mk('div', 'pl-kop');
  const wg = weergave();
  if (!kalMaand) kalMaand = new Date(today().getFullYear(), today().getMonth(), 1);
  const titel = mk('h2', 'pl-titel');
  kop.append(titel);

  if (wg === 'maand'){
    titel.textContent = kalMaand.toLocaleDateString('nl-NL', {month:'long', year:'numeric'});
    const nav = mk('div', 'pl-nav');
    const knopje = (tekst, label, f) => { const b = mk('button', 'fv-btn pl-pijl', tekst); b.type = 'button'; b.setAttribute('aria-label', label); b.addEventListener('click', f); return b; };
    nav.append(
      knopje('‹', 'Vorige maand', () => { kalMaand = new Date(kalMaand.getFullYear(), kalMaand.getMonth() - 1, 1); tekenKalender(S); }),
      knopje('Vandaag', 'Naar deze maand', () => { kalMaand = new Date(today().getFullYear(), today().getMonth(), 1); tekenKalender(S); }),
      knopje('›', 'Volgende maand', () => { kalMaand = new Date(kalMaand.getFullYear(), kalMaand.getMonth() + 1, 1); tekenKalender(S); }));
    kop.append(nav);
  } else titel.textContent = 'Per week';
  const seg = mk('div', 'fv-seg pl-seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Weergave');
  [['maand', 'Maand'], ['weken', 'Weken']].forEach(([id, t]) => {
    const b = mk('button', '', t); b.type = 'button'; b.setAttribute('aria-pressed', String(wg === id));
    b.addEventListener('click', () => { store.set(WEERGAVE, id); tekenKalender(S); });
    seg.append(b);
  });
  kop.append(seg);
  k.append(kop);
  if (wg === 'maand') tekenMaand(S, k); else tekenWeken(S, k);
  // Legenda onderaan het blok, onder de kalender (19 nov 2026)

  k.append(leg);

function kalItem(S, it, klein){
  const st = itStatus(it), b = mk('button', 'pl-th pl-s-' + (STATUSKLAS[st] || 'klaar') + (klein ? '' : ' pl-th-groot')); b.type = 'button';

function tekenMaand(S, k){
  const raster = mk('div', 'pl-maand');
  DAGEN_KORT.forEach(d => raster.append(mk('div', 'pl-dagnaam', d)));
  const perDag = itemsPerDag(S), start = maandag(kalMaand), vandaag = iso(today());
  const eind = new Date(kalMaand.getFullYear(), kalMaand.getMonth() + 1, 0);
  const n = Math.ceil((dayDiff(eind, start) + 1) / 7) * 7;
  for (let i = 0; i < n; i++){
    const d = plusDagen(start, i), key = iso(d);
    const cel = mk('div', 'pl-dag' + (d.getMonth() !== kalMaand.getMonth() ? ' pl-anders' : '') + (key === vandaag ? ' pl-vandaag' : '') + (d < today() ? ' pl-voorbij' : ''));
    cel.setAttribute('aria-label', fmtLong(d));
    cel.append(mk('span', 'pl-nr', String(d.getDate())));
    const items = (perDag.get(key) || []).slice().sort((a, b) => (a.kind === 'live') - (b.kind === 'live'));
    const lijst = mk('div', 'pl-items');
    items.slice(0, 3).forEach(it => lijst.append(kalItem(S, it, true)));

      m.addEventListener('click', () => { store.set(WEERGAVE, 'weken'); wekenTerug = Math.max(wekenTerug, Math.ceil(dayDiff(maandag(today()), maandag(d)) / 7)); tekenKalender(S); });
      lijst.append(m);
    }
    cel.append(lijst);
    // Loslaten op een dag: nieuwe publicatiedatum
    cel.addEventListener('dragover', e => { if (!S.sleep) return; e.preventDefault(); try{ e.dataTransfer.dropEffect = 'move'; }catch(x){} cel.classList.add('pl-drop'); });
    cel.addEventListener('dragleave', e => { if (!cel.contains(e.relatedTarget)) cel.classList.remove('pl-drop'); });
    cel.addEventListener('drop', e => { e.preventDefault(); cel.classList.remove('pl-drop'); const it = S.sleep; S.sleep = null; if (it) verplaats(S, it, key); });

}
function tekenWeken(S, k){
  const lijst = mk('div', 'pl-weken');
  const perDag = itemsPerDag(S), eerste = plusDagen(maandag(today()), -7 * wekenTerug);
  if (wekenTerug < 26){

    b.addEventListener('click', () => { wekenTerug += 4; tekenKalender(S); });

  }
  const aantal = wekenTerug + 6;
  for (let w = 0; w < aantal; w++){
    const ma = plusDagen(eerste, 7 * w), zo = plusDagen(ma, 6);
    const items = [];
    for (let i = 0; i < 7; i++) (perDag.get(iso(plusDagen(ma, i))) || []).forEach(it => items.push(it));
    const kop = mk('h3', 'pl-weekkop', `Week ${weekNr(ma)} · ${fmtShort(ma)} tot ${fmtShort(zo)}`);
    if (iso(ma) === iso(maandag(today()))) kop.append(mk('span', 'pl-deze', 'deze week'));
    lijst.append(kop);
    if (!items.length){ lijst.append(mk('p', 'pl-leeg', 'Nog niets gepland.')); continue; }
    items.sort((a, b) => itDatum(a) - itDatum(b)).forEach(it => {
      const st = itStatus(it), rij = mk('div', 'pl-rij');

      tekst.append(mk('b', '', it.hook), mk('span', '', [dagKort(itDatum(it)), soort, it.pillar].filter(Boolean).join(' · ')));
      rij.append(tekst, mk('span', pillClass(st), st));

function tekenZonderDatum(S, k){
  const zonder = S.data.plans.filter(it => !it.date && ['Design', 'Video', 'Klaar', 'Gepland'].includes(itStatus(it)));
  if (!zonder.length) return;

/* Slepen naar een dag: nieuwe publicatiedatum in Notion; lukt dat niet, dan gaat de post terug */
async function verplaats(S, it, waarde){
  const p = it.post; if (!p || it.kind === 'live' || p.datum === waarde) return;
  const voor = p.datum;
  p.datum = waarde;
  bouwOpnieuw(S); tekenGrid(S); tekenKalender(S);
  if (CS.staat.demo){ CS.melding('Voorbeeld: verplaatst naar ' + fmtLong(parseDay(waarde)) + '. In Notion is niets veranderd.'); return; }
  try{
    await CS.notion.zetVelden(p.id, {'date:Publicatiedatum:start': waarde, 'date:Publicatiedatum:is_datetime': 0});
    const r = (CS.staat.rijen || []).find(x => x.url === p.url); if (r) r['date:Publicatiedatum:start'] = waarde;
    CS.melding('Verplaatst naar ' + fmtLong(parseDay(waarde)) + '. Opgeslagen in Notion.');

  }catch(e){
    p.datum = voor;
    CS.melding('Verplaatsen lukte niet. ' + CS.foutTekst(e, 'Notion'), 'fout');
    if (actief(S)){ bouwOpnieuw(S); tekenGrid(S); tekenKalender(S); }
  }
}
