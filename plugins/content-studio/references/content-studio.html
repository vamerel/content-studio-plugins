<title>Content Studio</title>
<meta name="content-studio-versie" content="4">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:ital@0;1&display=swap">
<style>
/* Layout: vaste kolom links (menu), wit werkvlak rechts. Op een telefoon wordt het menu een balk bovenaan. */
:root{
  --achtergrond:#eef1ef; --menu:#e3e8e5; --vlak:#ffffff; --vlak-2:#f6f8f7; --lijn:#d6ddd9; --lijn-sterk:#b8c3bd;
  --tekst:#18211d; --zacht:#5b6a63; --flauw:#8a968f;
  --accent:#205b4c; --accent-zacht:#dceee7; --accent-tekst:#ffffff;
  --goed:#1d7546; --goed-bg:#e2f3e8; --let-op:#8a6400; --let-op-bg:#fbf1d2; --fout:#b2281f; --fout-bg:#fbe6e3; --info:#2b5c8a; --info-bg:#e3eef8;
  --schaduw:0 1px 2px rgba(20,35,28,.06),0 6px 20px rgba(20,35,28,.06);
  --font:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-kop:'Space Grotesk','Inter',system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --achtergrond:#111614; --menu:#171e1b; --vlak:#1c2421; --vlak-2:#212a26; --lijn:#2c3733; --lijn-sterk:#3b4843;
  --tekst:#e7ede9; --zacht:#a2b0a9; --flauw:#7d8b85;
  --accent:#7cc7ae; --accent-zacht:#1f3a31; --accent-tekst:#0d1a15;
  --goed:#82d3a2; --goed-bg:#1b3326; --let-op:#e8c463; --let-op-bg:#352c12; --fout:#ff9d93; --fout-bg:#3b1f1c; --info:#9cc6ef; --info-bg:#1b2c3c;
  --schaduw:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --achtergrond:#111614; --menu:#171e1b; --vlak:#1c2421; --vlak-2:#212a26; --lijn:#2c3733; --lijn-sterk:#3b4843;
  --tekst:#e7ede9; --zacht:#a2b0a9; --flauw:#7d8b85;
  --accent:#7cc7ae; --accent-zacht:#1f3a31; --accent-tekst:#0d1a15;
  --goed:#82d3a2; --goed-bg:#1b3326; --let-op:#e8c463; --let-op-bg:#352c12; --fout:#ff9d93; --fout-bg:#3b1f1c; --info:#9cc6ef; --info-bg:#1b2c3c;
  --schaduw:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--achtergrond);color:var(--tekst);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-kop);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:24px;font-weight:600} h2{font-size:17px;font-weight:600} h3{font-size:14px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.menu{background:var(--menu);border-right:1px solid var(--lijn);display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px;min-height:0;overflow:auto}
.profiel{display:flex;align-items:center;gap:10px;padding:4px 6px}
.profiel .foto{width:40px;height:40px;border-radius:50%;background:var(--accent-zacht);color:var(--accent);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.profiel .foto img{width:100%;height:100%;object-fit:cover}
.profiel .naam{font-weight:600;line-height:1.25}
.profiel .sub{color:var(--zacht);font-size:12px}
.nav{display:grid;gap:2px}
.nav button,.menu-onder button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--tekst);font-weight:500}
.nav button:hover,.menu-onder button:hover{background:var(--vlak-2)}
.nav button[aria-current="page"]{background:var(--vlak);box-shadow:var(--schaduw);color:var(--accent);font-weight:600}
.nav svg,.menu-onder svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-onder{margin-top:auto;display:grid;gap:2px;border-top:1px solid var(--lijn);padding-top:12px}
.bijgewerkt{font-size:12px;color:var(--flauw);padding:2px 10px 0}

.werkvlak{background:var(--vlak);min-width:0;min-height:0;overflow:auto;padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.scherm-kop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.scherm-kop p{color:var(--zacht);margin-top:4px;max-width:62ch}

.knop{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--lijn-sterk);background:var(--vlak);color:var(--tekst);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.knop:hover{background:var(--vlak-2)}
.knop.hoofd{background:var(--accent);border-color:var(--accent);color:var(--accent-tekst);font-weight:600}
.knop.hoofd:hover{filter:brightness(1.07)}
.knop.klein{padding:4px 9px;font-size:13px}
.knop.stil{border-color:transparent;background:none}
.knop[disabled]{opacity:.45;cursor:default}
.knop svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kolommen{display:grid;gap:16px}
.kaart{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--r);padding:14px 16px;min-width:0}
.kaart.zacht{background:var(--vlak-2)}
.zacht-tekst{color:var(--zacht)} .klein-tekst{font-size:12px}
.label{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--vlak-2);color:var(--zacht);white-space:nowrap}
.label.design{background:var(--info-bg);color:var(--info)} .label.video{background:#efe3f7;color:#6b3a8f}
.label.klaar{background:var(--accent-zacht);color:var(--accent)} .label.gepland{background:var(--info-bg);color:var(--info)}
.label.bezig{background:var(--let-op-bg);color:var(--let-op)} .label.live{background:var(--goed-bg);color:var(--goed)} .label.fout{background:var(--fout-bg);color:var(--fout)}
.label.ontbreekt{background:var(--fout-bg);color:var(--fout)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .label.video{background:#2f2238;color:#d7b3f0}}
:root[data-theme="dark"] .label.video{background:#2f2238;color:#d7b3f0}
.banner{border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.banner.info{background:var(--info-bg);color:var(--info)} .banner.let-op{background:var(--let-op-bg);color:var(--let-op)} .banner.fout{background:var(--fout-bg);color:var(--fout)} .banner.goed{background:var(--goed-bg);color:var(--goed)}
.banner .knop{margin-left:auto}
.leeg{border:1px dashed var(--lijn-sterk);border-radius:var(--r);padding:28px;text-align:center;color:var(--zacht);display:grid;gap:8px;justify-items:center}
.laden{color:var(--zacht);display:flex;gap:8px;align-items:center}
.laden::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--lijn-sterk);border-top-color:var(--accent);animation:draai 0.8s linear infinite}
@keyframes draai{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.laden::before{animation:none}}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--lijn-sterk);border-radius:8px;background:var(--vlak);padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
label.veld{display:grid;gap:4px;font-weight:500}
label.veld span{font-size:12px;color:var(--zacht);font-weight:500}

#melding{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tekst);color:var(--vlak);padding:9px 16px;border-radius:999px;font-weight:500;box-shadow:var(--schaduw);z-index:50;max-width:calc(100% - 32px)}
#melding.fout{background:var(--fout);color:#fff}

.venster-achter{position:fixed;inset:0;background:rgba(10,20,16,.45);display:grid;place-items:center;z-index:40;padding:16px}
.venster{background:var(--vlak);border-radius:14px;box-shadow:var(--schaduw);width:min(860px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;min-height:0}
.venster-kop{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--lijn)}
.venster-kop h2{flex:1}
.venster-inhoud{padding:16px 18px;overflow:auto;min-height:0}
.venster-voet{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--lijn)}

/* Design Studio */
.ds{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.postlijst{display:grid;gap:8px;position:sticky;top:0}
.post-item{border:1px solid var(--lijn);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;background:var(--vlak);cursor:pointer;text-align:left}
.post-item:hover{border-color:var(--lijn-sterk)}
.post-item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.post-item .haakje{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-item .meta{font-size:12px;color:var(--zacht);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.editor{display:grid;gap:12px;min-width:0}
.werkbalk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--vlak-2);border:1px solid var(--lijn);border-radius:var(--r);padding:8px}
.werkbalk .scheiding{width:1px;align-self:stretch;background:var(--lijn);margin:0 4px}
.slides{display:flex;gap:18px;overflow-x:auto;padding:6px 4px 14px;min-width:0;align-items:flex-start}
.slide-kaart{flex:none;display:grid;gap:6px}
.slide-kaart .slide-kop{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--zacht)}
.slide-kaart canvas{border-radius:4px}
.slide-kaart .canvas-houder{border-radius:6px;box-shadow:0 0 0 1px var(--lijn);background:var(--vlak-2)}
.slide-kaart.actief .canvas-houder{box-shadow:0 0 0 2px var(--accent)}
.slide-toevoegen{flex:none;width:150px;border:1px dashed var(--lijn-sterk);border-radius:6px;display:grid;place-items:center;color:var(--zacht);cursor:pointer;background:none;align-self:stretch;min-height:200px}
.eigenschappen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stalen{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.staal{width:26px;height:26px;border-radius:50%;border:2px solid var(--vlak);box-shadow:0 0 0 1px var(--lijn-sterk);cursor:pointer;padding:0}
.staal[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.teller{font-size:12px;color:var(--zacht);font-variant-numeric:tabular-nums}
.teller.te-veel{color:var(--fout);font-weight:600}
.daan{display:grid;gap:8px}
.foto-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.foto-kaart{border:1px solid var(--lijn);border-radius:8px;overflow:hidden;background:var(--vlak);display:grid;cursor:pointer;text-align:left;padding:0}
.foto-kaart .beeld{aspect-ratio:4/5;background:var(--vlak-2);display:grid;place-items:center;color:var(--flauw);font-size:12px;overflow:hidden}
.foto-kaart .beeld img{width:100%;height:100%;object-fit:cover}
.foto-kaart .naam{font-size:12px;padding:6px 8px;word-break:break-word}
.stappen{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.stappen li{display:flex;gap:8px;align-items:center}
.stappen li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--lijn-sterk);flex:none}
.stappen li.bezig::before{background:var(--let-op)} .stappen li.klaar::before{background:var(--goed)} .stappen li.fout::before{background:var(--fout)}

/* Feed View */
.feed{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:start}
.telefoon{border:1px solid var(--lijn);border-radius:22px;padding:14px 10px;background:var(--vlak-2)}
.telefoon-kop{display:flex;align-items:center;gap:8px;padding:0 4px 10px;font-weight:600}
.raster{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tegel{aspect-ratio:4/5;position:relative;border:0;padding:0;cursor:pointer;overflow:hidden;background:var(--accent-zacht);color:var(--accent);display:block;text-align:left}
.tegel img{width:100%;height:100%;object-fit:cover;display:block}
.tegel .tegel-tekst{position:absolute;inset:0;padding:8px;font-size:11px;font-weight:600;line-height:1.3;overflow:hidden}
.tegel .label{position:absolute;left:4px;bottom:4px;font-size:9px;padding:1px 6px}
.tegel[aria-current="true"]{outline:3px solid var(--accent);outline-offset:-3px}
.scheidingslijn{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:var(--zacht);font-size:12px;margin:6px 0}
.scheidingslijn::before,.scheidingslijn::after{content:"";height:1px;background:var(--lijn);flex:1}
.detail{position:sticky;top:0;display:grid;gap:12px}
.slidekijker{display:flex;gap:8px;overflow-x:auto}
.slidekijker img{height:260px;border-radius:6px;flex:none}
.cijferrij{display:flex;gap:16px;flex-wrap:wrap}
.cijfer{display:grid}
.cijfer b{font-size:18px;font-variant-numeric:tabular-nums;font-family:var(--font-kop)}
.cijfer span{font-size:12px;color:var(--zacht)}
.caption{white-space:pre-wrap;background:var(--vlak-2);border-radius:8px;padding:10px 12px;max-height:280px;overflow:auto}

/* Analyses */
.doelen{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--lijn-sterk);background:var(--vlak);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-tekst)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--lijn);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.kpi.doel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpi .waarde{font-family:var(--font-kop);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .naam{font-size:12px;color:var(--zacht)}
.kpi .verschil{font-size:12px;font-variant-numeric:tabular-nums}
.verschil.op{color:var(--goed)} .verschil.neer{color:var(--fout)}
.meter{height:8px;border-radius:999px;background:var(--vlak-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:999px}
table.tabel{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tabel th{font-size:12px;color:var(--zacht);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--lijn)}
.tabel td{padding:8px;border-bottom:1px solid var(--lijn);vertical-align:top}
.tabel-houder{overflow-x:auto}
.balk{height:10px;background:var(--vlak-2);border-radius:999px;position:relative;min-width:120px}
.balk span{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px}
.balk i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tekst)}
.grafiek{max-width:860px}
.grafiek svg{width:100%;height:auto;display:block}
.grafiek text{fill:var(--zacht);font-size:11px;font-family:var(--font)}

/* Team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.teamlid{border:1px solid var(--lijn);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;background:var(--vlak);text-align:left;cursor:pointer}
.teamlid .kop{display:flex;gap:12px;align-items:center}
.teamlid img,.teamlid .initiaal{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--accent-zacht);flex:none;display:grid;place-items:center;font-weight:700;color:var(--accent)}
.teamlid .update{color:var(--zacht);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.paginatekst{white-space:pre-wrap;line-height:1.6}

/* Instellingen */
.instel{display:grid;gap:16px;max-width:900px}
.kleurrij{display:grid;grid-template-columns:34px minmax(0,1fr) 110px auto;gap:8px;align-items:center}
.kleurrij input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.themarij{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,minmax(90px,1fr));gap:8px;align-items:center}
.templates-raster{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.templates-raster figure{margin:0;display:grid;gap:4px;font-size:12px;color:var(--zacht);flex:none}

@media (max-width: 900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .menu{flex-direction:row;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none;border-right:0;border-bottom:1px solid var(--lijn)}
  .menu::-webkit-scrollbar{display:none}
  .profiel .naam,.profiel .sub,.bijgewerkt{display:none}
  .nav{display:flex;gap:2px}
  .nav button,.menu-onder button{width:auto;padding:8px}
  .nav button span,.menu-onder button span{display:none}
  .menu-onder{display:flex;margin:0 0 0 auto;border:0;padding:0}
  .werkvlak{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ds,.feed{grid-template-columns:1fr}
  .postlijst{position:static}
  .detail{position:static}
}

/* ===== Opmaak in de stijl van de feedplanner (17 nov 2026) =====
   Achtergrond #e9e7e3 met witte panelen over de volle breedte. Menu in de hoofdkleur van de
   gebruiker, titels in hoofdletters in het kopfont en de accentkleur. De merkkleuren en het
   kopfont zet de kern uit de huisstijl (--merk-primair, --merk-accent, --font-kop). */
:root{
  --merk-primair:#1f3f36; --merk-accent:#e4704f;
  --achtergrond:#e9e7e3; --vlak:#ffffff; --vlak-2:#f3f1ee; --lijn:#dbd8d3; --lijn-sterk:#c9c5bf;
  --tekst:#141716; --zacht:#656b68; --flauw:#8b908d;
  --accent:var(--merk-primair); --accent-zacht:color-mix(in srgb, var(--merk-primair) 12%, #fff); --accent-tekst:#ffffff;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --achtergrond:#0e1110; --vlak:#171b1a; --vlak-2:#1f2422; --lijn:#2b3130; --lijn-sterk:#3a4240;
  --tekst:#eef0ee; --zacht:#9ba39f; --flauw:#7d8582;
  --accent:color-mix(in srgb, var(--merk-primair) 45%, #fff); --accent-zacht:color-mix(in srgb, var(--merk-primair) 35%, #000); --accent-tekst:#0d1a15; color-scheme:dark}}
:root[data-theme="dark"]{
  --achtergrond:#0e1110; --vlak:#171b1a; --vlak-2:#1f2422; --lijn:#2b3130; --lijn-sterk:#3a4240;
  --tekst:#eef0ee; --zacht:#9ba39f; --flauw:#7d8582;
  --accent:color-mix(in srgb, var(--merk-primair) 45%, #fff); --accent-zacht:color-mix(in srgb, var(--merk-primair) 35%, #000); --accent-tekst:#0d1a15; color-scheme:dark}
body,.werkvlak{background:var(--achtergrond)}
.werkvlak{padding-block:22px 48px}
h1,h2,h3{font-family:var(--font-kop)}
.scherm-kop{align-items:center;margin-bottom:14px}
.titelrij{display:flex;align-items:center;gap:10px}
.scherm-kop h1{font-size:30px;font-weight:700;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--merk-accent)}
.kop-rechts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}

<style>
/* Feed View en Analyses, naar het voorbeeld van de feedplanner.
   Alle klassen beginnen met fv- (Feed View en gedeeld) of an- (Analyses), zodat ze niet botsen met de rest van de studio.
   Kleuren: de tokens van kop.html (--vlak, --vlak-2, --lijn, --tekst, --zacht, --goed ...) en de merkkleuren
   --merk-primair en --merk-accent die de kern uit de huisstijl zet. De eigen tokens hieronder heten --fv-*. */
:root{
  --fv-prim:var(--merk-primair,#1f3f36);
  --fv-acc:var(--merk-accent,#e4704f);
  --fv-acc-ink:color-mix(in srgb, var(--fv-acc) 72%, #000);
  --fv-prim-ink:var(--fv-prim);
  --fv-op-donker:#ffffff;
  --fv-surface:var(--vlak,#fff); --fv-soft:var(--vlak-2,#f3f1ee); --fv-ink:var(--tekst,#141716); --fv-muted:var(--zacht,#656b68); --fv-line:var(--lijn,#dbd8d3);
  --fv-scrim:rgba(0,0,0,.55);
  --fv-seq:var(--fv-prim); --fv-grid:color-mix(in srgb, var(--fv-line) 75%, transparent);
  --fv-tip-bg:#141716; --fv-tip-fg:#f6f5f2;
  --fv-l1:var(--fv-prim); --fv-l2:var(--fv-acc); --fv-l3:#3b6fb6;
  --fv-good:#1d6b44; --fv-good-bg:#e2f1e8; --fv-warn:#8a5200; --fv-warn-bg:#fcefd9; --fv-bad:#a8322a; --fv-bad-bg:#fae4e1;
  --fv-r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fv-acc-ink:color-mix(in srgb, var(--fv-acc) 70%, #fff);
    --fv-prim-ink:color-mix(in srgb, var(--fv-prim) 40%, #fff);
    --fv-scrim:rgba(0,0,0,.6);
    --fv-seq:color-mix(in srgb, var(--fv-prim) 45%, #fff);
    --fv-tip-bg:#eef0ee; --fv-tip-fg:#141716;
    --fv-l1:color-mix(in srgb, var(--fv-prim) 40%, #fff); --fv-l3:#6b8fd6;
    --fv-good:#7fd3a6; --fv-good-bg:#16301f; --fv-warn:#f0b65c; --fv-warn-bg:#33240c; --fv-bad:#f08a80; --fv-bad-bg:#3a1714;
  }
}
:root[data-theme="dark"]{
  --fv-acc-ink:color-mix(in srgb, var(--fv-acc) 70%, #fff);
  --fv-prim-ink:color-mix(in srgb, var(--fv-prim) 40%, #fff);
  --fv-scrim:rgba(0,0,0,.6);
  --fv-seq:color-mix(in srgb, var(--fv-prim) 45%, #fff);
  --fv-tip-bg:#eef0ee; --fv-tip-fg:#141716;
  --fv-l1:color-mix(in srgb, var(--fv-prim) 40%, #fff); --fv-l3:#6b8fd6;
  --fv-good:#7fd3a6; --fv-good-bg:#16301f; --fv-warn:#f0b65c; --fv-warn-bg:#33240c; --fv-bad:#f08a80; --fv-bad-bg:#3a1714;
}

/* ---------- gedeeld ---------- */

.fv-tip{position:fixed;z-index:60;max-width:340px;background:var(--fv-tip-bg);color:var(--fv-tip-fg);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.18);font-family:var(--font,system-ui)}

.fv-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--fv-line);background:var(--fv-surface);color:var(--fv-ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.fv-btn:hover{border-color:var(--fv-muted)}
.fv-btn[disabled]{opacity:.55;cursor:default}
.fv-btn.fv-solid{background:var(--fv-prim);border-color:var(--fv-prim);color:#fff}

/* ---------- Feed View ---------- */
.fv{container-type:inline-size;container-name:fv}

.fv-phone{background:var(--fv-surface);border:1px solid var(--fv-line);border-radius:22px;overflow:hidden}

.fv-igtabs{display:flex;justify-content:center;border-top:1px solid var(--fv-line)}
.fv-igtabs span{padding:10px 0;border-top:1px solid var(--fv-ink);margin-top:-1px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

.fv-texttile{position:absolute;inset:0;background:var(--fv-prim);color:#fff;display:flex;align-items:center;padding:30px 9px 24px;text-align:left}

.fv-texttile.fv-loading::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:200% 100%;animation:fv-shine 1.4s linear infinite}

.fv-divider{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 10px;font-family:var(--font-kop);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--fv-muted);background:var(--fv-surface)}
.fv-divider::before,.fv-divider::after{content:"";flex:1;height:1px;background:var(--fv-line)}
.fv-more{padding:12px;text-align:center;color:var(--fv-muted);font-size:12.5px}

/* Detailpaneel */
.fv-detail{background:var(--fv-surface);border-radius:var(--fv-r);padding:22px;position:sticky;top:0;max-height:calc(100vh - 48px);overflow:auto;display:flex;flex-direction:column;gap:28px;min-width:0;container-type:inline-size;container-name:fvd}

.fv-dhead{display:flex;flex-direction:column;gap:18px}
/* Bovenste regel: status en labels links, knoppen rechts */
.fv-dtop{display:flex;align-items:flex-start;gap:10px}
.fv-dmeta{flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--fv-muted);font-size:13px;min-width:0}
.fv-dmeta > .fv-pill,.fv-label{height:26px;padding:0 8px;font-size:12px;line-height:1}
@container fvd (max-width: 480px){.fv-dtop{flex-wrap:wrap}.fv-dtop > .fv-links{margin-left:0}}
.fv-label{display:inline-flex;align-items:center;border:1px solid var(--fv-line);border-radius:6px;background:transparent;color:var(--fv-muted);font-weight:500;white-space:nowrap;cursor:default;user-select:none}
.fv-tc{font-variant-numeric:tabular-nums}

.an-panel{background:var(--fv-surface);border-radius:var(--fv-r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.an-panel.an-wide{grid-column:1/-1}
.an-ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.an-ph h2{font-family:var(--font-kop);font-weight:700;font-size:20px;text-transform:uppercase;margin:0;letter-spacing:.02em;line-height:1.2}
.an-ph.an-phstart{justify-content:flex-start;flex-wrap:wrap}
.an-ph.an-phstart .an-conclmeta{margin-left:auto;justify-content:flex-end}
.an-goalbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.an-goaltext{margin:0;font-size:15px;line-height:1.5;max-width:70ch;overflow-wrap:anywhere}
.an-goaltext.an-leeg{color:var(--fv-muted);font-style:italic}
.an-goalinput{width:100%;border:1px solid var(--fv-line);border-radius:10px;padding:9px 11px;background:var(--fv-soft);font:inherit;font-size:14px;line-height:1.5;resize:vertical;color:var(--fv-ink)}
.an-goalbtns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.an-progress .an-meter{margin-block:auto}
.an-meter{position:relative;height:12px;background:var(--fv-soft);border-radius:999px;overflow:hidden}
.an-meter span{display:block;height:100%;background:var(--fv-acc);border-radius:999px;width:0}
.an-meter span.an-up{background:var(--fv-good)}
.an-meter span.an-down{background:var(--fv-bad)}
.an-meter i{position:absolute;top:0;bottom:0;width:2px;background:var(--fv-ink)}
.an-goalstate{font-size:13px;font-weight:600}
.an-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.an-kpi{background:var(--fv-surface);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative}
.an-kpi.an-focus{box-shadow:inset 0 0 0 2px var(--fv-acc)}
.an-kpi .an-l{font-size:12.5px;color:var(--fv-muted)}
.an-kpi .an-v{font-family:var(--font-kop);font-weight:700;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.an-kpi .an-d{font-size:12px;font-weight:600}
.an-kpi .an-d.an-big{font-family:var(--font-kop);font-weight:700;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.an-kpi .an-tag{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;color:var(--fv-acc-ink);text-transform:uppercase;letter-spacing:.05em}
.an-up{color:var(--fv-good)} .an-down{color:var(--fv-bad)} .an-flat{color:var(--fv-muted)}
.an-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@container an (max-width: 820px){.an-panels,.an-goalrow{grid-template-columns:minmax(0,1fr)}}
.an-wait{font-size:13px;color:var(--fv-muted);background:var(--fv-soft);border-radius:10px;padding:12px 14px}
.an-brow{display:grid;grid-template-columns:118px minmax(0,1fr) 128px;gap:10px;align-items:center;font-size:13px;padding:6px 4px;border-radius:8px}
.an-brow:hover{background:var(--fv-soft)}
.an-brow .an-star{color:var(--fv-acc-ink);font-weight:700;margin-left:4px}
.an-brow .an-right{display:flex;align-items:center}
.an-trk{height:12px;background:var(--fv-soft);border-radius:0 4px 4px 0;position:relative}
.an-trk.an-thin{height:7px;margin-top:3px}
.an-brow:hover .an-trk{background:var(--fv-surface)}
.an-fill{position:absolute;left:0;top:0;bottom:0;background:var(--fv-seq);border-radius:0 4px 4px 0}
.an-fill.an-plan{background:color-mix(in srgb, var(--fv-seq) 40%, var(--fv-surface))}
.an-mark{position:absolute;top:-4px;bottom:-4px;width:2px}
.an-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--fv-muted)}
.fv-lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--fv-line);background:var(--fv-surface);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--fv-ink);font-family:inherit}
.fv-lg[aria-pressed="false"]{opacity:.45}
.an-hm{display:grid;grid-template-columns:84px repeat(var(--cols,5),minmax(0,1fr));gap:3px;font-size:12px;align-items:center}
.an-hm .an-ch{text-align:center;color:var(--fv-muted);font-size:11.5px;overflow-wrap:anywhere}
.an-hm .an-rh{color:var(--fv-muted)}
.an-cell{border-radius:6px;padding:9px 4px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.an-cell:hover{outline:2px solid var(--fv-acc);outline-offset:-2px}
.an-cell.an-best{box-shadow:inset 0 0 0 3px var(--fv-acc)}
.an-chart{position:relative}
.an-chart svg{display:block;width:100%;height:auto}
.an-ctip{position:absolute;pointer-events:none;background:var(--fv-tip-bg);color:var(--fv-tip-fg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,0);top:34px;line-height:1.5;font-variant-numeric:tabular-nums;z-index:2}
.an-tops{display:flex;flex-direction:column;gap:6px}
.an-toprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;font-size:13px;border-radius:10px;background:var(--fv-soft);border:0;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.an-toprow:hover{background:color-mix(in srgb, var(--fv-soft) 70%, var(--fv-line))}
.an-toprow .an-topwhy{color:var(--fv-muted);font-size:12.5px;text-align:right;white-space:pre-line;font-variant-numeric:tabular-nums}
.an-muted{font-size:12px;color:var(--fv-muted)}
.an-summary{margin:0;font-size:14.5px;line-height:1.6;white-space:pre-line}
.an-actswrap{display:flex;flex-direction:column;gap:14px}
.an-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.an-act{background:var(--fv-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.an-act .an-k{font-family:var(--font-kop);font-weight:700;text-transform:uppercase;font-size:14px;color:var(--fv-acc-ink)}
.an-acthead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.an-act .an-who{flex:none;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--fv-prim);color:#fff}
.an-act .an-actwhy{color:var(--fv-muted);font-size:13px}
.an-act .an-tick{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.an-act .an-tick input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--fv-good);cursor:pointer;flex:none}
.an-act.an-done{opacity:.6}
.an-act.an-done .an-k,.an-act.an-done > span{text-decoration:line-through}
.an-act > button{margin-top:auto;align-self:flex-start;border:1px solid var(--fv-line);background:var(--fv-surface);color:var(--fv-ink);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:12.5px;font-family:inherit}
.an-concl{display:flex;flex-direction:column;gap:8px;padding:10px 0 16px}
.an-conclmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.an-conclmeta a{border:1px solid var(--fv-line);background:var(--fv-surface);border-radius:8px;padding:5px 10px;font-weight:600;font-size:12.5px;color:inherit;text-decoration:none}
@container an (max-width: 520px){.an-brow{grid-template-columns:90px minmax(0,1fr) 104px}.an-hm{grid-template-columns:66px repeat(var(--cols,5),minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.an-fill,.an-meter span{transition:width .3s ease}}

/* Status als knop met een keuzelijst (17 nov 2026) */
.fv .fv-statuskeuze{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;font:inherit;font-size:11px;font-weight:700;padding:2px 22px 2px 9px;border-radius:999px;line-height:1.5;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 11px) 52%,calc(100% - 7px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.fv .fv-statuskeuze:focus-visible{outline:2px solid var(--merk-accent);outline-offset:2px}
.fv .fv-dmeta > .fv-statuskeuze{font-size:12px;padding:0 21px 0 9px;line-height:26px;background-position:calc(100% - 10px) 52%,calc(100% - 6px) 52%}

/* ---------- Planning: kalender naast de feed (19 nov 2026) ---------- */
@container fv (min-width: 861px){.fv-cols{grid-template-columns:minmax(0,400px) minmax(0,1fr)}.fv-feedcol{max-width:400px}}
.pl-rechts{min-width:0;display:grid}
.pl-kal{background:var(--fv-surface);border-radius:var(--fv-r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:0}
@container fv (max-width: 860px){.pl-kal{position:static}}
.pl-kop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pl-titel{font-family:var(--font-kop);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin:0;margin-right:auto;line-height:1.2}
.pl-nav{display:flex;gap:6px}
.fv-btn.pl-pijl{padding:5px 10px}
.pl-maand{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pl-dagnaam{font-size:11.5px;color:var(--fv-muted);text-align:center;font-weight:600;padding-bottom:2px}
.pl-dag{background:var(--fv-soft);border-radius:8px;min-height:84px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;border:1.5px solid transparent;transition:border-color .12s}
.pl-dag.pl-anders{opacity:.5}
.pl-dag.pl-voorbij .pl-nr{color:var(--fv-muted)}
.pl-dag.pl-vandaag{border-color:var(--fv-acc)}
.pl-dag.pl-vandaag .pl-nr{color:var(--fv-acc-ink);font-weight:700}
.pl-dag.pl-drop{border-color:var(--fv-prim);border-style:dashed;background:color-mix(in srgb, var(--fv-prim) 8%, var(--fv-soft))}
.pl-nr{font-size:11.5px;font-variant-numeric:tabular-nums;line-height:1}
.pl-items{display:flex;flex-wrap:wrap;gap:3px}
.pl-th{width:30px;aspect-ratio:4/5;border-radius:4px;border:0;padding:0;cursor:pointer;background-size:cover;background-position:center;flex:none;position:relative}
.pl-th-groot{width:38px}
.pl-th.pl-s-ontwerp{background-color:color-mix(in srgb, var(--fv-acc) 12%, var(--fv-surface));border:2px dashed var(--fv-acc)}
.pl-th.pl-s-klaar{background-color:var(--fv-prim)}
.pl-th.pl-s-live{background-color:color-mix(in srgb, var(--fv-muted) 35%, var(--fv-surface));opacity:.75}
.pl-th.pl-s-fout{background-color:var(--fv-bad)}
.pl-th[draggable="true"]{cursor:grab}
.pl-th.pl-sleept{opacity:.4}
.pl-th:hover{filter:brightness(.92)}
.pl-th:focus-visible{outline:2px solid var(--fv-acc);outline-offset:1px}
.pl-meer{border:0;background:transparent;font-size:11px;font-weight:700;color:var(--fv-muted);cursor:pointer;padding:0 2px}
.pl-legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fv-muted)}
.pl-legenda span{display:inline-flex;align-items:center;gap:6px}
.pl-stip{display:inline-block;width:12px;height:14px;border-radius:3px}
.pl-stip.pl-s-ontwerp{background:color-mix(in srgb, var(--fv-acc) 12%, var(--fv-surface));border:2px dashed var(--fv-acc)}
.pl-stip.pl-s-klaar{background:var(--fv-prim)}
.pl-stip.pl-s-live{background:color-mix(in srgb, var(--fv-muted) 35%, var(--fv-surface))}
.pl-stip.pl-s-fout{background:var(--fv-bad)}
.pl-tip{font-size:12px;color:var(--fv-muted);margin:0}
.pl-weken{display:flex;flex-direction:column;gap:6px}
.fv-btn.pl-eerder{align-self:flex-start}
.pl-weekkop{font-family:var(--font-kop);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;color:var(--fv-muted);margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.pl-deze{font-family:var(--font,system-ui);text-transform:none;letter-spacing:0;font-size:11px;font-weight:700;color:var(--fv-acc-ink);background:color-mix(in srgb, var(--fv-acc) 14%, transparent);border-radius:999px;padding:1px 8px}
.pl-leeg{font-size:12.5px;color:var(--fv-muted);margin:0 0 4px;padding-left:2px}
.pl-rij{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--fv-soft);border-radius:10px;padding:7px 10px;cursor:pointer}
.pl-rij:hover{background:color-mix(in srgb, var(--fv-soft) 70%, var(--fv-line))}
.pl-rij:focus-visible{outline:2px solid var(--fv-acc);outline-offset:1px}
.pl-rijtekst{min-width:0;display:flex;flex-direction:column;gap:1px}
.pl-rijtekst b{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-rijtekst span{font-size:12px;color:var(--fv-muted)}
.pl-zonder{border-top:1px solid var(--fv-line);padding-top:6px;display:flex;flex-direction:column;gap:6px}
.pl-zonderrij{display:flex;flex-direction:column;gap:5px}
.pl-zonderitem{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;border-radius:8px;padding:4px 6px}
.pl-zonderitem:hover{background:var(--fv-soft)}
.pl-zonderitem span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-btn.pl-terug{align-self:flex-start;margin-bottom:-12px}
@container fv (max-width: 560px){
  .pl-kal{padding:14px 12px}
  .pl-maand{gap:2px}
  .pl-dag{min-height:58px;padding:3px;border-radius:6px}
  .pl-th{width:100%;max-width:26px}
  .pl-titel{font-size:17px;flex-basis:100%}
  .pl-rij{grid-template-columns:34px minmax(0,1fr);}
  .pl-rij > .fv-pill{grid-column:2;justify-self:start}
}

/* Legenda in de kop van de kalender (19 nov 2026) */
.pl-legenda.pl-legenda-kop{margin:0;flex:1 1 auto;justify-content:flex-start;gap:4px 12px;font-size:12px}

.pl-legenda.pl-legenda-onder{margin-top:12px}

/* Planning: Terug, labels en links op één regel boven het witte blok (19 nov 2026) */
.pl-detailbalk{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.pl-detailbalk .pl-terug{margin:0;flex:none}
.pl-detailbalk .fv-dtop{flex:1;min-width:0}

/* Design Studio (fase 1): een balk met de post, links een paneel met tabbladen, in het midden het whiteboard.
   Alle klassen beginnen met ds-. Kleuren komen uit de tokens van kop.html. */
.ds-werk{display:grid;gap:12px;min-width:0}
/* eigen klasse: .banner.info botst met de knop .info uit kop.html */
.banner.ds-voorbeeld{background:var(--info-bg);color:var(--info)}

/* De balk met de post */
.ds-postbalk{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--vlak);border-radius:14px;padding:10px 14px}
.ds-post{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 300px}
.ds-post-tekst{display:grid;min-width:0}
.ds-haakje{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-kop);font-size:15px}
.ds-postknoppen{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
#ds-bewaarstatus{margin:0 6px;min-width:84px;text-align:right}
.ds-menu-houder{position:relative}
.ds-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:35;background:var(--vlak);border:1px solid var(--lijn);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:220px;display:grid;gap:2px}
.ds-menu > button{display:grid;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--tekst)}
.ds-menu > button:hover{background:var(--vlak-2)}
.ds-menu > button span{font-size:12px;color:var(--zacht)}
.ds-pop{left:0;right:auto;padding:12px;min-width:250px}

/* De studio */
.ds-studio{display:grid;grid-template-columns:auto minmax(0,1fr);height:max(540px,calc(100dvh - 215px));background:var(--vlak);border-radius:var(--r);overflow:hidden}

/* Paneel links */
.ds-paneel{display:grid;grid-template-columns:76px 296px;min-height:0;border-right:1px solid var(--lijn)}
.ds-tabs{display:flex;flex-direction:column;gap:2px;padding:10px 6px;background:var(--vlak-2);overflow:auto}
.ds-tabs button{display:grid;justify-items:center;gap:4px;border:0;background:none;border-radius:10px;padding:9px 2px;cursor:pointer;color:var(--zacht);font-size:11px;font-weight:600;line-height:1.1}
.ds-tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ds-tabs button:hover{color:var(--tekst);background:var(--vlak)}
.ds-tabs button[aria-selected="true"]{color:var(--accent);background:var(--vlak);box-shadow:var(--schaduw)}
.ds-tab-inhoud{overflow-x:hidden;overflow-y:auto;padding:16px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start;min-height:0;min-width:0}
.ds-tab-kop{display:grid;gap:3px}
.ds-tab-kop h3{font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.ds-blok{display:grid;gap:8px}
.ds-blok h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);font-weight:700}
.ds-knoppen-stapel{display:grid;gap:8px}
.ds-knoppen-stapel .knop{justify-content:flex-start;white-space:normal;text-align:left}
.ds-knoppen-rij{display:flex;gap:6px;flex-wrap:wrap}
.ds-binnenkort{font-size:12px;color:var(--zacht);border:1px dashed var(--lijn-sterk);border-radius:10px;padding:10px 12px}

/* Templates */
.ds-tpl-raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.ds-tpl-raster.breed{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.ds-tpl{display:grid;gap:5px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font-size:12px;color:var(--zacht);align-content:start}
.ds-tpl-beeld{aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--vlak-2);box-shadow:0 0 0 1px var(--lijn)}
.ds-tpl-beeld.reel{aspect-ratio:9/16}
.ds-tpl-beeld img{width:100%;height:100%;object-fit:cover;display:block}
.ds-tpl-beeld img:not([src]){visibility:hidden}
.ds-tpl:hover .ds-tpl-beeld{box-shadow:0 0 0 2px var(--lijn-sterk)}
.ds-tpl[aria-pressed="true"] .ds-tpl-beeld{box-shadow:0 0 0 3px var(--accent)}
.ds-tpl[aria-pressed="true"]{color:var(--tekst);font-weight:600}

/* Tekst */
.ds-tekst-knop{display:grid;gap:3px;text-align:left;border:1px solid var(--lijn);background:var(--vlak-2);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--tekst);line-height:1.15}
.ds-tekst-knop:hover{border-color:var(--lijn-sterk);background:var(--vlak)}
.ds-tekst-knop small{font-size:11px;color:var(--zacht);font-family:var(--font)}

/* Elementen */
.ds-vinkje{display:flex;gap:10px;align-items:flex-start;background:var(--vlak-2);border-radius:10px;padding:10px 12px;cursor:pointer}
.ds-vinkje input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.ds-vinkje span{display:grid;gap:1px}
.ds-vinkje small{color:var(--zacht);font-size:12px;line-height:1.35}
.ds-vinkje.uit{opacity:.55;cursor:default}
.ds-logo-raster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ds-logo{border:0;padding:0;background:none;cursor:pointer;border-radius:8px}
.ds-logo-beeld{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;padding:8px;box-shadow:0 0 0 1px var(--lijn);overflow:hidden;text-align:center;color:#6b6b6b;line-height:1.2;font-size:10px}
.ds-logo-beeld.licht{background:#f3f1ee}
.ds-logo-beeld.donker{background:var(--merk-primair);color:rgba(255,255,255,.75)}
.ds-logo-beeld img{max-width:100%;max-height:100%;object-fit:contain}
.ds-logo:hover .ds-logo-beeld{box-shadow:0 0 0 2px var(--accent)}
.ds-plek-rij{display:flex;gap:12px;align-items:center}
.ds-plekken{display:grid;grid-template-columns:repeat(3,22px);grid-auto-rows:22px;row-gap:26px;column-gap:4px;padding:5px;border-radius:6px;background:var(--vlak-2);box-shadow:inset 0 0 0 1px var(--lijn-sterk);width:max-content}
.ds-plek{width:22px;height:22px;border:0;border-radius:5px;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.ds-plek i{width:12px;height:4px;border-radius:2px;background:var(--lijn-sterk)}
.ds-plek:hover i{background:var(--zacht)}
.ds-plek[aria-checked="true"] i{background:var(--merk-accent);width:18px;height:5px}
.ds-chips{display:flex;gap:6px;flex-wrap:wrap}
.ds-chip{display:inline-flex;align-items:center;border:1px solid var(--lijn-sterk);border-radius:999px;background:var(--vlak);overflow:hidden;max-width:100%}
.ds-chip-tekst{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px;color:var(--tekst)}
.ds-chip-tekst:hover{background:var(--vlak-2)}
.ds-chip-weg{border:0;border-left:1px solid var(--lijn);background:none;padding:5px 9px;cursor:pointer;color:var(--zacht);font-size:14px;line-height:1}
.ds-chip-weg:hover{color:var(--fout)}
.ds-invoer-rij{display:flex;gap:6px}
.ds-invoer-rij input{flex:1;min-width:0}
.ds-vormen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ds-vorm{display:grid;justify-items:center;align-content:end;gap:6px;border:1px solid var(--lijn);background:var(--vlak-2);border-radius:10px;padding:12px 6px 8px;cursor:pointer;font-size:12px;color:var(--tekst);min-height:78px}
.ds-vorm:hover{border-color:var(--lijn-sterk);background:var(--vlak)}
.ds-vorm i{display:block}
.ds-vorm i.lijn{width:46px;height:4px;margin:14px 0}
.ds-vorm i.vlak{width:46px;height:32px;border-radius:3px}
.ds-vorm i.rond{width:32px;height:32px;border-radius:50%}
.ds-emoji{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.ds-emoji button{border:0;background:none;font-size:22px;line-height:1;padding:6px 0;border-radius:8px;cursor:pointer}
.ds-emoji button:hover{background:var(--vlak-2)}

/* Foto's */
.ds-foto-slide{display:grid;gap:8px}
.ds-foto-bediening{display:grid;gap:10px;justify-items:start}
.ds-foto-bediening .ds-schuif{width:100%}
.ds-foto-raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ds-foto{border:0;padding:0;background:none;cursor:pointer;border-radius:8px;overflow:hidden}
.ds-foto .beeld{aspect-ratio:4/5;background:var(--vlak-2);display:grid;place-items:center;color:var(--flauw);font-size:11px}
.ds-foto .beeld img{width:100%;height:100%;object-fit:cover;display:block}
.ds-foto:hover{outline:2px solid var(--accent);outline-offset:-2px}

/* Achtergrond */
.ds-segment{display:grid;grid-template-columns:1fr 1fr;background:var(--vlak-2);border-radius:10px;padding:3px;gap:3px}
.ds-segment button{border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer;font-weight:500;font-size:13px;color:var(--zacht)}
.ds-segment button[aria-checked="true"]{background:var(--vlak);color:var(--tekst);box-shadow:var(--schaduw);font-weight:600}
.ds-segment button[disabled]{opacity:.5;cursor:default}
.ds-themas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.ds-thema{display:grid;gap:4px;border:0;background:none;padding:0;cursor:pointer;font-size:11px;color:var(--zacht);text-align:center;line-height:1.25;align-content:start}
.ds-thema-staal{aspect-ratio:4/5;border-radius:8px;background-size:cover;background-position:center;display:grid;place-items:center;position:relative;box-shadow:0 0 0 1px var(--lijn)}
.ds-thema-staal b{font-size:20px}
.ds-thema-staal i{position:absolute;left:9px;right:9px;bottom:9px;height:4px;border-radius:2px}
.ds-thema[aria-pressed="true"] .ds-thema-staal{box-shadow:0 0 0 3px var(--accent)}
.ds-thema[aria-pressed="true"]{color:var(--tekst);font-weight:600}
.ds-texturen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.ds-textuur{display:grid;gap:4px;border:0;background:none;padding:0;cursor:pointer;font-size:11px;color:var(--zacht);text-align:center;line-height:1.25;align-content:start}
.ds-textuur-beeld{aspect-ratio:1;border-radius:8px;background:var(--vlak-2) center/cover no-repeat;box-shadow:0 0 0 1px var(--lijn);display:grid;place-items:center;color:var(--zacht);font-size:11px;overflow:hidden;padding:4px}
.ds-textuur-beeld.leeg{background-image:repeating-linear-gradient(45deg,transparent 0 6px,var(--lijn) 6px 7px)}
.ds-textuur[aria-pressed="true"] .ds-textuur-beeld{box-shadow:0 0 0 3px var(--accent)}
.ds-textuur[aria-pressed="true"]{color:var(--tekst);font-weight:600}

/* Schuiven */
.ds-schuif{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--zacht);font-weight:500;white-space:nowrap}
.ds-schuif input{flex:1;min-width:80px;max-width:180px;accent-color:var(--accent)}
.ds-schuif output{min-width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tekst)}

/* Midden: werkbalk, whiteboard en zoom */
.ds-midden{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.ds-werkbalk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--lijn);min-height:53px;background:var(--vlak)}
.ds-wb-naam{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);margin-right:4px;white-space:nowrap}
.ds-wb-scheiding{width:1px;height:24px;background:var(--lijn);margin:0 2px}
.ds-wb-groep{display:inline-flex;align-items:center;gap:2px}
.ds-wb-select{height:32px;padding:4px 8px;font-size:13px;max-width:172px;text-overflow:ellipsis}
.ds-wb-getal{width:58px;height:32px;padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums}
.ds-wb-knop{display:inline-flex;align-items:center;gap:6px;height:32px;border:1px solid var(--lijn);background:var(--vlak);border-radius:8px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;color:var(--tekst)}
.ds-wb-knop:hover{background:var(--vlak-2)}
.ds-wb-knop[aria-pressed="true"]{background:var(--accent-zacht);border-color:var(--accent);color:var(--accent)}
.ds-wb-knop svg,.ds-ik svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ds-aa{font-weight:700;letter-spacing:.05em;font-size:12px}
.ds-ik{display:inline-grid;place-items:center;width:32px;height:32px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--tekst);padding:0;flex:none}
.ds-ik:hover{background:var(--vlak-2)}
.ds-ik[aria-pressed="true"]{background:var(--accent-zacht);color:var(--accent)}
.ds-ik[disabled]{opacity:.3;cursor:default;background:none}
.ds-kleurbol{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none}
.ds-wb-teller{font-size:12px;color:var(--zacht);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.ds-wb-teller.te-veel{color:var(--fout);font-weight:600}
.ds-wb-tip{margin-left:auto}
.ds-kleuren{display:grid;gap:10px}
.ds-andere{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.ds-andere input{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}

.ds-whiteboard{overflow:auto;min-height:0;background-color:var(--vlak-2);background-image:radial-gradient(circle,var(--lijn-sterk) 1px,transparent 1.3px);background-size:22px 22px;position:relative}
.ds-strook{display:flex;gap:28px;align-items:flex-start;padding:28px 32px 20px;width:max-content;min-width:100%}
.ds-slide{flex:none;display:grid;gap:8px}
.ds-doek{border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);background:var(--vlak);line-height:0}
.ds-doek canvas{display:block}
.ds-slide.actief .ds-doek{box-shadow:0 0 0 3px #2f6fed,0 8px 24px rgba(0,0,0,.12)}
.ds-voet{display:flex;align-items:center;gap:6px;min-height:32px}
.ds-nr{font-family:var(--font-kop);font-weight:700;font-size:14px;color:var(--zacht);font-variant-numeric:tabular-nums}
.ds-slide.actief .ds-nr{color:#2f6fed}
.ds-teller{font-size:11px;color:var(--fout);font-weight:600}
.ds-voet-knoppen{margin-left:auto;display:flex}
.ds-plus{flex:none;width:120px;border:2px dashed var(--lijn-sterk);border-radius:6px;display:grid;place-content:center;justify-items:center;gap:6px;color:var(--zacht);cursor:pointer;background:color-mix(in srgb, var(--vlak) 50%, transparent);font-weight:600}
.ds-plus:hover{border-color:var(--accent);color:var(--accent)}
.ds-plus svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.ds-zoombalk{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:6px 12px;border-top:1px solid var(--lijn);background:var(--vlak)}
.ds-zoombalk input{width:140px;accent-color:var(--accent)}
#ds-zoom-tekst{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}

@media (max-width: 1180px){ .ds-paneel{grid-template-columns:66px 252px} .ds-tabs button{font-size:10px} }
@media (max-width: 900px){
  .ds-studio{grid-template-columns:1fr;height:auto}
  .ds-paneel{grid-template-columns:1fr;border-right:0;border-bottom:1px solid var(--lijn)}
  .ds-tabs{flex-direction:row;overflow-x:auto}
  .ds-tabs button{min-width:72px}
  .ds-tab-inhoud{max-height:340px}
  .ds-whiteboard{height:70vh}
  .ds-postknoppen{margin-left:0}
}

/* ===== 19 nov 2026: lijst Te designen, varianten, feedback per slide ===== */
.ds-lijst{display:grid;gap:8px;max-width:980px}
.ds-lijst + .ds-lijst{margin-top:10px}
.ds-lijst-kop{font-family:var(--font-kop);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--zacht);margin:4px 0 2px}
.ds-lijst-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;border:0;background:var(--vlak);border-radius:14px;padding:10px 14px 10px 10px;cursor:pointer;color:var(--tekst);font:inherit}
.ds-lijst-item:hover{box-shadow:0 0 0 2px var(--lijn-sterk)}
.ds-lijst-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ds-lijst-beeld{width:56px;aspect-ratio:4/5;border-radius:8px;background:var(--vlak-2);box-shadow:inset 0 0 0 1px var(--lijn);display:grid;place-items:center;overflow:hidden;font-size:10px;color:var(--zacht);text-align:center;line-height:1.1;padding:2px}
.ds-lijst-beeld.reel{aspect-ratio:9/16;width:44px}
.ds-lijst-beeld img{width:100%;height:100%;object-fit:cover;display:block}
.ds-lijst-beeld:has(img){padding:0}
.ds-lijst-tekst{display:grid;gap:3px;min-width:0}
.ds-lijst-tekst b{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ds-te-laat{color:var(--fout)}
.ds-begonnen{justify-self:start;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-zacht);border-radius:999px;padding:1px 8px}
.ds-verder{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--vlak);border-radius:14px;padding:10px 14px;max-width:980px;margin-bottom:6px}
.ds-verder > span{flex:1 1 240px;min-width:0}
.ds-leeg-tekst{margin:4px 2px;font-size:14px;max-width:640px}
.ds-leeg{background:var(--vlak);border-radius:var(--r);padding:28px;display:grid;gap:10px;justify-items:start;max-width:640px}
.ds-varianten{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px 14px;background:var(--vlak);border-radius:var(--r);padding:18px}
.ds-varianten.reel{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ds-variant{display:grid;gap:6px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font-size:12px;color:var(--zacht);align-content:start;font-family:inherit}
.ds-variant-beeld{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--vlak-2);box-shadow:0 0 0 1px var(--lijn)}
.ds-varianten.reel .ds-variant-beeld{aspect-ratio:9/16}
.ds-variant-beeld img{width:100%;height:100%;object-fit:cover;display:block}
.ds-variant-beeld img:not([src]){visibility:hidden}
.ds-variant:hover .ds-variant-beeld,.ds-variant:focus-visible .ds-variant-beeld{box-shadow:0 0 0 3px var(--merk-accent)}
.ds-variant:hover span{color:var(--tekst)}
.ds-feedback{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--lijn);background:var(--vlak)}
.ds-feedback textarea{flex:1 1 280px;min-width:0;resize:vertical;min-height:36px;max-height:120px;padding:7px 10px;line-height:1.4}
.ds-feedback-alle{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.ds-feedback-alle input{accent-color:var(--accent);width:16px;height:16px}
.ds-feedback-status{flex:1 1 100%;font-size:12px;color:var(--zacht)}
.ds-feedback-status:empty{display:none}
/* Elementen: niets valt meer weg aan de rechterkant */
.ds-tab-inhoud > *{min-width:0;max-width:100%}
.ds-plek-rij{flex-wrap:wrap}
.ds-chip{max-width:100%;min-width:0}
.ds-chip-tekst{max-width:none;min-width:0;flex:1 1 auto}
.ds-invoer-rij{flex-wrap:wrap}
.ds-invoer-rij input{flex:1 1 140px}
.ds-emoji{grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}
.ds-vormen{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.ds-tabs{overflow-x:hidden}
.ds-tabs button span{overflow-wrap:anywhere;text-align:center}
.ds-logo-raster{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
@media (max-width: 900px){
  .ds-tabs{overflow-x:auto}
  .ds-varianten{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px;gap:12px}
  .ds-varianten.reel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ds-lijst-item{grid-template-columns:auto minmax(0,1fr);}
  .ds-lijst-item > .label{grid-column:2;justify-self:start}
}

/* ===== 19 nov 2026 (2): rustige editor met één knoppenbalk ===== */
.ds-balk{display:flex;align-items:stretch;gap:2px;background:var(--vlak);border-radius:16px;padding:6px 8px;overflow-x:auto;scrollbar-width:thin}
.ds-bk{flex:none;display:grid;justify-items:center;align-content:center;gap:3px;min-width:62px;height:54px;padding:4px 8px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--tekst);font:inherit}
.ds-bk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ds-bk > span{font-size:11px;line-height:1;color:var(--zacht);white-space:nowrap}
.ds-bk:hover{background:var(--vlak-2)}
.ds-bk:hover > span{color:var(--tekst)}
.ds-bk[disabled]{opacity:.35;cursor:default;background:none}
.ds-bk.hoofd{background:var(--merk-knop,var(--merk-accent));color:var(--merk-op-knop,#fff);min-width:72px}
.ds-bk.hoofd > span{color:inherit;font-weight:600}
.ds-bk.hoofd:hover{filter:brightness(1.06)}
.ds-bk-zoom{cursor:default}
.ds-bk-zoom:hover{background:none}
.ds-bk-zoom b{font-size:14px;font-variant-numeric:tabular-nums;line-height:20px;font-weight:600}
.ds-bk-scheiding{flex:none;width:1px;margin:10px 6px;background:var(--lijn)}
.ds-bk-ruimte{flex:1 1 12px}
.ds-balk .ds-menu-houder{display:flex}
.ds-bk-pop{position:fixed;right:auto;z-index:45;min-width:280px;max-width:min(360px,calc(100vw - 32px));padding:14px;display:grid;gap:10px}

.ds-menu-item{display:grid;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--tekst);font:inherit}
.ds-menu-item:hover{background:var(--vlak-2)}
.ds-menu-item span{font-size:12px;color:var(--zacht)}
.ds-daan-kop b{font-family:var(--font-kop);font-size:15px}
.ds-snel-rij{display:flex;flex-wrap:wrap;gap:6px}
.ds-snel{border:1px solid var(--lijn);background:var(--vlak);border-radius:999px;padding:6px 11px;cursor:pointer;font:inherit;font-size:13px;color:var(--tekst)}
.ds-snel:hover{border-color:var(--merk-accent)}
.ds-bk-pop textarea{width:100%;min-height:56px}
.ds-daan-voet{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.ds-feedback-status{margin:0;font-size:12px;color:var(--zacht)}
.ds-feedback-status:empty{display:none}
/* Zijpaneel: rustiger */
.ds-studio{height:max(540px,calc(100dvh - 190px))}
.ds-paneel{border-right:0}
.ds-tabs{background:var(--vlak);border-right:1px solid var(--lijn);padding:12px 6px}
.ds-tabs button[aria-selected="true"]{background:var(--vlak-2);box-shadow:none;color:var(--tekst)}
.ds-tab-kolom{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.ds-bereik-houder{padding:14px 16px 0}
.ds-bereik-houder:empty{display:none}
.ds-tab-inhoud{gap:22px;padding-top:14px}
.ds-blok h4{font-size:11px;color:var(--zacht)}
.ds-segment button[aria-checked="true"]{box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ds-tekst-knop{border:0}
.ds-vorm{border:0}
.ds-foto-naam{color:var(--zacht)}
.ds-werkbalk{border-bottom:0;min-height:50px}
/* Slepen */
[draggable="true"]{cursor:grab}
body.ds-sleept .ds-slide .ds-doek{outline:2px dashed var(--lijn-sterk);outline-offset:4px}
.ds-slide.ds-doel .ds-doek{outline:3px solid var(--merk-accent);outline-offset:4px}
@media (max-width: 900px){
  .ds-studio{display:flex;flex-direction:column;height:auto;overflow:visible}
  .ds-midden{order:1;height:64vh;min-height:360px}
  .ds-tab-inhoud{max-height:none}
  .ds-paneel{order:2;border-bottom:0;border-top:1px solid var(--lijn)}
  .ds-tabs{border-right:0;border-bottom:1px solid var(--lijn)}
  .ds-balk{border-radius:14px}
  .ds-bk{min-width:56px}
}

/* Lijst Te designen, rustiger (19 nov 2026, ronde 2) */
.ds-lijst-item{position:relative;grid-template-columns:64px minmax(0,1fr) auto;padding:10px 16px 10px 10px}
.ds-lijst-beeld,.ds-lijst-beeld.reel{width:64px;aspect-ratio:4/5}
.ds-lijst-tekst b{display:block;-webkit-line-clamp:unset;overflow:visible}
.ds-lijst-rechts{display:flex;align-items:center;gap:6px}
.ds-let-op{position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--merk-knop,var(--merk-accent));color:var(--merk-op-knop,#fff);font-weight:800;font-size:13px;display:grid;place-items:center;cursor:help}
.ds-let-op:hover::after{content:attr(data-tip);position:absolute;right:0;top:calc(100% + 8px);width:260px;background:var(--tekst);color:var(--vlak);font-weight:500;font-size:12.5px;line-height:1.5;padding:8px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:30;text-align:left}
.ds-lijst-item:has(.ds-let-op) .ds-lijst-rechts{margin-right:22px}

/* ===== 19 nov 2026 (3): feedback Merel ===== */
/* Groepskoppen in het zijpaneel */
.ds-blok h4{font-family:var(--font-kop);text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;font-weight:700;color:var(--merk-accent);margin:6px 0 2px}
.ds-tab-inhoud > .ds-blok:first-child h4{margin-top:0}
/* Namen onder de vakjes: hoogstens twee regels, de hele naam staat in de tooltip */
.ds-tpl > span,.ds-thema-naam,.ds-textuur > span:last-child,.ds-variant > span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.25}
/* Contextbalk: alleen knoppen */
.ds-wb-teller:empty{display:none}
/* Knoppenbalk: Bewaar, Download en Klaar met meer ruimte, Klaar niet gevuld */
.ds-bk-eind{display:flex;gap:12px;flex:none}
.ds-bk-eind .ds-menu-houder{display:flex}
/* Schermvullend: de pagina scrolt niet, het whiteboard en het paneel vullen de hoogte */
.werkvlak.ds-vol{overflow:hidden;display:flex;flex-direction:column;padding-bottom:14px}
.werkvlak.ds-vol > *{flex:none}
.werkvlak.ds-vol > .ds-werk{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}
.werkvlak.ds-vol .ds-studio{height:auto;min-height:0}
.werkvlak.ds-vol .ds-paneel{min-height:0}
.werkvlak.ds-vol .ds-tab-kolom{min-height:0}
@media (max-width: 900px){
  .werkvlak.ds-vol .ds-studio{display:flex;flex-direction:column;overflow:hidden}
  .werkvlak.ds-vol .ds-midden{flex:1 1 52%;height:auto;min-height:0}
  .werkvlak.ds-vol .ds-whiteboard{height:auto;min-height:0}
  .werkvlak.ds-vol .ds-midden{overflow:hidden}
  .werkvlak.ds-vol .ds-paneel{flex:1 1 48%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
  .werkvlak.ds-vol .ds-tab-inhoud{overflow-y:auto;max-height:none}
}
/* Sterkte bovenaan het tabblad Ontwerp */
.ds-sterkte span:first-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ds-sterkte input{max-width:none}
.ds-sterkte.uit{opacity:.45}

/* ===== 19 nov 2026 (4): zwevende opmaakbalk in het whiteboard, zoals bij Canva ===== */
.ds-midden{position:relative;grid-template-rows:minmax(0,1fr)}
.ds-werkbalk{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;max-width:calc(100% - 24px);width:max-content;
  display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-height:0;padding:6px 8px;background:var(--vlak);border:0;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.12)}
.ds-werkbalk:empty{display:none}
.ds-werkbalk .ds-wb-select{max-width:150px}
.ds-werkbalk .ds-schuif > span:first-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ds-werkbalk .ds-schuif input{min-width:70px;max-width:110px}
.ds-werkbalk .ds-menu-houder > .ds-wb-knop > span:not(.ds-kleurbol){display:none}
.ds-werkbalk .ds-menu-houder > .ds-wb-knop{padding:0 8px}
.ds-stijl span{font-size:15px;line-height:1;font-family:var(--font)}
.ds-strook{padding-top:72px}
.ds-pop .ds-schuif input{max-width:none;min-width:150px}
@media (max-width: 900px){
  .ds-werkbalk{left:12px;right:12px;transform:none;width:auto;max-width:none;overflow-x:auto;scrollbar-width:thin}
  .ds-werkbalk > *{flex:none}
}
.ds-werkbalk{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.ds-werkbalk > *{flex:none}
/* geen transform: anders vallen de vaste venstertjes (kleur, regelafstand) binnen de balk weg */
.ds-werkbalk{left:12px;right:12px;margin-inline:auto;transform:none}
@media (max-width: 900px){ .ds-werkbalk{width:auto;margin:0} }

const FOUTTEKST = {
  needs_reauth: k => `De koppeling met ${k} moet opnieuw worden ingelogd. Ga in Claude naar Instellingen, Connectors, en log opnieuw in bij ${k}.`,
  server_not_connected: k => `${k} is niet gekoppeld aan je Claude-account. Voeg de connector ${k} toe in Claude onder Instellingen, Connectors.`,
  not_granted: k => `Je hebt Content Studio geen toestemming gegeven voor ${k}. Klik op Instellingen en dan op Toestemmingen beheren.`,
  selection_required: k => `Claude vraagt welk ${k}-account je wilt gebruiken. Kies het in het venster van Claude en probeer het opnieuw.`,
  server_unavailable: k => `${k} reageert even niet. Probeer het zo opnieuw.`,
  rate_limited: k => `${k} krijgt even te veel vragen. Wacht een minuut en probeer het opnieuw.`,
  blocked_by_policy: k => `Je organisatie staat ${k} hier niet toe.`,
  tijd: k => `${k} reageerde niet op tijd. Probeer het opnieuw.`
};
CS.foutTekst = (e, koppeling) => {
  if (!e) return 'Er ging iets mis.';
  const f = FOUTTEKST[e.code];
  if (f) return f(koppeling || 'deze koppeling');
  if (e.code === 'tool_error'){
    const m = String(e.message || '');
    if (/allowance|quota|limit/i.test(m)) return `${koppeling || 'De koppeling'} heeft even het maximum aantal vragen voor je account bereikt. Binnen een uur werkt het weer. Je gegevens zijn veilig; er is niets veranderd.`;
    if (/not found|could not find|object_not_found/i.test(m)) return `${koppeling || 'De koppeling'} vindt de pagina of database niet. Kijk onder Instellingen welke koppelingen er gevonden zijn.`;
    return `${koppeling || 'De koppeling'} gaf een foutmelding. Probeer het zo opnieuw met Vernieuwen.`;
  }
  return (koppeling ? koppeling + ': ' : '') + (e.message || String(e)).slice(0, 240);
};
async function roep(koppeling, tool, invoer, opties){
  if (CS.staat.demo || !CS.staat.mcp) throw {code:'demo', message:'In de voorbeeldweergave is er geen koppeling.'};
  try{
    const r = await CS.staat.mcp.callTool(koppeling, tool, invoer, opties);
    return r;
  }catch(e){
    if (e && e.retryable && /^(notion-fetch|notion-query|notion-search|search_files|download_file_content)/.test(tool)){
      await CS.wacht(800 + Math.random() * 800);
      return await CS.staat.mcp.callTool(koppeling, tool, invoer, opties);
    }
    throw e;
  }
}

/* Notion */
CS.notion = {
  async rijen(bron, filter, sort, limit = 100){
    const data = {mode:'rows', data_source_url: bron, limit};
    if (filter) data.filter = filter;
    if (sort) data.sort = sort;
    const p = payload(await roep('Notion', 'notion-query-data-sources', {data}));
    return (p && (p.results || (p.data && p.data.results))) || [];
  },
  async view(viewUrl, max = 300){ // lezen via een weergave: valt niet onder de limiet op databasevragen
    let rijen = [], cursor = null, rondes = 0;
    do {
      const data = {mode:'view', view_url: viewUrl, page_size: 100};
      if (cursor) data.start_cursor = cursor;
      const p = payload(await roep('Notion', 'notion-query-data-sources', {data}));
      rijen = rijen.concat((p && p.results) || []);
      cursor = p && p.has_more ? p.next_cursor : null;
    } while (cursor && rijen.length < max && ++rondes < 10);
    return rijen;
  },
  async haal(id){
    const p = payload(await roep('Notion', 'notion-fetch', {id}));
    if (typeof p === 'string') return {text: p};
    return p || {};
  },
  async zoek(query){
    const p = payload(await roep('Notion', 'notion-search', {query, page_size: 10, max_highlight_length: 0}));
    return (p && p.results) || [];
  },
  async zetVelden(pageId, properties){
    return payload(await roep('Notion', 'notion-update-page', {page_id: pageId, command: 'update_properties', properties, allow_async: false}));
  }
};

/* Google Drive */
CS.drive = {
  async zoek(query, aantal = 100){
    const p = payload(await roep('Google Drive', 'search_files', {query, pageSize: aantal, excludeContentSnippets: true}));
    return (p && p.files) || [];
  },
  async map(naam, ouder){
    const q = `title = '${naam.replace(/'/g, "\\'")}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false` + (ouder ? ` and parentId = '${ouder}'` : '');
    const gevonden = await CS.drive.zoek(q, 5);
    if (gevonden.length) return gevonden[0].id;
    const invoer = {title: naam, contentMimeType: 'application/vnd.google-apps.folder'};
    if (ouder) invoer.parentId = ouder;
    const p = payload(await roep('Google Drive', 'create_file', invoer));
    return p.id;
  },
  /* Zoekt een map onder een van de namen (eerste naam is de huidige, de rest oudere namen) en maakt
     hem met de eerste naam aan als hij er niet is. Zie content-studio-afspraken.md, sectie 6. */
  async vindMap(namen, ouder, maak = true){
    for (const naam of namen){
      const q = `title = '${naam.replace(/'/g, "\\'")}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false` + (ouder ? ` and parentId = '${ouder}'` : '');
      const gevonden = await CS.drive.zoek(q, 5);
      if (gevonden.length) return gevonden[0].id;
    }
    return maak ? CS.drive.map(namen[0], ouder) : null;
  },
  namen: {
    contentinbox: ['1. Contentinbox', 'Contentinbox'],
    fotobibliotheek: ["2. Bibliotheek foto's", 'Fotobibliotheek'],
    videobibliotheek: ["3. Bibliotheek video's"],
    designs: ['4. Designs en edits'],
    carrousels: ['Carrousels'],
    reels: ['Reels']
  },
  async upload(titel, ouder, base64, mime = 'image/jpeg'){
    return payload(await roep('Google Drive', 'create_file', {title: titel, parentId: ouder, base64Content: base64, contentMimeType: mime, disableConversionToGoogleType: true}));
  },
  async deel(id){ return payload(await roep('Google Drive', 'share_file', {fileId: id, permissionId: 'anyoneWithLink', role: 'reader'})); },
  async prullenbak(id){ return payload(await roep('Google Drive', 'trash_file', {fileId: id})); },
  async verplaats(id, ouder, titel){ const i = {fileId: id, parentId: ouder}; if (titel) i.title = titel; return payload(await roep('Google Drive', 'update_file', i)); },
  async beeld(id){ // geeft een data-URL terug
    if (CS.cache.beelden.has(id)) return CS.cache.beelden.get(id);
    const r = await roep('Google Drive', 'download_file_content', {fileId: id});
    let src = null;
    for (const b of (r.content || [])){
      if (b.type === 'image' && b.data){ src = 'data:' + (b.mimeType || 'image/jpeg') + ';base64,' + b.data; break; }
      if (b.type === 'resource' && b.resource && b.resource.blob){ src = 'data:' + (b.resource.mimeType || 'application/octet-stream') + ';base64,' + b.resource.blob; break; }
    }
    const p = payload(r);
    if (!src && p && typeof p === 'object' && typeof p.content === 'string' && p.content.length > 200) src = 'data:' + (p.mimeType || 'image/jpeg') + ';base64,' + p.content;
    if (!src) throw {code:'geen_beeld', message:'Drive gaf dit bestand niet als afbeelding terug.'};
    CS.cache.beelden.set(id, src);
    return src;
  }
};

CS.kleurHex = (hs, waarde, thema) => {
  if (!waarde) return '#000000';
  if (/^#/.test(waarde)) return waarde;
  const t = thema || CS.thema(hs);
  if (t && ['achtergrond','kop','tekst','accent'].includes(waarde)) waarde = t[waarde];
  const k = (hs.kleuren || []).find(x => x.id === waarde);
  return k ? k.hex : (/^#/.test(waarde) ? waarde : '#000000');
};

const geladenFonts = new Set();
CS.laadFonts = async hs => {
  const google = [];
  for (const [rol, f] of Object.entries(hs.fonts || {})){
    if (!f || !f.familie) continue;
    const sleutel = f.familie + ':' + (f.gewicht || 400);
    if (geladenFonts.has(sleutel)) continue;
    geladenFonts.add(sleutel);
    if (f.bron === 'bestand' && f.asset){
      try{ const ff = new FontFace(f.familie, `url(${f.asset})`, {weight: String(f.gewicht || 400)}); await ff.load(); document.fonts.add(ff); }catch(e){ console.warn('Font laden mislukt', f.familie, e); }
    } else if (f.bron !== 'bestand'){
      google.push(f.familie.replace(/ /g,'+') + ':wght@' + [...new Set([400, f.gewicht || 400, 700])].sort().join(';'));
    }
  }
  if (google.length){
    document.head.appendChild(el('link', {rel:'stylesheet', href:'https://fonts.googleapis.com/css2?family=' + google.join('&family=') + '&display=swap'}));
  }
  const loads = Object.values(hs.fonts || {}).filter(f => f && f.familie).map(f => document.fonts.load(`${f.gewicht || 400} 40px "${f.familie}"`).catch(() => null));
  await Promise.race([Promise.all(loads), CS.wacht(4000)]);
};
CS.laadAssetBeeld = async url => { // asset-url naar blob-url, zodat het canvas schoon blijft bij exporteren
  if (!url) return null;
  if (CS.cache.beelden.has(url)) return CS.cache.beelden.get(url);
  try{ const r = await fetch(url); const b = await r.blob(); const u = URL.createObjectURL(b); CS.cache.beelden.set(url, u); return u; }
  catch(e){ return url; }
};

  let schema = {};
  try{ schema = JSON.parse(m[1]).schema || {}; }catch(e){ schema = {}; }
  const opties = naam => ((schema[naam] && (schema[naam].options || [])) || []).map(o => o.name);
  const statusOpties = schema.Status && schema.Status.groups ? Object.values(schema.Status.groups).flat().map(o => o.name) : opties('Status');
  const linkVeld = schema.Design ? 'Design' : schema.Drive ? 'Drive' : (schema.Canva ? 'Canva' : null);
  const soorten = opties('Soort');
  return {
    velden: Object.keys(schema), statussen: statusOpties, linkVeld,
    soortCarrousel: soorten.find(s => /^carr/i.test(s)) || 'Carrousel', soortReel: soorten.find(s => /^reel/i.test(s)) || 'Reel',
    heeftURL: !!schema['userDefined:URL'] || !!schema.URL

/* Een database vinden, met de bron (collection://) en een weergave zonder filters (view://).
   Lezen gaat via een weergave: dat valt niet onder de limiet die Notion zet op databasevragen. */
CS.kiesWeergave = tekst => {
  const views = [...String(tekst).matchAll(/<view url="\{?\{?(view:\/\/[0-9a-f-]{36})\}?\}?">\s*(\{[^\n]*\})/g)].map(m => { let j = {}; try{ j = JSON.parse(m[2].replace(/\{\{|\}\}/g, '')); }catch(e){} return {url: m[1], j}; });
  if (!views.length) return null;
  const zonderFilter = v => !(v.j.simpleFilters || []).some(f => f.filter && f.filter.value && (f.filter.value.value !== undefined || Array.isArray(f.filter.value))) && !(v.j.filter);
  const tabel = views.filter(v => !v.j.type || v.j.type === 'table');
  return (tabel.find(zonderFilter) || views.find(zonderFilter) || tabel[0] || views[0]).url;
};
CS.databaseInfo = async dbUrl => {
  const d = await CS.notion.haal(dbUrl);
  const t = d.text || '';
  const bron = (t.match(/collection:\/\/[0-9a-f-]{36}/) || [])[0] || null;
  return {db: dbUrl, bron, view: CS.kiesWeergave(t)};
};
CS.vindDatabase = async (zoektermen, patroon) => {
  for (const q of zoektermen){
    try{
      const res = await CS.notion.zoek(q);
      const r = res.find(x => x.type === 'database' && !/template|sjabloon/i.test(x.title || '') && patroon.test((x.title || '').trim()));
      if (r) return await CS.databaseInfo(r.url || r.id);
    }catch(e){}
  }
  return null;
};
CS.zorgVoorWeergave = async soort => { // soort: kalender, pillars of team
  const k = CS.staat.koppelingen;
  if (k[soort + 'View']) return k[soort + 'View'];
  let info = null;
  if (k[soort + 'Db']) info = await CS.databaseInfo(k[soort + 'Db']);
  else if (soort === 'kalender') info = await CS.vindDatabase(['Content Calendar', 'Contentkalender'], /content\s*(calendar|kalender)|contentkalender/i);
  else if (soort === 'pillars') info = await CS.vindDatabase(['Content Pillars'], /content\s*pillars?/i);
  else if (soort === 'team') info = await CS.vindDatabase(['Content Studio', 'Team'], /^(team|content studio)$/i);
  if (!info) return null;
  k[soort + 'Db'] = info.db; if (info.bron) k[soort] = info.bron; k[soort + 'View'] = info.view;
  CS.bewaarKoppelingen();
  return info.view;
};
CS.postUitRij = r => ({
  id: CS.idUitUrl(r.url), url: r.url, haakje: CS.zonderEscapes(String(r.Hook || '').replace(/<[^>]+>/g,'')), status: r.Status, soort: r.Soort, pillar: r.Pillar, fase: r.Fase, kanaal: r.Kanaal,
  datum: r['date:Publicatiedatum:start'] || null, link: r.Design || r.Drive || r.Canva || '', instagram: r['userDefined:URL'] || r.URL || ''
});
CS.laadPosts = async () => {
  if (CS.staat.demo){ CS.staat.posts = CS.DEMO.posts(); CS.staat.rijen = []; CS.staat.postsGeladen = true; return; }
  const view = await CS.zorgVoorWeergave('kalender');
  if (!view) throw {code:'geen_kalender', message:'Ik vind je Content Calendar niet in Notion.'};
  const rijen = await CS.notion.view(view, 600);
  CS.staat.rijen = rijen; // alle rijen zoals Notion ze geeft, voor Feed View en Analyses
  const statussen = ['Design','Video','Klaar','Gepland','Bezig','Fout','Live'];
  CS.staat.posts = rijen.map(CS.postUitRij).filter(p => p.id && statussen.includes(p.status) && (!p.kanaal || p.kanaal === 'Instagram') && p.soort !== 'Email');
  CS.staat.postsGeladen = true;
};
/* Vanuit Feed View een post openen in de Design Studio */
CS.openDesign = post => { CS.staat.designPost = post; CS.toonScherm('design', {post}); };
CS.isCarrousel = p => /^carr/i.test(p.soort || '');
CS.isReel = p => /^reel/i.test(p.soort || '');
CS.paginaTekst = async id => {
  if (CS.cache.paginas.has(id)) return CS.cache.paginas.get(id);
  const p = await CS.notion.haal(id);
  const t = p.text || '';
  CS.cache.paginas.set(id, t);
  return t;
};
CS.captionUit = tekst => { // de caption is het laatste codeblok in de body
  const blokken = [...String(tekst).matchAll(/```[^\n]*\n([\s\S]*?)```/g)].map(m => m[1].trim());
  return blokken.length ? blokken[blokken.length - 1] : '';
};

  const ke = document.getElementById('kop-extra'); if (ke){ ke.textContent = ''; ke.style.marginLeft = ''; }
  for (const b of document.querySelectorAll('#nav button')) b.setAttribute('aria-current', b.dataset.id === s.id ? 'page' : 'false');
  const w = document.getElementById('werkvlak');

CS.toonProfiel = () => {

  if (p.foto){ f.appendChild(el('img', {src: p.foto, alt: ''})); }
  else f.textContent = (p.naam || 'CS').split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();

/* Eén regel onder Vernieuwen: wanneer alles (Notion en de cijfers) voor het laatst is opgehaald.
   Zijn de cijfers ouder dan de posts, dan telt de oudste tijd: dat is het eerlijke moment. */
CS.toonBijgewerkt = () => {
  const n = document.getElementById('bijgewerkt'); if (!n) return;
  const tekst = t => { const d = new Date(t); const vandaag = d.toDateString() === new Date().toDateString(); return (vandaag ? 'vandaag' : 'op ' + CS.datumNL(d.toISOString().slice(0, 10), true)) + ' om ' + CS.tijdNL(d); };
  // Geen regel meer in de kop: de tijd verschijnt als pop-up als je met je muis op Vernieuwen staat.
  n.textContent = '';
  const vk = document.getElementById('knop-vernieuwen');
  if (!vk) return;
  const regels = ['Vernieuwen'];
  if (CS.staat.tijdNotion) regels.push('Posts bijgewerkt ' + tekst(CS.staat.tijdNotion));
  if (CS.staat.tijdCijfers) regels.push('Cijfers bijgewerkt ' + tekst(CS.staat.tijdCijfers));
  vk.dataset.tip = regels.join(String.fromCharCode(10));
  vk.removeAttribute('title');
};
CS.zetBijgewerkt = () => { CS.staat.bijgewerkt = new Date(); CS.staat.tijdNotion = CS.staat.bijgewerkt.toISOString(); CS.toonBijgewerkt(); };

/* ---------- opstarten ---------- */
CS.gebruik = async naam => {
  if (!window.claude || !window.claude.use) return null;
  try{ return await CS.metTijd(window.claude.use(naam), 10000, naam); }catch(e){ return null; }
